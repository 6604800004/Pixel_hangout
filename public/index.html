<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2e2235" />
<title>Pixel Hangout</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #2e2235;
  --ink2: #5a4f78;
  --paper: #fff7ec;
  --paper2: #ffeedd;
  --pink: #ff8fab;
  --pink2: #ffc2d2;
  --blue: #7d9cf0;
  --mint: #8fd694;
  --yellow: #ffe07a;
  --red: #e8505b;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  font-family: 'Mitr', 'Pixelify Sans', system-ui, -apple-system, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2e2235; overflow: hidden; }
body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
input, textarea { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; display: block; }

/* ---------- ปุ่มพิกเซล ---------- */
.pbtn {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
  padding: 6px 12px; font-weight: 500; font-size: 14px; line-height: 1.2; transition: transform .06s, box-shadow .06s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.pbtn:hover { background: #fff; }
.pbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.pbtn.sq { width: 40px; height: 40px; padding: 0; font-size: 18px; }
.pbtn.sm { padding: 4px 9px; font-size: 13px; }
.pbtn.pink { background: var(--pink); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.pbtn.blue { background: var(--blue); color: #fff; }
.pbtn.mint { background: var(--mint); }
.pbtn.danger { background: #ffd0d4; }
.pbtn.on { background: var(--yellow); }
.pbtn.off { background: #ffd0d4; }
.pbtn:disabled { opacity: .55; cursor: not-allowed; }

/* ---------- แถบบน ---------- */
.topbar {
  position: fixed; top: calc(10px + var(--safe-t)); left: 10px; right: 10px; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5;
}
.topbar > * { pointer-events: auto; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); max-width: 56vw;
}
.chip b { font-family: 'Pixelify Sans', 'Mitr', sans-serif; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .count { display: flex; gap: 3px; align-items: center; background: var(--paper2); border-radius: 8px; padding: 1px 7px; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--mint); border: 2px solid var(--ink); flex: none; }
.dot.off { background: var(--yellow); }
.dot.solo { background: #c8c4d0; }
.top-right { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.zoom { display: flex; gap: 6px; }
.banner {
  position: fixed; top: calc(62px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 4;
  background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px;
  box-shadow: 0 3px 0 var(--ink); max-width: min(560px, 92vw); text-align: center;
}

/* ---------- แผง ---------- */
.panel {
  position: fixed; z-index: 6; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 3px dashed #e6d4c2; }
.x { width: 34px; height: 34px; border: 0; background: var(--paper2); border-radius: 8px; font-size: 15px; flex: none; position: relative; touch-action: manipulation; }
.x::after { content: ''; position: absolute; inset: -8px; }
.people { top: calc(64px + var(--safe-t)); left: 10px; width: min(300px, calc(100vw - 20px)); max-height: 60dvh; display: flex; flex-direction: column; }
.people ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.people li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; }
.people li:hover { background: var(--paper2); }
.people canvas { width: 33px; height: 54px; image-rendering: pixelated; flex: none; }
.people .who { flex: 1; min-width: 0; }
.people .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.people .who small { color: var(--ink2); font-size: 12px; }
.note { margin: 0; padding: 8px 12px 12px; font-size: 12px; color: var(--ink2); }

/* ---------- ปุ่มแอ็กชันตามบริบท ---------- */
.actions {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--safe-b)); z-index: 5;
  display: flex; gap: 8px; pointer-events: none;
}
.actions .pbtn { pointer-events: auto; font-size: 15px; padding: 8px 16px; animation: pop .18s ease-out; }
.actions .hint { pointer-events: none; background: rgba(46,34,53,.85); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13px; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- แถบเครื่องมือล่าง ---------- */
.toolbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); z-index: 5;
  display: flex; gap: 6px; padding: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
}
.toolbar button {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 62px; padding: 5px 0 4px;
  border: 0; background: transparent; border-radius: 10px; font-size: 11.5px; color: var(--ink2);
}
.toolbar button i { font-style: normal; font-size: 22px; line-height: 1.15; }
.toolbar button:hover { background: var(--paper2); }
.toolbar button.active { background: var(--pink2); color: var(--ink); }
.badge { position: absolute; top: -4px; right: 4px; min-width: 18px; height: 18px; border-radius: 6px; background: var(--red); color: #fff; font-size: 11px; display: grid; place-items: center; border: 2px solid var(--ink); padding: 0 3px; }

.tray {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + var(--safe-b)); z-index: 6; display: flex; gap: 6px; align-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 6px; max-width: calc(100vw - 16px);
}
.tray .tray-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tray .emo { font-size: 26px; width: 46px; height: 46px; border: 0; background: var(--paper2); border-radius: 10px; flex: none; }
.tray .emo:hover { background: var(--pink2); transform: translateY(-2px); }
.tray .st { display: flex; flex-direction: column; align-items: center; font-size: 11px; width: 58px; padding: 4px 0; border: 0; background: var(--paper2); border-radius: 10px; flex: none; }
.tray .st i { font-style: normal; font-size: 20px; }
.tray .st.sel { background: var(--yellow); }
.tray .fb { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; padding: 4px 0; border: 0; background: var(--paper2); border-radius: 10px; flex: none; font-size: 11px; }
.tray .fb canvas { width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain; }
.tray .fb:hover { background: var(--pink2); }
.selbar { position: fixed; z-index: 6; display: flex; gap: 6px; transform: translate(-50%, -100%); }

/* ---------- แชต ---------- */
.chat {
  position: fixed; right: 12px; top: calc(64px + var(--safe-t)); bottom: calc(96px + var(--safe-b)); width: 310px; z-index: 5;
  display: flex; flex-direction: column; background: rgba(255,247,236,.96); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.chat.closed { display: none; }
.chat header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; border-bottom: 3px dashed #e6d4c2; }
.msgs { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; user-select: text; }
.msg { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; }
.msg canvas { width: 26px; height: 26px; image-rendering: pixelated; grid-row: span 2; background: var(--paper2); border-radius: 8px; }
.msg .meta { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.msg .meta b { font-weight: 600; }
.msg .meta time { color: #9a8fa8; font-size: 11px; }
.msg .text { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.cont { margin-top: -4px; }
.msg.cont canvas, .msg.cont .meta { display: none; }
.msg.cont .text { grid-column: 2; }
.msg.adm { position: relative; padding-right: 30px; border-radius: 8px; }
.msg.adm:hover { background: rgba(255,143,171,.08); }
.mdel { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-width: 24px; height: 22px; padding: 0 5px; border: 0; border-radius: 6px;
  background: var(--paper2); color: #b0546a; font-size: 11px; line-height: 1; touch-action: manipulation; }
.mdel.arm { background: var(--red); color: #fff; font-weight: 600; }
.sys { text-align: center; font-size: 12px; color: #9a8fa8; white-space: pre-line; }
.sys.help { text-align: left; background: #fff; border: 2px dashed #e6d4c2; border-radius: 10px; padding: 8px 10px; color: var(--ink2); line-height: 1.6; }
#helpBtn { margin-left: auto; margin-right: 6px; padding: 3px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }
.chat form { display: flex; gap: 6px; padding: 8px; border-top: 3px dashed #e6d4c2; }
.chat input { flex: 1; min-width: 0; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 15px; background: #fff; outline: none; }
.chat input:focus { border-color: var(--pink); }

/* ---------- โมดัล ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(46,34,53,.55); display: grid; place-items: center; padding: 12px; }
.card {
  width: min(760px, 100%); max-height: calc(100dvh - 24px); overflow: auto; background: var(--paper); border: 3px solid var(--ink);
  border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 18px;
}
.card h2 { margin: 0 0 4px; font-family: 'Pixelify Sans', 'Mitr', sans-serif; font-size: 24px; }
.card .sub { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
.creator { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
/* หน้าแต่งตัว/แต่งโต๊ะ: ภาพตัวอย่างอยู่กับที่ เลื่อนเฉพาะรายการตัวเลือก (ใช้ได้ทุกเบราว์เซอร์รวม Safari) */
.card.split { display: flex; flex-direction: column; overflow: hidden; height: min(720px, calc(100dvh - 24px)); }
.card.split > h2, .card.split > .sub, .card.split > .foot, .card.split > .tip { flex: none; }
.card.split .creator { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
.card.split .stage-wrap { align-self: start; }
.card.split .creator > .opts { overflow-y: auto; min-height: 0; padding: 2px 6px 8px 2px; overscroll-behavior: contain; }
.card.split .foot { margin-top: 10px; padding-top: 10px; border-top: 3px dashed #e6d4c2; }
.stage {
  position: relative; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; aspect-ratio: 1;
  background: repeating-linear-gradient(0deg, #e9c9a8 0 12px, #e2bf9b 12px 24px);
}
.stage canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.stage .turn { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.rot { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
.rot .pbtn { padding: 2px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; letter-spacing: .02em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.sw.sel { outline: 3px solid var(--pink); outline-offset: 2px; }
.ch { padding: 5px 10px; border-radius: 9px; border: 2px solid var(--ink); background: #fff; font-size: 13px; }
.ch.sel { background: var(--yellow); box-shadow: 0 2px 0 var(--ink); }
.field input { width: 100%; border: 3px solid var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 16px; background: #fff; outline: none; }
.field input:focus { border-color: var(--pink); }
.card .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.card .foot .pbtn { padding: 9px 18px; font-size: 15px; }
.tip { font-size: 12px; color: var(--ink2); margin: 10px 0 0; }

.loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: #fff7ec; z-index: 30; background: #2e2235; }
.spinner { width: 28px; height: 28px; background: var(--pink); border: 3px solid #fff7ec; animation: spin 1s steps(4) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.focus { position: fixed; inset: 0; z-index: 25; background: rgba(46,34,53,.92); display: grid; place-items: center; }
.focus video { max-width: 94vw; max-height: 86dvh; border: 4px solid #fff7ec; border-radius: 12px; }
.toast {
  position: fixed; z-index: 40; left: 50%; top: calc(70px + var(--safe-t)); transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
  background: var(--ink); color: #fff7ec; border-radius: 10px; padding: 8px 14px; font-size: 14px; transition: .2s; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- โซน / กระดาน ---------- */
.top-left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chip.zone { font-size: 13px; padding: 3px 10px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; background: var(--paper2); }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.btile { position: relative; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.btile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; background: #eee; }
.btile .bmeta { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; font-size: 12px; }
.btile .bmeta b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btile .bmeta small { color: var(--ink2); white-space: nowrap; }
.btile .x { position: absolute; top: 6px; right: 6px; background: rgba(255,247,236,.9); }
.focus img { max-width: 94vw; max-height: 88dvh; border: 4px solid #fff7ec; border-radius: 12px; background: #fff; }

/* ---------- YouTube ดูด้วยกัน ---------- */
.dock { position: fixed; left: 12px; bottom: calc(96px + var(--safe-b)); width: 400px; z-index: 6; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.yt { position: relative; width: 100%; background: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.35); overflow: hidden; }
.yt header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; color: #fff7ec; font-size: 13px; }
.yt header b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.ytbtns { display: flex; gap: 4px; }
.ytbtns button { width: 30px; height: 28px; border: 0; border-radius: 7px; background: rgba(255,247,236,.15); color: #fff; font-size: 14px; }
.ytbtns button:hover { background: rgba(255,247,236,.3); }
.ytbox { position: relative; aspect-ratio: 16 / 9; background: #000; }
.ytbox iframe, .ytbox #ytPlayer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#ytTap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; }
.yt.big { position: fixed; left: 50%; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(1100px, 94vw) !important; z-index: 12; }
.ytbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.scrtabs { display: flex; gap: 4px; padding: 0 8px 6px; flex-wrap: wrap; }
.scrtabs button { border: 0; border-radius: 7px; padding: 3px 8px; font-size: 12px; background: rgba(255,247,236,.15); color: #fff7ec; }
.scrtabs button.sel { background: var(--pink); color: #fff; }

.chip.zone { cursor: pointer; }
.micpop { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(100px + var(--safe-b)); width: min(320px, calc(100vw - 20px)); }
.micpop-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.micpop-body .row { gap: 5px; }
.micpop-body .sw { width: 26px; height: 26px; }
.micpop-body input[type=range] { width: 100%; }
.micpop-body .tip { margin: 0; }
@media (max-width: 760px) { .micpop-open .dock { visibility: hidden; } .micpop-body .tip + .tip { display: none; } }

/* ---------- ตั้งค่าเสียง/กล้อง ---------- */
.vset { display: grid; grid-template-columns: 250px 1fr; gap: 18px; }
.cam-prev { position: relative; aspect-ratio: 4 / 3; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #3a3150; display: grid; place-items: center; color: #fff7ec; font-size: 13px; }
.cam-prev video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.cam-prev video.back { transform: none; }
.vbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.vset select, .vset input[type=range] { width: 100%; }
.vset select { border: 3px solid var(--ink); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 14px; background: #fff; }
.vmeter { height: 14px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; margin-top: 6px; }
.vmeter i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--mint) 0 6px, #62b56c 6px 8px); transition: width .05s; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 6px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--pink); }
.mon { border: 3px dashed var(--pink); border-radius: 12px; padding: 10px 12px; background: #fff; }
.mon .warn { font-size: 12px; color: #c94a5a; margin: 6px 0 0; }
.mon input[type=range] { accent-color: var(--pink); margin-top: 6px; }

/* ---------- มือถือ ---------- */
@media (max-width: 760px) {
  .chat { left: 0; right: 0; top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); width: auto; border-radius: 0; border: 0; padding-top: var(--safe-t); padding-bottom: var(--safe-b); z-index: 15; background: var(--paper); }
  .toolbar { gap: 2px; padding: 4px; width: calc(100vw - 16px); justify-content: space-between; }
  .toolbar button { width: auto; flex: 1; font-size: 10.5px; }
  .toolbar button i { font-size: 20px; }
  .creator, .vset { grid-template-columns: 1fr; }
  .card.split { height: calc(100dvh - 24px); }
  .card.split .creator { grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  .stage-wrap { padding-bottom: 8px; border-bottom: 3px dashed #e6d4c2; }
  .stage { max-width: 140px; margin: 0 auto; width: 100%; }
  .card { padding: 14px; }
  .pbtn .lbl { display: none; }
  .chip b { display: none; }
  .top-right { gap: 4px; max-width: 60vw; }
  .bgrid { grid-template-columns: repeat(2, 1fr); }
  .dock { left: auto; right: 8px; width: min(64vw, 320px); top: calc(104px + var(--safe-t)); bottom: auto; }
  .yt header { font-size: 12px; padding: 4px 6px 4px 8px; }
  .ytbtns button { width: 26px; height: 24px; font-size: 12px; }
  .yt.big { width: 100vw !important; border-radius: 0; left: 50%; }
  .top-right:has(#micBtn:not(.hidden)) .zoom { display: none; }
  .pbtn.sq { width: 36px; height: 36px; font-size: 16px; }
  .chip b { font-size: 14px; }
  .actions { bottom: calc(86px + var(--safe-b)); }
  .tray { bottom: calc(80px + var(--safe-b)); }
}

.zoomtip { position: absolute; z-index: 50; transform-origin: top center; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; pointer-events: none; }

<script>
(() => {
'use strict';
// ============================================================================
// sprites.js — พิกเซลอาร์ตทั้งหมดวาดด้วยโค้ด (ไม่ต้องโหลดรูป) แล้วแคชไว้
// ============================================================================
const OUTLINE = '#2e2235';
const OUT_RGB = [0x2e, 0x22, 0x35];

const SKINS = ['#ffe6cf', '#f8cba3', '#e3a878', '#b8794e', '#7c4c30'];
const HAIR_COLORS = ['#3a2c3f', '#6b4430', '#b0703c', '#f0c96b', '#f08a6c', '#f5a3c7', '#8bb8f0', '#a98bf0', '#f4efe6', '#5cc39a'];
const CLOTH_COLORS = ['#ff8fab', '#ffb86b', '#ffe07a', '#8fd694', '#6cc6d9', '#7d9cf0', '#b48cf0', '#f4f1e8', '#5a5f7a', '#e8505b', '#3fa37a', '#c8a27a'];
const HAIR_STYLES = [['short', 'สั้น'], ['long', 'ยาว'], ['bob', 'บ็อบ'], ['spiky', 'ชี้ฟู'], ['bun', 'จุก'], ['twin', 'แกละ'], ['curly', 'หยิก']];
const TOPS = [['tee', 'เสื้อยืด'], ['hoodie', 'ฮู้ด'], ['dress', 'เดรส'], ['shirt', 'เชิ้ต+ไทด์'], ['overall', 'เอี๊ยม']];
const ACCS = [['none', 'ไม่มี'], ['glasses', 'แว่น'], ['shades', 'แว่นดำ'], ['cap', 'แก๊ป'], ['beanie', 'บีนนี่'], ['cat', 'หูแมว'], ['bunny', 'หูกระต่าย'], ['flower', 'ดอกไม้'], ['bow', 'โบว์'], ['headphones', 'หูฟัง'], ['crown', 'มงกุฎ'], ['halo', 'วงแหวน']];
const PETS = [['none', 'ไม่มี'], ['cat', 'แมว'], ['dog', 'หมา'], ['chick', 'ลูกเจี๊ยบ'], ['slime', 'สไลม์'], ['bunny', 'กระต่าย'], ['fish', 'ปลา'], ['dino', 'ไดโนเสาร์'], ['panda', 'หมีแพนด้า']];
// สีสัตว์เลี้ยง: ช่องแรก = สีธรรมชาติของแต่ละชนิด
const PET_COLORS = [null, '#f2a65a', '#c08552', '#8a8a9a', '#f4efe6', '#3a3150', '#ff8fab', '#7d9cf0', '#7ed37a', '#b48cf0', '#ffe07a', '#6cc6d9'];
const SEXES = [['m', 'ชาย'], ['f', 'หญิง']];
const DEFAULT_LOOK = { sex: 'm', skin: 1, hair: 'short', hc: 0, top: 'hoodie', tc: 5, bc: 8, acc: 'none', pet: 'none', pc: 0 };

function cleanLook(l) {
  const o = { ...DEFAULT_LOOK };
  if (!l || typeof l !== 'object') return o;
  const inRange = (v, n) => Number.isInteger(v) && v >= 0 && v < n;
  if (inRange(l.skin, SKINS.length)) o.skin = l.skin;
  if (inRange(l.hc, HAIR_COLORS.length)) o.hc = l.hc;
  if (inRange(l.tc, CLOTH_COLORS.length)) o.tc = l.tc;
  if (inRange(l.bc, CLOTH_COLORS.length)) o.bc = l.bc;
  if (HAIR_STYLES.some((h) => h[0] === l.hair)) o.hair = l.hair;
  if (TOPS.some((h) => h[0] === l.top)) o.top = l.top;
  if (ACCS.some((h) => h[0] === l.acc)) o.acc = l.acc;
  if (PETS.some((h) => h[0] === l.pet)) o.pet = l.pet;
  if (l.sex === 'f' || l.sex === 'm') o.sex = l.sex;
  if (inRange(l.pc, PET_COLORS.length)) o.pc = l.pc;
  return o;
}

// ---------- ยูทิลสี / แคนวาส ----------
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const f = (v) => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
// เติมเส้นขอบเข้มรอบพิกเซลที่ทึบ (ทำให้ทุกอย่างดูเป็นสไตล์เดียวกัน)
function addOutline(c, rgb = OUT_RGB) {
  const g = c.getContext('2d');
  const { width: w, height: h } = c;
  const src = g.getImageData(0, 0, w, h);
  const d = src.data;
  const out = g.createImageData(w, h);
  const o = out.data;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d[(y * w + x) * 4 + 3]);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] > 0) {
        o[i] = d[i]; o[i + 1] = d[i + 1]; o[i + 2] = d[i + 2]; o[i + 3] = d[i + 3];
      } else if (A(x - 1, y) > 120 || A(x + 1, y) > 120 || A(x, y - 1) > 120 || A(x, y + 1) > 120) {
        o[i] = rgb[0]; o[i + 1] = rgb[1]; o[i + 2] = rgb[2]; o[i + 3] = 255;
      }
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
function mirror(c) {
  const m = mkCanvas(c.width, c.height);
  const g = m.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return m;
}
const spriteCache = new Map();
function cached(key, make) {
  let s = spriteCache.get(key);
  if (!s) {
    s = make();
    spriteCache.set(key, s);
    if (spriteCache.size > 900) spriteCache.delete(spriteCache.keys().next().value);
  }
  return s;
}
// ตัวช่วยวาดสี่เหลี่ยม (พิกัดพิกเซล)
function painter(g, ox = 0, oy = 0) {
  return (x, y, w, h, col) => {
    if (!col) return;
    g.fillStyle = col;
    g.fillRect(x + ox, y + oy, w, h);
  };
}

// ============================================================================
// ตัวละคร 22x36, จุดยึดที่เท้า (11, 35)
// ============================================================================
const CHAR_W = 22, CHAR_H = 36;
function charSprite(look, dir, frame, pose, blink) {
  const key = `c|${look.sex}|${look.skin}|${look.hair}|${look.hc}|${look.top}|${look.tc}|${look.bc}|${look.acc}|${dir}|${frame}|${pose}|${blink ? 1 : 0}`;
  return cached(key, () => {
    const flip = dir === 'right';
    const d = flip ? 'left' : dir;
    const c = mkCanvas(CHAR_W, CHAR_H);
    const g = c.getContext('2d');
    const sit = pose === 'sit';
    const bob = sit ? 2 : (frame === 1 || frame === 3) ? -1 : 0;
    const L = painter(g, 0, 4);          // ช่วงล่าง (ไม่เด้ง)
    const U = painter(g, 0, 4 + bob);    // ช่วงบน (เด้งตามจังหวะเดิน)

    const skin = SKINS[look.skin], skinD = shade(skin, -0.13);
    const hc = HAIR_COLORS[look.hc], hcL = shade(hc, 0.22), hcD = shade(hc, -0.22);
    const tc = CLOTH_COLORS[look.tc], tcD = shade(tc, -0.2), tcL = shade(tc, 0.2);
    const bc = CLOTH_COLORS[look.bc], bcD = shade(bc, -0.22);
    const shoe = '#4a3a4a';
    const dress = look.top === 'dress';
    const fem = look.sex === 'f';
    // ผู้หญิง: ใส่กระโปรงอัตโนมัติ (ยกเว้นชุดเดรส/เอี๊ยม) ให้ต่างจากผู้ชายชัดๆ
    const skirt = fem && !dress && look.top !== 'overall';
    const legC = dress || skirt ? skin : bc, legD = dress || skirt ? skinD : bcD;
    const side = d === 'left';
    const EYE = '#2e2235';

    // ---------- ขา ----------
    if (sit) {
      if (d === 'down') { L(7, 27, 3, 2, legC); L(12, 27, 3, 2, legC); L(7, 29, 3, 1, shoe); L(12, 29, 3, 1, shoe); }
      else if (side) { L(6, 27, 6, 2, legC); L(5, 28, 2, 2, shoe); }
    } else if (side) {
      const a = frame === 1 ? -2 : frame === 3 ? 2 : 0;
      L(10 - a, 26, 2, 4, legD); L(9 - a, 30, 3, 1, shoe);
      L(10 + a, 26, 2, 4, legC); L(9 + a, 30, 3, 1, shoe);
    } else {
      const lu = frame === 1 ? 1 : 0, ru = frame === 3 ? 1 : 0;
      L(8, 26, 2, 4 - lu, legC); L(12, 26, 2, 4 - ru, legC);
      L(7, 30 - lu, 3, 1, shoe); L(12, 30 - ru, 3, 1, shoe);
    }

    // ---------- ฮู้ดด้านหลัง ----------
    if (look.top === 'hoodie' && d === 'up') U(6, 17, 10, 3, tcD);

    // ---------- ลำตัว ----------
    U(7, 19, 8, 7, tc);
    U(14, 19, 1, 7, tcD); U(7, 25, 8, 1, tcD);
    if (dress) { U(6, 23, 10, 3, tc); U(5, 25, 12, 2, tc); U(5, 27, 12, 1, tcD); U(15, 23, 1, 3, tcD); }
    if (skirt) { U(7, 24, 8, 2, bc); U(6, 25, 10, 2, bc); U(5, 27, 12, 1, bc); U(5, 28, 12, 1, bcD); U(9, 26, 1, 2, bcD); U(13, 26, 1, 2, bcD); }
    if (fem) { U(7, 22, 1, 2, tcD); U(14, 22, 1, 2, tcD); } // เอวคอด
    else { U(6, 19, 10, 1, tc); U(15, 19, 1, 1, tcD); }     // ไหล่กว้าง
    if (side) {
      const sw = frame === 1 ? -1 : frame === 3 ? 1 : 0;
      U(10 + sw, 20, 2, 3, tcD); U(10 + sw, 23, 2, 1, skin);
    } else {
      const sl = frame === 1 ? -1 : 0, sr = frame === 3 ? -1 : 0;
      U(6, 20 + sl, 1, 2, tc); U(6, 22 + sl, 1, 2, skin);
      U(15, 20 + sr, 1, 2, tcD); U(15, 22 + sr, 1, 2, skinD);
    }
    if (d === 'down') {
      if (look.top === 'hoodie') { U(8, 19, 6, 1, tcD); U(9, 20, 1, 2, '#ffffff'); U(12, 20, 1, 2, '#ffffff'); U(8, 23, 6, 2, tcD); }
      if (look.top === 'tee') { U(9, 19, 4, 1, tcL); }
      if (look.top === 'shirt') { U(8, 19, 2, 1, '#ffffff'); U(12, 19, 2, 1, '#ffffff'); U(10, 19, 2, 1, '#e05a6a'); U(10, 20, 2, 3, '#c94a5a'); }
      if (look.top === 'overall') { U(8, 21, 6, 5, bc); U(8, 19, 1, 2, bc); U(13, 19, 1, 2, bc); U(8, 21, 1, 1, '#ffe07a'); U(13, 21, 1, 1, '#ffe07a'); U(10, 23, 2, 1, bcD); }
      if (dress) { U(9, 19, 4, 1, tcL); U(7, 23, 8, 1, tcD); }
    } else if (side) {
      if (look.top === 'overall') { U(7, 21, 8, 5, bc); U(8, 19, 1, 2, bc); }
      if (look.top === 'hoodie') U(11, 18, 4, 2, tcD);
    } else if (look.top === 'overall') { U(7, 21, 8, 5, bc); U(8, 19, 1, 2, bc); U(13, 19, 1, 2, bc); }

    // ---------- หัว ----------
    U(6, 5, 10, 1, skin); U(5, 6, 12, 1, skin); U(4, 7, 14, 10, skin); U(5, 17, 12, 1, skin); U(6, 18, 10, 1, skin);
    if (d === 'down') U(17, 8, 1, 8, skinD);
    if (side) U(4, 8, 1, 8, skinD);

    // ---------- หน้า ----------
    if (d === 'down') {
      if (blink) { U(7, 13, 2, 1, EYE); U(13, 13, 2, 1, EYE); }
      else { U(7, 12, 2, 2, EYE); U(13, 12, 2, 2, EYE); U(7, 12, 1, 1, '#ffffff'); U(13, 12, 1, 1, '#ffffff'); }
      U(5, 14, 2, 1, '#ff9fb0'); U(15, 14, 2, 1, '#ff9fb0');
      if (fem) {
        if (!blink) { U(7, 11, 2, 1, EYE); U(13, 11, 2, 1, EYE); U(7, 14, 2, 1, '#5a4f78'); U(13, 14, 2, 1, '#5a4f78'); }
        U(6, 11, 1, 1, EYE); U(15, 11, 1, 1, EYE); U(6, 12, 1, 1, EYE); U(15, 12, 1, 1, EYE); // ขนตางอน
        U(5, 14, 2, 2, '#ff7f9c'); U(15, 14, 2, 2, '#ff7f9c'); U(10, 15, 2, 1, '#e8506e'); U(10, 16, 2, 1, '#ff8fab');

function petSprite(kind, frame, faceRight, pc = 0) {

    const c = mkCanvas(16, 16);
    const g = c.getContext('2d');
    const P = painter(g, 1, 1);
    const EYE = '#2e2235';
    const step = frame % 2;
    const pick = (natural) => PET_COLORS[pc] || natural;
    if (kind === 'cat' || kind === 'dog') {
      const col = pick(kind === 'cat' ? '#f2a65a' : '#c08552');
      const dk = shade(col, -0.25);
      P(4, 6, 7, 4, col); P(1, 3, 5, 5, col);
      if (kind === 'cat') { P(1, 2, 1, 1, col); P(4, 2, 1, 1, col); P(10, 3 + step, 1, 3, col); P(11, 3 + step, 1, 1, col); P(6, 6, 1, 4, dk); P(8, 6, 1, 4, dk); }
      else { P(0, 4, 1, 3, dk); P(5, 3, 1, 3, dk); P(11, 5 - step, 1, 2, col); P(4, 7, 4, 2, '#f4efe6'); }
      P(2, 5, 1, 1, EYE); P(1, 6, 1, 1, kind === 'cat' ? '#ff8fab' : EYE);
      P(4, 10, 1, 2 - step, dk); P(9, 10, 1, 1 + step, dk); P(6, 10, 1, 1 + step, col); P(8, 10, 1, 2 - step, col);
    } else if (kind === 'chick') {
      const col = pick('#ffe07a');
      const y = step;
      P(3, 4 + y, 7, 6, col); P(4, 3 + y, 5, 1, col); P(5, 2 + y, 2, 1, col);
      P(8, 6 + y, 2, 2, shade(col, -0.12)); P(4, 5 + y, 1, 1, EYE); P(2, 6 + y, 1, 1, '#ff9a3c');
      P(5, 10, 1, 2, '#ff9a3c'); P(7, 10, 1, 2, '#ff9a3c');
    } else if (kind === 'slime') {
      const col = pick('#7ee0a0');
      if (step) { P(2, 7, 9, 5, col); P(3, 6, 7, 1, col); }
      else { P(3, 5, 7, 7, col); P(4, 4, 5, 1, col); }
      P(4, step ? 8 : 7, 1, 2, EYE); P(7, step ? 8 : 7, 1, 2, EYE); P(4, step ? 7 : 5, 2, 1, shade(col, 0.5)); P(3, 11, 7, 1, shade(col, -0.25));
    } else if (kind === 'bunny') {
      const col = pick('#ffffff');
      P(4, 6, 6, 5, col); P(2, 4, 4, 4, col); P(2, 0, 1, 4, col); P(4, 0 + step, 1, 4, col);
      P(2, 1, 1, 2, '#ffc0d0'); P(3, 5, 1, 1, EYE); P(2, 6, 1, 1, '#ff8fab'); P(9, 7, 2, 2, shade(col, -0.06));
      P(4, 11, 2, 1, shade(col, -0.1)); P(8, 11, 2, 1, shade(col, -0.1));
    } else if (kind === 'fish') {
      // ปลาลอยตัวในฟองน้ำ ว่ายตามเจ้าของ
      const col = pick('#ff9a3c');
      const y = step ? 1 : 0;
      P(1, 3, 11, 9, 'rgba(160,220,255,.35)'); P(2, 2, 9, 1, 'rgba(160,220,255,.35)'); P(2, 12, 9, 1, 'rgba(160,220,255,.35)');
      P(3, 5 + y, 6, 4, col); P(4, 4 + y, 4, 1, col); P(4, 9 + y, 4, 1, col);

      P(4, 6 + y, 1, 1, EYE); P(6, 5 + y, 1, 4, shade(col, 0.35)); P(2, 3, 1, 1, '#ffffff');
    } else if (kind === 'dino') {

      P(5, 9, 5, 2, '#f6e7b8'); P(2, 3, 1, 1, EYE); P(1, 6, 3, 1, '#ffffff');
      for (const [x, y2] of [[4, 1], [6, 5], [8, 5], [10, 6]]) P(x, y2, 1, 1, dk);
      P(4, 8, 2, 1, dk);
      P(6, 11, 2, 1 + step, dk); P(9, 11, 2, 2 - step, dk);

      P(5, 11, 2, 1 + step, patch); P(9, 11, 2, 2 - step, patch);
    }

    const c = mkCanvas(d.w + 2, d.h + 2);

    d.draw(painter(g, 1, 1), v || 0, f || 0);

}

const RUG_COLORS = [['none', 'ไม่มี', null], ['pink', 'ชมพู', '#ffc6d6'], ['blue', 'ฟ้า', '#b9cbff'], ['green', 'เขียว', '#c4f0c8'], ['yellow', 'เหลือง', '#ffe9a8'], ['purple', 'ม่วง', '#dcc8ff']];
const DEFAULT_DESK = { c: 0, s: 'monitor', ch: 5, items: ['plant', 'coffee'], rug: 'none' };

function cleanDesk(s) {
  const o = { ...DEFAULT_DESK, items: [...DEFAULT_DESK.items] };
  if (!s || typeof s !== 'object') return o;
  if (Number.isInteger(s.c) && s.c >= 0 && s.c < DESK_COLORS.length) o.c = s.c;
  if (SETUPS.some((x) => x[0] === s.s)) o.s = s.s;
  if (Number.isInteger(s.ch) && s.ch >= 0 && s.ch < COLORWAYS.length) o.ch = s.ch;
  if (Array.isArray(s.items)) o.items = s.items.filter((k) => DESK_ITEMS.some((x) => x[0] === k)).slice(0, 3);
  if (RUG_COLORS.some((x) => x[0] === s.rug)) o.rug = s.rug;
  return o;
}

function drawDeskItem(P, kind, x, y) {
  // x = กึ่งกลาง, y = ฐาน
  switch (kind) {
    case 'plant': P(x - 2, y - 3, 4, 3, '#c96a4a'); P(x - 3, y - 7, 6, 4, '#62b56c'); P(x - 1, y - 9, 2, 2, '#8fd694'); P(x - 4, y - 6, 1, 2, '#3fa37a'); P(x + 3, y - 6, 1, 2, '#3fa37a'); break;
    case 'cactus': P(x - 2, y - 3, 4, 3, '#e08a62'); P(x - 1, y - 9, 3, 6, '#3fa37a'); P(x - 3, y - 7, 2, 3, '#3fa37a'); P(x + 2, y - 8, 1, 3, '#3fa37a'); P(x, y - 10, 1, 1, '#ff8fab'); break;
    case 'coffee': P(x - 2, y - 4, 4, 4, '#ffffff'); P(x + 2, y - 3, 1, 2, '#ffffff'); P(x - 1, y - 4, 2, 1, '#9a6438'); break;
    case 'boba': P(x - 2, y - 6, 4, 6, '#f2d6b0'); P(x - 2, y - 2, 4, 2, '#5a3a2a'); P(x - 2, y - 7, 4, 1, '#ffffff'); P(x + 1, y - 10, 1, 4, '#ff8fab'); break;
    case 'cat': P(x - 4, y - 5, 8, 5, '#f2a65a'); P(x - 4, y - 7, 2, 2, '#f2a65a'); P(x + 2, y - 7, 2, 2, '#f2a65a'); P(x - 2, y - 4, 1, 1, '#2e2235'); P(x + 1, y - 4, 1, 1, '#2e2235'); P(x + 4, y - 2, 2, 1, '#f2a65a'); break;

    case 'duck': P(x - 2, y - 3, 5, 3, '#ffe07a'); P(x - 2, y - 6, 3, 3, '#ffe07a'); P(x - 3, y - 5, 1, 1, '#ff9a3c'); P(x - 1, y - 5, 1, 1, '#2e2235'); break;

function deskSprite(style) {

    const scr = (x, y, w, h) => { P(x, y, w, h, '#3a3150'); P(x + 1, y + 1, w - 2, h - 3, '#7ec8ff'); P(x + 2, y + 2, Math.max(2, w - 8), 1, '#ffffff'); P(x + 2, y + 4, Math.max(2, w - 6), 1, '#c8ecff'); P(x + 2, y + 6, Math.max(2, w - 10), 1, '#ffd6e6'); };

      if (dx && dy && (grid[cy * GW + nx] || grid[ny * GW + cx])) continue;
      const ng = gScore[cur] + (dx && dy ? 1.414 : 1);
      if (ng < gScore[ni]) { gScore[ni] = ng; came[ni] = cur; push(ni, ng + hfn(ni)); }
    }
  }
  if (came[goal] < 0 && goal !== s) return null;
  const cells = [];
  for (let c = goal; c !== -1 && c !== s; c = came[c]) cells.push(c);
  cells.reverse();
  // ลดจุดที่เรียงเป็นเส้นตรง
  const pts = cells.map((c) => ({ x: (c % GW) * CELL + 2, y: ((c / GW) | 0) * CELL + 2 }));
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = out[out.length - 1], b = pts[i], n = pts[i + 1];
    if (a && n && Math.sign(b.x - a.x) === Math.sign(n.x - b.x) && Math.sign(b.y - a.y) === Math.sign(n.y - b.y) && (b.x - a.x) * (n.y - b.y) === (b.y - a.y) * (n.x - b.x)) continue;
    out.push(b);
  }
  if (out.length) out[out.length - 1] = { x: Math.abs(tx - out[out.length - 1].x) < 4 ? tx : out[out.length - 1].x, y: Math.abs(ty - out[out.length - 1].y) < 4 ? ty : out[out.length - 1].y };
  return prefix.concat(out);
}

// ---------- ที่นั่ง ----------
function allSeats(furniture) {
  const seats = [];
  for (const it of furniture) {
    const d = FURN[it.t];
    if (!d || !d.seats) continue;
    d.seats(it.f || 0).forEach((s, i) => seats.push({ id: `${it.id}:${i}`, x: it.x + s.dx, y: it.y + s.dy, dir: s.dir, kind: 'furn', over: !!s.over, itemY: it.y }));
  }
  for (const s of DESK_SLOTS) seats.push({ id: `desk:${s.id}`, x: s.x, y: s.y + CHAIR_DY - 3, dir: 'up', kind: 'desk', slot: s.id, over: true, itemY: s.y + CHAIR_DY });
  return seats;
}


// ============================================================================
// net.js — ตัวเชื่อมต่อ 3 แบบที่หน้าตาเหมือนกัน
//   claude : เปิดเป็นลิงก์ Claude (room = ใครออนไลน์ตอนนี้, db = ของที่ต้องจำไว้)
//   ws     : เปิดจากเซิร์ฟเวอร์ Node ของเราเอง (มีเสียง/กล้อง)
//   solo   : เล่นคนเดียว (เช่นตอนยังไม่ได้ล็อกอิน)
// ============================================================================
const COLS = ['furniture', 'desks', 'chat', 'settings', 'board', 'screens'];

function randomId(n = 10) {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------------------------------------------------------------- Claude ----
async function makeClaudeNet() {
  const use = (n) => Promise.resolve(window.claude.use(n)).catch(() => null);
  const [room, db, user] = await Promise.all([use('room'), use('db'), use('user')]);
  if (!room && !db) return null;
  const uid = user ? await user.id() : null;
  let profileName = '';
  if (user) { try { profileName = (await user.me()).name || ''; } catch {} }
  let canWrite = db ? (user ? await user.can('data.write') : null) : false;
  const listeners = { status: [], write: [] };
  const net = {
    mode: 'claude', uid, myKey: null, canWrite, voice: false, profileName,
    hasRoom: !!room, hasDb: !!db,
    setPresence(patch) { if (room) room.presence(patch).catch((e) => console.warn('presence', e && e.code)); },
    onPeers(cb) {
      if (!room) return;
      room.onPeers((ch) => {
        const list = ch.peers.map((p) => ({ key: p.peer, isMe: p.sameTab, by: p.by, guest: p.guest, kind: p.kind, p: p.presence || {} }));
        const mine = list.find((p) => p.isMe);
        if (mine) net.myKey = mine.key;
        cb(list);
      }, (e) => console.warn('room', e && e.code));
    },
    onStatus(cb) {
      listeners.status.push(cb);
      if (room) room.onConnection((c) => cb(c ? 'online' : 'offline'), () => cb('solo'));
      else cb('solo');
    },
    onWriteDenied(cb) { listeners.write.push(cb); },
    watch(col, cb, onTimeout) {
      if (!db) { cb([]); return; }
      let q = db.collection(col);
      if (col === 'chat') q = q.orderBy('ts', 'desc').limit(80);
      let done = false;
      const timer = setTimeout(() => { if (!done && onTimeout) onTimeout(); }, 10000);
      q.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) { done = true; clearTimeout(timer); }
        cb(snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })), snap.metadata);
      }, (e) => { done = true; clearTimeout(timer); console.warn('watch', col, e && e.code); });
    },
    async set(col, id, data) {
      if (!db || net.canWrite === false) throw new Error('readonly');
      try { await db.collection(col).doc(id).set(data); }
      catch (e) {
        if (e && e.code === 'invalid_argument') { net.canWrite = false; listeners.write.forEach((f) => f()); }
        throw e;
      }
    },
    async del(col, id) {
      if (!db || net.canWrite === false) throw new Error('readonly');
      try { await db.collection(col).doc(id).delete(); }
      catch (e) { if (e && e.code === 'invalid_argument') { net.canWrite = false; listeners.write.forEach((f) => f()); } throw e; }
    },
    async loadPrivate() {
      if (!db || !uid) return null;
      try { const s = await db.doc(`data/users/${uid}/profile`).get(); return s.exists ? s.data() : null; } catch { return null; }
    },
    async savePrivate(obj) {
      if (!db || !uid) return;
      try { await db.doc(`data/users/${uid}/profile`).set(obj); } catch {}
    },
    resolveNames: user ? async (ids) => { try { return await user.profiles(ids); } catch { return {}; } } : null,
  };
  return net;
}

// ---------------------------------------------------------- WebSocket ----
function makeWsNet(cfg) {
  let uid = lsGet('pixel.uid', null);
  if (!uid) { uid = 'u' + randomId(12); lsSet('pixel.uid', uid); }
  const peers = new Map();
  const cols = Object.fromEntries(COLS.map((c) => [c, new Map()]));
  const watchers = Object.fromEntries(COLS.map((c) => [c, []]));
  const L = { peers: [], status: [], signal: [], welcome: [], error: [], sys: [], chatdel: [], update: [], poke: [] };
  let ws = null, myPresence = {}, retry = 0, closedByUser = false, peerFlush = false;

  const emitPeers = () => {
    if (peerFlush) return;
    peerFlush = true;
    requestAnimationFrame(() => {
      peerFlush = false;
      const list = [...peers.values()].map((p) => ({ key: p.key, isMe: p.key === net.myKey, by: p.uid, guest: false, kind: 'viewer', p: p.p }));
      L.peers.forEach((f) => f(list));
    });
  };
  const emitCol = (col) => {
    const arr = [...cols[col].values()];
    if (col === 'chat') arr.sort((a, b) => b.ts - a.ts);
    watchers[col].forEach((f) => f(arr, { fromCache: false }));
  };
  const send = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    const me = ws;
    ws.onopen = () => send({ t: 'hello', uid, p: myPresence, password: net.password || '' });
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === 'welcome') {
        retry = 0;
        net.myKey = m.key;
        if (m.v) { if (net.build && net.build !== m.v) L.update.forEach((f) => f()); net.build = net.build || m.v; }
        if (Number.isFinite(m.now)) net.timeOffset = m.now - Date.now();
        net.iceServers = m.ice || net.iceServers;
        peers.clear();
        for (const p of m.peers) peers.set(p.key, p);
        peers.set(m.key, { key: m.key, uid, p: myPresence });
        for (const c of COLS) { cols[c].clear(); for (const d of m.cols[c] || []) cols[c].set(d.id, d); emitCol(c); }
        emitPeers();
        L.status.forEach((f) => f('online'));
        L.welcome.forEach((f) => f());
      } else if (m.t === 'peer') {
        peers.set(m.key, { key: m.key, uid: m.uid, p: m.p || {} });
        emitPeers();
      } else if (m.t === 'peer-left') {
        peers.delete(m.key); emitPeers();
      } else if (m.t === 'col') {
        if (!cols[m.col]) return;
        if (m.doc) cols[m.col].set(m.id, { ...m.doc, id: m.id }); else cols[m.col].delete(m.id);
        emitCol(m.col);
      } else if (m.t === 'signal') {
        L.signal.forEach((f) => f(m.from, m.data));
      } else if (m.t === 'poke') {
        L.poke.forEach((f) => f(m));
      } else if (m.t === 'chat-del') {
        if (m.ids === 'all') cols.chat.clear(); else if (Array.isArray(m.ids)) for (const id of m.ids) cols.chat.delete(id);
        emitCol('chat');
        L.chatdel.forEach((f) => f(m.ids));
      } else if (m.t === 'sys') {
        L.sys.forEach((f) => f(m));
      } else if (m.t === 'error') {
        closedByUser = true;
        L.error.forEach((f) => f(m));
      }
    };
    ws.onclose = () => {
      if (ws !== me) return;
      peers.clear(); emitPeers();
      if (closedByUser) return;
      L.status.forEach((f) => f('offline'));
      setTimeout(connect, Math.min(8000, 700 * 2 ** retry++));
    };
  }

  const net = {
    mode: 'ws', uid, myKey: null, canWrite: true, voice: true, profileName: '', hasRoom: true, hasDb: true,
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], roomName: cfg.roomName, password: '',
    start() { closedByUser = false; connect(); },
    stop() { closedByUser = true; try { ws && ws.close(); } catch {} },
    setPresence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete myPresence[k]; else myPresence[k] = v; }
      const mine = peers.get(net.myKey);
      if (mine) { mine.p = { ...myPresence }; emitPeers(); }
      send({ t: 'p', patch });
    },
    onPeers(cb) { L.peers.push(cb); },
    onStatus(cb) { L.status.push(cb); },
    onWelcome(cb) { L.welcome.push(cb); },
    onError(cb) { L.error.push(cb); },
    onSys(cb) { L.sys.push(cb); },
    onChatDel(cb) { L.chatdel.push(cb); },
    onUpdate(cb) { L.update.push(cb); },
    onPoke(cb) { L.poke.push(cb); },
    poke(name, key) { send({ t: 'poke', name, key }); },
    admin(cmd, key, arg, ban) { send({ t: 'admin', cmd, key, arg, ban: ban || 0 }); },
    onWriteDenied() {},
    watch(col, cb) { watchers[col].push(cb); },
    async set(col, id, data) {
      cols[col].set(id, { ...data, id }); emitCol(col);
      send({ t: 'set', col, id, doc: data });
    },
    async del(col, id) { cols[col].delete(id); emitCol(col); send({ t: 'del', col, id }); },
    async loadPrivate() { return lsGet('pixel.private', null); },
    async savePrivate(o) { lsSet('pixel.private', o); },
    signal(to, data) { send({ t: 'signal', to, data }); },
    // กระดานแนบรูป (มีเฉพาะเวอร์ชันเซิร์ฟเวอร์)
    timeOffset: 0, now() { return Date.now() + (net.timeOffset || 0); }, youtube: true,
    board: true, boardMax: cfg.boardMax || 20, boardTtl: cfg.boardTtl || 86400000, spotifyClientId: cfg.spotifyClientId || '',
    async uploadBoard(boardId, blob, meta) {
      const r = await fetch(`/api/board/${encodeURIComponent(boardId)}`, {
        method: 'POST', body: blob,
        headers: { 'Content-Type': blob.type, 'X-Name': encodeURIComponent(meta.n || ''), 'X-W': String(meta.w || 0), 'X-H': String(meta.h || 0), 'X-Room-Password': net.password || '' },
      });
      if (!r.ok) { let e = {}; try { e = await r.json(); } catch {} const err = new Error(e.error || 'upload'); err.code = e.error; throw err; }
      const j = await r.json();
      cols.board.set(j.id, { ...j.doc, id: j.id }); emitCol('board');
      return j;
    },
    clearBoard(b) { for (const [id, d] of cols.board) if (d.b === b) cols.board.delete(id); emitCol('board'); send({ t: 'board-clear', b }); },
    boardUrl(id, doc) { return `/board/${id}.${(doc && doc.ext) || 'jpg'}`; },
    onSignal(cb) { L.signal.push(cb); },
    resolveNames: null,
  };
  return net;
}

// --------------------------------------------------------------- Solo ----
function makeSoloNet(reason) {
  const store = lsGet('pixel.solo', {});
  for (const c of COLS) if (!Array.isArray(store[c])) store[c] = [];
  const watchers = Object.fromEntries(COLS.map((c) => [c, []]));
  let peerCb = null, me = {};
  const emit = (col) => {
    const arr = [...store[col]];
    if (col === 'chat') arr.sort((a, b) => b.ts - a.ts);
    watchers[col].forEach((f) => f(arr, { fromCache: false }));
  };
  const save = () => lsSet('pixel.solo', store);
  const net = {
    mode: 'solo', reason, uid: 'solo', myKey: 'me', canWrite: true, voice: false, profileName: '', hasRoom: false, hasDb: false,
    setPresence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete me[k]; else me[k] = v; }
      if (peerCb) peerCb([{ key: 'me', isMe: true, by: 'solo', p: { ...me } }]);
    },
    onPeers(cb) { peerCb = cb; },
    onStatus(cb) { cb('solo'); },
    onWriteDenied() {},
    watch(col, cb) { watchers[col].push(cb); setTimeout(() => emit(col)); },
    async set(col, id, data) {
      store[col] = store[col].filter((d) => d.id !== id).concat({ ...data, id });
      if (col === 'chat') store.chat = store.chat.slice(-80);
      save(); emit(col);
    },
    async del(col, id) { store[col] = store[col].filter((d) => d.id !== id); save(); emit(col); },
    async loadPrivate() { return lsGet('pixel.private', null); },
    async savePrivate(o) { lsSet('pixel.private', o); },
    resolveNames: null,
  };
  return net;
}

// ---------------------------------------------------- เลือกตัวเชื่อมต่อ ----
async function pickNet() {
  // 1) ถ้าเปิดเป็นลิงก์ Claude จะมี window.claude ให้ใช้
  for (let i = 0; i < 15 && !(window.claude && typeof window.claude.use === 'function'); i++) {
    if (i === 3 && location.protocol.startsWith('http')) {
      // 2) ลองถามเซิร์ฟเวอร์ Node ของเรา
      try {
        const r = await fetch('/config', { cache: 'no-store' });
        const cfg = r.ok ? await r.json() : null;
        if (cfg && cfg.app === 'pixel-hangout') return makeWsNet(cfg);
      } catch {}
    }
    await new Promise((r) => setTimeout(r, 100));
  }
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const n = await makeClaudeNet();
      if (n) return n;
    } catch (e) { console.warn(e); }
    return makeSoloNet('ยังเชื่อมต่อห้องไม่ได้ (ต้องล็อกอิน claude.ai และได้รับเชิญเข้าหน้านี้)');
  }
  return makeSoloNet('โหมดเล่นคนเดียว');
}


// ============================================================================
// voice.js — คุยเสียง/เปิดกล้องด้วย WebRTC (ใช้เฉพาะเวอร์ชันเซิร์ฟเวอร์ Node)
// ทุกคนต่อหากันตรงๆ (mesh) — คนที่ key น้อยกว่าเป็นฝ่ายโทร จึงไม่ชนกัน
// ============================================================================
function makeVoice(net, onChange) {
  const sink = document.createElement('div');
  sink.hidden = true;
  document.body.append(sink);
  const V = {
    audioTrack: null, videoTrack: null, mic: false, cam: false, deaf: false, hq: true,
    peers: new Map(), meters: new Map(), actx: null,
    selfVideo: Object.assign(document.createElement('video'), { muted: true, playsInline: true, autoplay: true }),
  };
  V.selfVideo.setAttribute('playsinline', '');
  sink.append(V.selfVideo);
  const chains = new Map(), pendingIce = new Map();

  function ensureCtx() {
    if (!V.actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { V.actx = new AC({ latencyHint: 'interactive' }); if (V.settings && V.settings.spkId && V.actx.setSinkId) V.actx.setSinkId(V.settings.spkId).catch(() => {}); } }
    if (V.actx && V.actx.state === 'suspended') V.actx.resume().catch(() => {});
    return V.actx;
  }
  function meter(key, track) {
    const old = V.meters.get(key);
    if (old) { try { old.src.disconnect(); } catch {} V.meters.delete(key); }
    if (!track || !ensureCtx()) return;
    try {
      const src = V.actx.createMediaStreamSource(new MediaStream([track]));
      const an = V.actx.createAnalyser(); an.fftSize = 512; src.connect(an);
      V.meters.set(key, { src, an, buf: new Float32Array(512), lvl: 0, hold: 0 });
    } catch {}
  }
  V.tick = (dt) => {
    for (const m of V.meters.values()) {
      m.an.getFloatTimeDomainData(m.buf);
      let s = 0; for (let i = 0; i < m.buf.length; i++) s += m.buf[i] * m.buf[i];
      m.lvl = m.lvl * 0.6 + Math.sqrt(s / m.buf.length) * 0.4;
      m.hold = m.lvl > 0.02 ? 0.3 : m.hold - dt;
    }
  };
  V.speaking = (key) => {
    if (key === net.myKey) return V.mic && !V.deaf && (V.meters.get('me')?.hold || 0) > 0;
    const p = V.peers.get(key);
    return !!(p && p.playOk) && (V.meters.get(key)?.hold || 0) > 0;
  };
  V.videoFor = (key) => {
    if (key === net.myKey) return V.cam && V.videoTrack ? V.selfVideo : null;
    const p = V.peers.get(key);
    return p && p.hasVideo && p.playOk ? p.videoEl : null;
  };

  function tuneOpus(sdp) {
    const m = sdp.match(/a=rtpmap:(\d+) opus\/48000/i);
    if (!m) return sdp;
    const want = { minptime: '10', useinbandfec: '1', usedtx: '0', stereo: '0', maxplaybackrate: '48000', maxaveragebitrate: V.hq ? '128000' : '48000' };
    const re = new RegExp(`a=fmtp:${m[1]} ([^\\r\\n]*)`);
    return sdp.replace(re, (_, params) => {
      const p = {};
      params.split(';').forEach((kv) => { const [k, v] = kv.trim().split('='); if (k) p[k] = v; });
      Object.assign(p, want);
      return `a=fmtp:${m[1]} ` + Object.entries(p).map(([k, v]) => `${k}=${v}`).join(';');
    });
  }
  async function tune(peer) {
    for (const [tx, max] of [[peer.audioTx, V.hq ? 128000 : 48000], [peer.videoTx, 700000], [peer.screenTx, 1800000]]) {
      if (!tx) continue;
      try {
        const p = tx.sender.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = max;
        if (tx === peer.videoTx) p.encodings[0].maxFramerate = 24;
        if (tx === peer.screenTx) { p.encodings[0].maxFramerate = 15; p.degradationPreference = 'maintain-resolution'; }
        await tx.sender.setParameters(p);
      } catch {}
    }
  }
  // ส่งเสียง/ภาพให้เฉพาะคนที่อยู่โซนเดียวกัน (คนละโซน = ไม่ส่งและไม่เล่นเสียง)
  function apply(peer) {
    const ok = !!peer.allowed;
    peer.audioTx?.sender.replaceTrack(ok ? V.audioTrack || null : null).catch(() => {});
    peer.videoTx?.sender.replaceTrack(ok && V.cam ? V.videoTrack : null).catch(() => {});
    peer.screenTx?.sender.replaceTrack(peer.screenOk && V.screenTrack ? V.screenTrack : null).catch(() => {});
    const play = !!peer.playOk;
    peer.audioEl.muted = V.deaf || V.bgMute || !play;
    if (play && !V.deaf && !V.bgMute) peer.audioEl.play().catch(() => {});
  }
  V.audience = new Set();
  V.screenAudience = new Set();
  V.setScreenAudience = (keys) => {
    V.screenAudience = keys;
    for (const p of V.peers.values()) {
      const ok = keys.has(p.key);
      if (ok !== p.screenOk) { p.screenOk = ok; p.screenTx?.sender.replaceTrack(ok && V.screenTrack ? V.screenTrack : null).catch(() => {}); }
    }
  };
  V.setVolume = (key, v) => {
    const p = V.peers.get(key);
    if (p && Math.abs((p.vol ?? 1) - v) > 0.04) { p.vol = v; try { p.audioEl.volume = v; } catch {} }
  };
  // sendKeys = คนที่เสียงเราไปถึง (ตามรัศมีไมค์ของเรา), playKeys = คนที่เราได้ยิน (ตามรัศมีไมค์ของเขา)
  V.playAud = new Set();
  V.setAudience = (sendKeys, playKeys = sendKeys) => {
    V.audience = sendKeys; V.playAud = playKeys;
    for (const p of V.peers.values()) {
      const ok = sendKeys.has(p.key), pl = playKeys.has(p.key);
      if (ok !== p.allowed || pl !== p.playOk) { p.allowed = ok; p.playOk = pl; apply(p); }
    }
  };
  function create(key, initiator) {
    close(key);
    const pc = new RTCPeerConnection({ iceServers: net.iceServers, bundlePolicy: 'max-bundle' });
    const audioEl = document.createElement('audio');
    audioEl.autoplay = true; audioEl.setAttribute('playsinline', ''); audioEl.muted = V.deaf;
    const videoEl = document.createElement('video');
    videoEl.autoplay = true; videoEl.muted = true; videoEl.playsInline = true; videoEl.setAttribute('playsinline', '');
    const screenEl = document.createElement('video');

function effectiveFurniture() {
  const base = G.furnDocs && G.furnDocs.length
    ? G.furnDocs.filter((d) => FURN[d.t])
    : DEFAULT_LAYOUT.map((d, i) => ({ ...d, id: 'def' + i, virtual: true }));
  // ของที่คนอื่นกำลังลากอยู่ (เห็นสดๆ)
  const live = new Map();
  for (const rt of G.others.values()) if (rt.p.dr && rt.p.dr.id) live.set(rt.p.dr.id, rt.p.dr);
  return base.map((it) => {
    const dr = live.get(it.id);
    return dr && Number.isFinite(dr.x) ? { ...it, x: dr.x, y: dr.y } : it;
  });
}
function rebuildWorld() {
  G.furniture = effectiveFurniture();
  G.rects = solidRects(G.furniture);
  G.grid = buildGrid(G.rects);
  G.seats = allSeats(G.furniture);
  G.seatById = new Map(G.seats.map((x) => [x.id, x]));
}

function deskInfo(slot) {

  for (const rt of G.others.values()) if (rt.p.dk && rt.p.dk.slot === slot) return { style: cleanDesk(rt.p.dk.style), name: rt.p.n || 'เพื่อน', look: rt.p.l, key: rt.key };

}

// ================================================================ ตัวละคร ====
function standUp() {
  if (!G.me.sit) return;
  G.me.sit = null;
  pres({ s: '' });
}
function sitOn(seat) {
  const me = G.me;
  me.path = null; me.pendingSeat = null;
  me.x = seat.x; me.y = seat.y; me.dir = seat.dir; me.sit = seat.id;
  pres({ x: me.x, y: me.y, d: me.dir, s: seat.id, m: 0 });
  SFX.sit();
}
function walkTo(x, y, seat) {
  standUp();
  G.me.pendingBoard = null; G.me.pendingScreen = null;
  const path = findPath(G.grid, G.me.x, G.me.y, x, y);
  if (!path) { toast('ไปตรงนั้นไม่ได้'); return; }
  G.me.path = path;
  G.me.pendingSeat = seat || null;
  G.camManual = false;
}
function seatTaken(seatId) {
  for (const rt of G.others.values()) if (rt.p.s === seatId) return true;
  return false;
}

function updateMe(dt) {
  const me = G.me;
  let vx = 0, vy = 0;
  const k = G.keys;
  if (k.has('ArrowLeft') || k.has('KeyA')) vx -= 1;
  if (k.has('ArrowRight') || k.has('KeyD')) vx += 1;
  if (k.has('ArrowUp') || k.has('KeyW')) vy -= 1;
  if (k.has('ArrowDown') || k.has('KeyS')) vy += 1;
  let moved = false;
  if (vx || vy) {
    me.path = null; me.pendingSeat = null; standUp();
    const len = Math.hypot(vx, vy); vx /= len; vy /= len;
    const step = SPEED * Math.min(dt, 0.05);
    const inside = hitsRects(G.rects, me.x, me.y);
    if (inside || !hitsRects(G.rects, me.x + vx * step, me.y)) { me.x += vx * step; moved = true; }
    if (inside || !hitsRects(G.rects, me.x, me.y + vy * step)) { me.y += vy * step; moved = true; }
    me.x = clamp(me.x, 6, W - 6); me.y = clamp(me.y, WALL + 2, H - 4);
  } else if (me.path && me.path.length) {
    const t = me.path[0];
    const dx = t.x - me.x, dy = t.y - me.y, d = Math.hypot(dx, dy);
    const step = SPEED * Math.min(dt, 0.05);
    if (d <= step) {
      me.x = t.x; me.y = t.y; me.path.shift();
      if (!me.path.length) {
        me.path = null;
        if (me.pendingScreen) { const sc = G.furniture.find((f) => f.id === me.pendingScreen); me.pendingScreen = null; if (sc) openScreenModal(sc); }
        if (me.pendingBoard) { const bd = G.furniture.find((f) => f.id === me.pendingBoard); me.pendingBoard = null; if (bd) openBoard(bd); }
        if (me.pendingSeat) {
          const seat = me.pendingSeat;
          if (Math.hypot(seat.x - me.x, seat.y - me.y) < 26 && !seatTaken(seat.id)) sitOn(seat);
          me.pendingSeat = null;
        }
      }
    } else { vx = dx / d; vy = dy / d; me.x += vx * step; me.y += vy * step; }
    moved = true;
  }
  if (moved && (vx || vy)) me.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right') : (vy < 0 ? 'up' : 'down');
  if (moved) { me.ft += dt; me.frame = Math.floor(me.ft * 8) % 4; }
  else { me.frame = 0; me.ft = 0; }
  if (moved) { pres({ x: Math.round(me.x), y: Math.round(me.y), d: me.dir, m: 1 }); me.wasMoving = true; }
  else if (me.wasMoving) { me.wasMoving = false; pres({ x: Math.round(me.x), y: Math.round(me.y), d: me.dir, m: 0 }); lsSet('pixel.pos', { x: me.x, y: me.y }); }
  me.walking = moved;
}

function updatePet(owner, pet, dt) {
  const side = owner.dir === 'left' ? 1 : owner.dir === 'right' ? -1 : (pet.x >= owner.x ? 1 : -1);
  const tx = owner.x + side * 13, ty = owner.y + (owner.dir === 'up' ? 6 : 2);
  const dx = tx - pet.x, dy = ty - pet.y, d = Math.hypot(dx, dy);
  if (d > 60) { pet.x = tx; pet.y = ty; }
  else if (d > 2) {
    const sp = Math.min(d, (owner.walking ? 80 : 40) * dt);
    pet.x += (dx / d) * sp; pet.y += (dy / d) * sp; pet.ft += dt;
    if (Math.abs(dx) > 1) pet.face = dx > 0;
  } else pet.ft = 0;
  if (!owner.walking && d <= 2) pet.face = owner.x > pet.x;
}

function updateOthers(dt) {
  const a = 1 - Math.exp(-dt * 12);
  for (const rt of G.others.values()) {
    const p = rt.p;
    if (!Number.isFinite(p.x)) continue;
    const d = Math.hypot(p.x - rt.x, p.y - rt.y);
    if (d > 120) { rt.x = p.x; rt.y = p.y; }
    else if (d > 0.01) {
      // เดินด้วยความเร็วเท่าการเดินจริง (ตามทันเร็วขึ้นถ้าห่างมาก) แทนการกระโดดตามทุกครั้งที่ได้ตำแหน่งใหม่
      // ตามหลังราวหนึ่งจังหวะอัปเดต แล้วเดินด้วยความเร็วคงที่ = ไม่หยุดๆ เดินๆ ระหว่างรอตำแหน่งใหม่
      const k = d > 40 ? 2 : d > 16 ? 1.25 : d > 5 ? 1 : 0.9;
      const step = Math.min(d, SPEED * k * dt);
      rt.x += ((p.x - rt.x) / d) * step; rt.y += ((p.y - rt.y) / d) * step;
    }
    rt.walking = !!p.m || d > 1.5;
    rt.dir = ['up', 'down', 'left', 'right'].includes(p.d) ? p.d : 'down';
    if (rt.walking && !p.s) { rt.ft += dt; rt.frame = Math.floor(rt.ft * 8) % 4; } else { rt.frame = 0; rt.ft = 0; }
    rt.look = cleanLook(p.l);
    updatePet(rt, rt.pet, dt);
  }
}

// ================================================================ คนในห้อง ====
function onPeers(list) {
  const now = performance.now();
  if (!G.firstPeersAt) G.firstPeersAt = now;
  const settled = now - G.firstPeersAt > 2500;
  const seen = new Set();
  let furnitureMoved = false;
  for (const peer of list) {
    if (peer.kind === 'agent') continue;
    if (peer.isMe) continue;
    const p = peer.p || {};
    seen.add(peer.key);
    let rt = G.others.get(peer.key);
    const isNew = !rt;
    if (!rt) {
      rt = { key: peer.key, by: peer.by, p, x: p.x || 250, y: p.y || 320, dir: 'down', ft: 0, frame: 0, walking: false, seed: Math.random() * 5, lastEm: p.em && p.em.ts, saySeen: new Set(), bubble: null, announced: false };
      rt.pet = { x: rt.x + 10, y: rt.y, face: false, ft: 0 };
      G.others.set(peer.key, rt);
    }
    const prevDr = rt.p.dr && rt.p.dr.id;
    rt.p = p; rt.by = peer.by; rt.guest = peer.guest;
    rt.look = cleanLook(p.l);
    if ((p.dr && p.dr.id) || prevDr) furnitureMoved = true;
    if (Number.isFinite(p.x) && !rt.announced) {
      rt.announced = true;
      if (settled) { addSys(`${p.n || 'เพื่อน'} เข้ามาในห้อง`); SFX.join(); }
      if (isNew || !Number.isFinite(rt.x)) { rt.x = p.x; rt.y = p.y; rt.pet.x = p.x + 10; rt.pet.y = p.y; }
    }
    // อีโมตใหม่
    if (p.em && p.em.ts && p.em.ts !== rt.lastEm) {
      rt.lastEm = p.em.ts;
      if (!isNew && EMOTES.includes(p.em.e)) G.emotes.push({ key: peer.key, e: p.em.e, start: now, dx: Math.random() * 10 - 5 });
    }
    // ข้อความใหม่
    if (Array.isArray(p.say)) {
      for (const m of p.say.slice(-3)) {
        if (!m || typeof m.i !== 'string' || typeof m.t !== 'string' || rt.saySeen.has(m.i)) continue;
        rt.saySeen.add(m.i);
        const fresh = !isNew && !G.messages.has(m.i);
        addMessage({ id: m.i, by: peer.by || p.uid || peer.key, n: p.n, l: p.l, text: m.t.slice(0, 200), ts: Number(m.ts) || Date.now() });
        if (fresh) { rt.bubble = { id: m.i, text: m.t.slice(0, 200), until: now + 6000, lines: null }; SFX.msg(); }
      }
    }
  }
  for (const key of [...G.others.keys()]) {
    if (!seen.has(key)) {
      const rt = G.others.get(key);
      if (rt.announced) { addSys(`${rt.p.n || 'เพื่อน'} ออกจากห้อง`); SFX.leave(); }
      G.others.delete(key);
      if (rt.p.dr) furnitureMoved = true;
    }
  }
  G.peerCount = 1 + [...G.others.values()].filter((r) => Number.isFinite(r.p.x)).length;
  $('#onlineCount').textContent = G.peerCount;
  if (furnitureMoved && !G.drag) rebuildWorld();
  if (!$('#people').classList.contains('hidden')) renderPeople();
  if (G.voice) G.voice.syncPeers([...G.others.keys()]);
}

let chatRenderQueued = false;
function scheduleChatRender() {

}
function renderChat() {

      const t = document.createElement('time'); t.textContent = new Date(m.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      meta.append(b, t); row.append(meta);
    }

    row.append(tx);
    if (G.isAdmin) {
      // แอดมิน: แตะ ✕ แล้วแตะ "ลบ" อีกครั้งเพื่อยืนยัน
      row.classList.add('adm');
      const del = document.createElement('button'); del.type = 'button'; del.className = 'mdel'; del.textContent = '✕'; del.title = 'ลบข้อความนี้';
      del.onclick = (e) => {
        e.stopPropagation();
        if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'ลบ'; setTimeout(() => { del.classList.remove('arm'); del.textContent = '✕'; }, 3000); return; }
        G.net.admin('delchat', lsGet('pixel.admin', '') || '', m.id);
      };
      row.append(del);
    }
    box.append(row);
    prev = m;
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}
// คำสั่งแอดมินในแชต (ไม่ถูกส่งเป็นข้อความ): admin <รหัส> · kick all · kick ชื่อ
// รายการคำสั่ง: ทุกคนเห็นคำสั่งทั่วไป · แอดมินเห็นคำสั่งแอดมินเพิ่ม
function showHelp() {
  const lines = [
    '📖 คำสั่งที่ทุกคนใช้ได้ (พิมพ์ในแชต ไม่ขึ้นให้คนอื่นเห็น)',
    '👉 poke ชื่อ — สะกิดเฉพาะคน (หรือ สะกิด ชื่อ / ชื่อ poke / poke all)',
    '🎧 bg on · bg off — เปิด/ปิด ได้ยินเสียงตอนพับจอหรือสลับแอป',
    '❓ help — ดูคำสั่งทั้งหมด (หรือ คำสั่ง / ?)',

    'ปุ่มลัด: แตะตัวละครตัวเอง = หันทิศ · คอม: R หัน, E นั่ง, Enter แชต',
  ];
  if (G.isAdmin) lines.push(

    '🛡️ คำสั่งแอดมิน (เครื่องนี้เป็นแอดมินอยู่)',
    '👢 kick ชื่อ · kick all — เตะออก (กลับเข้าได้ทันที)',
    '⏳ ชื่อ kick delay 1m — เตะ + ห้ามเข้าตามเวลา (30s, 5m, 1h · all kick delay 10m)',
    '🧹 clear chat — ล้างแชตทั้งหมด (หรือ ล้างแชท)',
    '✕ แตะ ✕ ที่ข้อความ แล้วแตะ "ลบ" — ลบทีละข้อความ',
    '🚪 admin off — เลิกเป็นแอดมินในเครื่องนี้',
  );
  addMessage({ id: 'sys' + randomId(6), sys: true, help: true, text: lines.join('\n'), ts: Date.now() });
  if (!G.chatOpen) setChatOpen(true);
}
function chatCommand(text) {
  if (!G.net) return false;
  if (/^\/?(help|คำสั่ง|\?|commands?)$/i.test(text)) { showHelp(); return true; }
  if (/^\/?admin\s+(off|logout|ออก)$/i.test(text)) { lsSet('pixel.admin', null); G.isAdmin = false; scheduleChatRender(); addSys('เลิกเป็นแอดมินในเครื่องนี้แล้ว'); return true; }
  // สะกิด: poke ชื่อ / สะกิด ชื่อ / ชื่อ poke
  let p = text.match(/^\/?(?:poke|สะกิด|สกิด|จิ้ม)\s+(.+)$/i) || text.match(/^(.+?)\s+(?:poke|สะกิด|สกิด)$/i);
  if (p) { pokeByName(p[1].trim()); return true; }
  // ได้ยินเสียงตอนพับจอ: bg on/off · พับจอ เปิด/ปิด
  p = text.match(/^\/?(?:bg|background|พับจอ|เสียงพื้นหลัง|ฟังตอนพับจอ)\s*(on|off|เปิด|ปิด)?$/i);
  if (p) { const v = (p[1] || '').toLowerCase(); setBgAudio(v ? v === 'on' || v === 'เปิด' : !G.bgAudio); return true; }
  if (!G.net.admin) return false;
  let m = text.match(/^\/?admin\s+(\S+)$/i);
  if (m) { G.pendingAdminKey = m[1]; G.net.admin('login', m[1]); return true; }
  if (/^\/?(clear chat|clearchat|ล้างแช[ทต]|ลบแช[ทต]ทั้งหมด)$/i.test(text)) { G.net.admin('delchat', lsGet('pixel.admin', '') || '', 'all'); return true; }
  // เวลาห้ามเข้า: 30s / 1m / 2h (หรือ วิ / นาที / ชม.) — ไม่ใส่หน่วย = นาที
  const UNIT = '(\\d+(?:\\.\\d+)?)\\s*(s|sec|m|min|h|hr|วิ|วินาที|นาที|ชม\\.?|ชั่วโมง)?';
  const toMs = (n, u = 'm') => Number(n) * (/^(s|sec|วิ|วินาที)$/i.test(u) ? 1000 : /^(h|hr|ชม\.?|ชั่วโมง)$/i.test(u) ? 3600000 : 60000);
  const key = lsGet('pixel.admin', '') || '';
  m = text.match(new RegExp('^(.+?)\\s+(?:kick|เตะ)\\s+delay\\s+' + UNIT + '$', 'i'));        // หมี kick delay 1m
  if (m) { G.net.admin('kick', key, m[1].trim(), toMs(m[2], m[3])); return true; }
  m = text.match(new RegExp('^\\/?(?:kick|เตะ)\\s+(.+?)\\s+delay\\s+' + UNIT + '$', 'i'));    // kick หมี delay 1m
  if (m) { G.net.admin('kick', key, m[1].trim(), toMs(m[2], m[3])); return true; }
  m = text.match(/^\/?(?:kick|เตะ)\s+(.+)$/i);                                             // kick หมี / kick all
  if (m) { G.net.admin('kick', key, m[1].trim(), 0); return true; }
  return false;
}
function sendChat(text) {
  text = text.trim().slice(0, 200);
  if (!text) return;
  if (chatCommand(text)) return;
  const ts = Date.now();
  const m = { i: randomId(9), t: text, ts };
  G.mySay = [...G.mySay.slice(-2), m];
  pres({ say: G.mySay });
  addMessage({ id: m.i, by: myBy(), n: G.me.nick, l: G.me.look, text, ts });
  G.me.bubble = { id: m.i, text, until: performance.now() + 6000, lines: null };
  if (G.net.hasDb && G.net.canWrite !== false) {
    G.net.set('chat', m.i, { uid: G.net.uid || '', n: G.me.nick, l: G.me.look, text, ts }).then(pruneChat).catch(() => {});
  }
  const box = $('#msgs'); requestAnimationFrame(() => (box.scrollTop = box.scrollHeight));
}
function pruneChat() {
  if (G.chatDocs.length < 80) return;
  const old = [...G.chatDocs].sort((a, b) => a.ts - b.ts).slice(0, 12);
  (async () => { for (const d of old) { try { await G.net.del('chat', d.id); } catch { break; } } })();
}
function updateBadge() {

function resize() {

// ตำแหน่งย่อยระดับพิกเซลจอ (1/scale) — ตัวละครเดินลื่นไม่กระตุกทีละพิกเซลโลก

function render(t) {
  const { cw, ch, dpr } = G.view;
  const base = Math.max(2, Math.floor(Math.min(cw / 440, ch / 300)));
  G.scale = clamp(base + G.zoomAdj, 1, 7);
  const scale = G.scale;
  const bw = cw / scale, bh = ch / scale; // ขนาดที่มองเห็นในหน่วยพิกเซลโลก
  // วาดบัฟเฟอร์ที่ความละเอียดจอ (ไม่ใช่ความละเอียดโลก) เพื่อให้กล้อง/ตัวละครเลื่อนได้ทีละพิกเซลจอ
  const pw = Math.ceil(cw), ph = Math.ceil(ch);
  if (buf.width !== pw || buf.height !== ph) { buf.width = pw; buf.height = ph; }

  // กล้อง
  const me = G.me;
  // กล้องตามจุดกึ่งกลาง (ตัวละคร หรือจุดที่ลากไว้ตอนจัดห้อง) — ซูมเข้า/ออกแล้วตัวละครยังอยู่กลางจอเสมอ
  // เผื่อที่ให้แผงแชตด้านขวาบนจอใหญ่ ให้อยู่กลางพื้นที่ที่มองเห็นจริง

  else { tx = me.x; ty = me.y - 16; }
  if (!G.cam.ready) { G.cam.cx = tx; G.cam.cy = ty; G.cam.ready = true; }
  const ca = 1 - Math.exp(-(G.frameDt || 1 / 60) * 10);
  G.cam.cx += (tx - G.cam.cx) * ca; G.cam.cy += (ty - G.cam.cy) * ca;
  if (Math.abs(tx - G.cam.cx) < 0.05) G.cam.cx = tx;
  if (Math.abs(ty - G.cam.cy) < 0.05) G.cam.cy = ty;
  // มือถือ: ถ้ามีหน้าต่าง YouTube/แชร์จอบังกลางจอ ให้ตัวละครอยู่กลางพื้นที่ที่เหลือด้านล่าง
  // ระหว่างปรับรัศมีไมค์: ซ่อนหน้าต่างวิดีโอ แล้วให้ตัวละคร+วงอยู่กลางพื้นที่เหนือแผง
  const pop = document.getElementById('micPop');
