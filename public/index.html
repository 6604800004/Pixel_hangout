function deskSprite(style) {
  const s = cleanDesk(style);
  return cached(`d|${s.c}|${s.s}|${s.items.join(',')}`, () => {
    const c = mkCanvas(42, 42);
    const g = c.getContext('2d');
    const P = painter(g, 1, 1);
    const [, l, m, d] = DESK_COLORS[s.c];
    // พื้นโต๊ะ + หน้าโต๊ะ + ขา
    P(1, 14, 38, 12, l); P(2, 15, 36, 1, shade(l, 0.25));
    P(1, 26, 38, 8, m); P(26, 27, 11, 6, d); P(30, 29, 3, 1, '#ffd34d');
    P(2, 34, 4, 5, d); P(34, 34, 4, 5, d);
    // ชุดคอม
    const scr = (x, y, w, h) => { P(x, y, w, h, '#3a3150'); P(x + 1, y + 1, w - 2, h - 3, '#7ec8ff'); P(x + 2, y + 2, Math.max(2, w - 8), 1, '#ffffff'); P(x + 2, y + 4, Math.max(2, w - 6), 1, '#c8ecff'); P(x + 2, y + 6, Math.max(2, w - 10), 1, '#ffd6e6'); };
    if (s.s === 'laptop') { P(13, 20, 14, 3, '#b0b4c4'); P(14, 21, 12, 1, '#d8dbe6'); P(13, 10, 14, 10, '#9aa0b8'); P(14, 11, 12, 8, '#7ec8ff'); P(15, 12, 6, 1, '#ffffff'); P(15, 14, 9, 1, '#c8ecff'); }
    if (s.s === 'monitor' || s.s === 'gaming') { scr(10, 2, 20, 14); P(18, 16, 4, 3, '#5a5f7a'); P(15, 19, 10, 1, '#5a5f7a'); }
    if (s.s === 'dual') { scr(3, 3, 17, 13); scr(20, 3, 17, 13); P(10, 16, 3, 3, '#5a5f7a'); P(27, 16, 3, 3, '#5a5f7a'); P(8, 19, 24, 1, '#5a5f7a'); }
    if (s.s === 'crt') { P(10, 2, 20, 18, '#e8dcc0'); P(11, 3, 18, 1, '#fff6e0'); P(12, 4, 16, 11, '#2f3245'); P(13, 5, 14, 9, '#5ad08a'); P(14, 6, 7, 1, '#c8ffd8'); P(14, 8, 10, 1, '#9cf0b8'); P(26, 17, 2, 1, '#e8505b'); }
    if (s.s !== 'none' && s.s !== 'laptop') { P(11, 21, 18, 3, '#e8e4ee'); P(12, 22, 16, 1, '#c8c4d0'); P(31, 21, 2, 3, '#e8e4ee'); }
    if (s.s === 'gaming') {
      const rgb = ['#e8505b', '#ffb86b', '#ffe07a', '#8fd694', '#6cc6d9', '#b48cf0'];
      rgb.forEach((col, i) => P(11 + i * 3, 24, 3, 1, col));
      P(32, 4, 6, 18, '#2f3245'); P(33, 6, 4, 2, '#b48cf0'); P(33, 10, 4, 1, '#6cc6d9'); P(33, 13, 4, 1, '#ff8fab');
    }
    // ของบนโต๊ะ: ช่องซ้าย, ช่องขวา, ช่องหลังซ้าย
    const slots = s.s === 'gaming' || s.s === 'dual' ? [[6, 24], [34, 24], [6, 18]] : [[6, 24], [34, 24], [6, 16]];
    s.items.forEach((k, i) => drawDeskItem(P, k, slots[i][0], slots[i][1]));
    addOutline(c);
    return c;
  });
}

  const h = date.getHours() + date.getMinutes() / 60;
  if (h >= 6 && h < 8) return { top: '#ffb38a', bot: '#ffe1a8', night: 0.1, sun: true };
  if (h >= 8 && h < 16.5) return { top: '#7ec4ff', bot: '#cfeaff', night: 0, sun: true };
  if (h >= 16.5 && h < 18.5) return { top: '#ff8f7a', bot: '#ffd08a', night: 0.12, sun: true };
  if (h >= 18.5 && h < 19.5) return { top: '#6a5aa8', bot: '#f29ab4', night: 0.22, sun: false };
  return { top: '#1d1b45', bot: '#3a3a78', night: 0.34, sun: false };
}

  if (out.length) out[out.length - 1] = { x: Math.abs(tx - out[out.length - 1].x) < 4 ? tx : out[out.length - 1].x, y: Math.abs(ty - out[out.length - 1].y) < 4 ? ty : out[out.length - 1].y };
  return prefix.concat(out);
}

// ---------- ที่นั่ง ----------
function allSeats(furniture) {
  const seats = [];
  for (const it of furniture) {
    const d = FURN[it.t];
    if (!d || !d.seats) continue;
    d.seats(it.f || 0).forEach((s, i) => seats.push({ id: `${it.id}:${i}`, x: it.x + s.dx, y: it.y + s.dy, dir: s.dir, kind: 'furn', over: !!s.over, itemY: it.y, pray: it.t === 'prayerMat' }));
  }
  for (const s of DESK_SLOTS) seats.push({ id: `desk:${s.id}`, x: s.x, y: s.y + CHAIR_DY - 3, dir: 'up', kind: 'desk', slot: s.id, over: true, itemY: s.y + CHAIR_DY });
  return seats;
}


// ============================================================================
// net.js — ตัวเชื่อมต่อ 3 แบบที่หน้าตาเหมือนกัน
//   claude : เปิดเป็นลิงก์ Claude (room = ใครออนไลน์ตอนนี้, db = ของที่ต้องจำไว้)
//   ws     : เปิดจากเซิร์ฟเวอร์ Node ของเราเอง (มีเสียง/กล้อง)
//   solo   : เล่นคนเดียว (เช่นตอนยังไม่ได้ล็อกอิน)
// ============================================================================
const COLS = ['furniture', 'desks', 'chat', 'settings', 'board', 'screens'];

function randomId(n = 10) {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------------------------------------------------------------- Claude ----
async function makeClaudeNet() {
  const use = (n) => Promise.resolve(window.claude.use(n)).catch(() => null);
  const [room, db, user] = await Promise.all([use('room'), use('db'), use('user')]);
  if (!room && !db) return null;
  const uid = user ? await user.id() : null;
  let profileName = '';
  if (user) { try { profileName = (await user.me()).name || ''; } catch {} }
  let canWrite = db ? (user ? await user.can('data.write') : null) : false;
  const listeners = { status: [], write: [] };
  const net = {
    mode: 'claude', uid, myKey: null, canWrite, voice: false, profileName,
    hasRoom: !!room, hasDb: !!db,
    setPresence(patch) { if (room) room.presence(patch).catch((e) => console.warn('presence', e && e.code)); },
    onPeers(cb) {
      if (!room) return;
      room.onPeers((ch) => {
        const list = ch.peers.map((p) => ({ key: p.peer, isMe: p.sameTab, by: p.by, guest: p.guest, kind: p.kind, p: p.presence || {} }));
        const mine = list.find((p) => p.isMe);
        if (mine) net.myKey = mine.key;
        cb(list);
      }, (e) => console.warn('room', e && e.code));
    },
    onStatus(cb) {
      listeners.status.push(cb);
      if (room) room.onConnection((c) => cb(c ? 'online' : 'offline'), () => cb('solo'));
      else cb('solo');
    },
    onWriteDenied(cb) { listeners.write.push(cb); },
    watch(col, cb, onTimeout) {
      if (!db) { cb([]); return; }
      let q = db.collection(col);
      if (col === 'chat') q = q.orderBy('ts', 'desc').limit(80);
      let done = false;
      const timer = setTimeout(() => { if (!done && onTimeout) onTimeout(); }, 10000);
      q.onSnapshot((snap) => {
        if (!snap.metadata.fromCache) { done = true; clearTimeout(timer); }
        cb(snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })), snap.metadata);
      }, (e) => { done = true; clearTimeout(timer); console.warn('watch', col, e && e.code); });
    },
    async set(col, id, data) {
      if (!db || net.canWrite === false) throw new Error('readonly');
      try { await db.collection(col).doc(id).set(data); }
      catch (e) {
        if (e && e.code === 'invalid_argument') { net.canWrite = false; listeners.write.forEach((f) => f()); }
        throw e;
      }
    },
    async del(col, id) {
      if (!db || net.canWrite === false) throw new Error('readonly');
      try { await db.collection(col).doc(id).delete(); }
      catch (e) { if (e && e.code === 'invalid_argument') { net.canWrite = false; listeners.write.forEach((f) => f()); } throw e; }
    },
    async loadPrivate() {
      if (!db || !uid) return null;
      try { const s = await db.doc(`data/users/${uid}/profile`).get(); return s.exists ? s.data() : null; } catch { return null; }
    },
    async savePrivate(obj) {
      if (!db || !uid) return;
      try { await db.doc(`data/users/${uid}/profile`).set(obj); } catch {}
    },
    resolveNames: user ? async (ids) => { try { return await user.profiles(ids); } catch { return {}; } } : null,
  };
  return net;
}

// ---------------------------------------------------------- WebSocket ----
function makeWsNet(cfg) {
  let uid = lsGet('pixel.uid', null);
  if (!uid) { uid = 'u' + randomId(12); lsSet('pixel.uid', uid); }
  const peers = new Map();
  const cols = Object.fromEntries(COLS.map((c) => [c, new Map()]));
  const watchers = Object.fromEntries(COLS.map((c) => [c, []]));
  const L = { move: [], peers: [], status: [], signal: [], welcome: [], error: [], sys: [], chatdel: [], update: [], poke: [], relay: [] };
  let ws = null, myPresence = {}, retry = 0, closedByUser = false, peerFlush = false;

  const emitPeers = () => {
    if (peerFlush) return;
    peerFlush = true;
    requestAnimationFrame(() => {
      peerFlush = false;
      const list = [...peers.values()].map((p) => ({ key: p.key, isMe: p.key === net.myKey, by: p.uid, guest: false, kind: 'viewer', p: p.p }));
      L.peers.forEach((f) => f(list));
    });
  };
  const emitCol = (col) => {
    const arr = [...cols[col].values()];
    if (col === 'chat') arr.sort((a, b) => b.ts - a.ts);
    watchers[col].forEach((f) => f(arr, { fromCache: false }));
  };
  const send = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';
    const me = ws;
    ws.onopen = () => { let ak = ''; try { ak = JSON.parse(localStorage.getItem('pixel.admin') || '""') || ''; } catch {} send({ t: 'hello', uid, p: myPresence, password: net.password || '', ak }); };
    ws.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) {
        // เสียงสำรองผ่านเซิร์ฟเวอร์: [1][ยาวคีย์][คีย์ผู้ส่ง][เสียง μ-law]
        const u = new Uint8Array(ev.data);
        if (u[0] !== 1 || u.length < 3) return;
        const kl = u[1], from = String.fromCharCode(...u.subarray(2, 2 + kl));
        const audio = u.slice(2 + kl);
        L.relay.forEach((f) => f(from, audio));
        return;
      }
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === 'welcome') {
        retry = 0;
        net.hasTurn = !!m.turn; net.myKey = m.key;
        if (m.v) { if (net.build && net.build !== m.v) L.update.forEach((f) => f()); net.build = net.build || m.v; }
        if (Number.isFinite(m.now)) net.timeOffset = m.now - Date.now();
        net.iceServers = m.ice || net.iceServers;
        clearTimeout(net.dropT);
        peers.clear();
        for (const p of m.peers) peers.set(p.key, p);
        peers.set(m.key, { key: m.key, uid, p: myPresence });
        for (const c of COLS) { cols[c].clear(); for (const d of m.cols[c] || []) cols[c].set(d.id, d); emitCol(c); }
        emitPeers();
        L.status.forEach((f) => f('online'));
        L.welcome.forEach((f) => f());
      } else if (m.t === 'peer') {
        peers.set(m.key, { key: m.key, uid: m.uid, p: m.p || {} });
        emitPeers();
      } else if (m.t === 'mv') {
        // ตำแหน่งแบบย่อ: แก้ในวัตถุเดิม (ตัวเกมอ่านค่าเองทุกเฟรม ไม่ต้องสร้างรายชื่อใหม่)
        const pr = peers.get(m.k);
        if (pr && Number.isFinite(m.x) && Number.isFinite(m.y)) { pr.p.x = m.x; pr.p.y = m.y; if (m.d) pr.p.d = m.d; pr.p.m = m.m ? 1 : 0; if (Number.isFinite(m.ts)) pr.p.t = m.ts; L.move.forEach((f) => f(m.k, pr.p)); }
      } else if (m.t === 'peer-left') {
        peers.delete(m.key); emitPeers();
      } else if (m.t === 'cols') {
        // ข้อมูลห้องทั้งก้อน (ได้คืนจากเซิร์ฟเวอร์ตัวเก่า/ที่สำรองไว้)
        for (const c of COLS) { if (!m.cols || !Array.isArray(m.cols[c])) continue; cols[c].clear(); for (const d of m.cols[c]) cols[c].set(d.id, d); emitCol(c); }
      } else if (m.t === 'col') {
        if (!cols[m.col]) return;
        if (m.doc) cols[m.col].set(m.id, { ...m.doc, id: m.id }); else cols[m.col].delete(m.id);
        emitCol(m.col);
      } else if (m.t === 'signal') {
        L.signal.forEach((f) => f(m.from, m.data));
      } else if (m.t === 'poke') {
        L.poke.forEach((f) => f(m));
      } else if (m.t === 'chat-del') {
        if (m.ids === 'all') cols.chat.clear(); else if (Array.isArray(m.ids)) for (const id of m.ids) cols.chat.delete(id);
        emitCol('chat');
        L.chatdel.forEach((f) => f(m.ids));
      } else if (m.t === 'sys') {
        L.sys.forEach((f) => f(m));
      } else if (m.t === 'error') {
        closedByUser = true;
        L.error.forEach((f) => f(m));
      }
    };
    ws.onclose = () => {
      if (ws !== me) return;
      // หลุดชั่วคราว (เช่น เซิร์ฟเวอร์รีสตาร์ตตอนอัปเดต): ยังไม่ลบเพื่อนออกทันที ให้ต่อใหม่ก่อน ภาพจะไม่ "เด้ง"
      clearTimeout(net.dropT);
      if (closedByUser) { peers.clear(); emitPeers(); return; }
      net.dropT = setTimeout(() => { if (!ws || ws.readyState !== 1) { peers.clear(); emitPeers(); } }, 12000);
      L.status.forEach((f) => f('offline'));
      setTimeout(connect, Math.min(8000, 700 * 2 ** retry++));
    };
  }

  const net = {
    mode: 'ws', uid, myUid: uid, myKey: null, canWrite: true, voice: true, profileName: '', hasRoom: true, hasDb: true,
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], roomName: cfg.roomName, password: '',
    start() { closedByUser = false; connect(); },
    stop() { closedByUser = true; try { ws && ws.close(); } catch {} },
    setPresence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete myPresence[k]; else myPresence[k] = v; }
      const mine = peers.get(net.myKey);
      const moveOnly = Object.keys(patch).every((k) => k === 'x' || k === 'y' || k === 'd' || k === 'm' || k === 't');
      if (mine) { mine.p = { ...myPresence }; if (!moveOnly) emitPeers(); }
      send({ t: 'p', patch });
    },
    onPeers(cb) { L.peers.push(cb); },
    onMove(cb) { L.move.push(cb); },
    onStatus(cb) { L.status.push(cb); },
    onWelcome(cb) { L.welcome.push(cb); },
    onError(cb) { L.error.push(cb); },
    onSys(cb) { L.sys.push(cb); },
    onChatDel(cb) { L.chatdel.push(cb); },
    onUpdate(cb) { L.update.push(cb); },
    onPoke(cb) { L.poke.push(cb); },
    onRelay(cb) { L.relay.push(cb); },
    relaySend(keys, audio) {
      if (!ws || ws.readyState !== 1 || ws.bufferedAmount > 64000) return; // เน็ตช้า: ทิ้งเฟรมดีกว่าดีเลย์สะสม
      const ks = keys.slice(0, 16).map((k) => String(k).slice(0, 40));
      let len = 2 + audio.length; for (const k of ks) len += 1 + k.length;
      const b = new Uint8Array(len); b[0] = 1; b[1] = ks.length; let o = 2;
      for (const k of ks) { b[o++] = k.length; for (let i = 0; i < k.length; i++) b[o++] = k.charCodeAt(i) & 0x7f; }
      b.set(audio, o); ws.send(b);
    },
    poke(name, key) { send({ t: 'poke', name, key }); },
    admin(cmd, key, arg, ban) { send({ t: 'admin', cmd, key, arg, ban: ban || 0 }); },
    mod(cmd, key, ban) { send({ t: 'mod', cmd, key, ban: ban || 0 }); },
    onWriteDenied() {},
    watch(col, cb) { watchers[col].push(cb); },
    async set(col, id, data) {
      cols[col].set(id, { ...data, id }); emitCol(col);
      send({ t: 'set', col, id, doc: data });
    },
    async del(col, id) { cols[col].delete(id); emitCol(col); send({ t: 'del', col, id }); },
    async loadPrivate() { return lsGet('pixel.private', null); },
    async savePrivate(o) { lsSet('pixel.private', o); },
    signal(to, data) { send({ t: 'signal', to, data }); },
    // กระดานแนบรูป (มีเฉพาะเวอร์ชันเซิร์ฟเวอร์)
    timeOffset: 0, now() { return Date.now() + (net.timeOffset || 0); }, youtube: true,
    board: true, boardMax: cfg.boardMax || 20, boardTtl: cfg.boardTtl || 86400000, spotifyClientId: cfg.spotifyClientId || '', lastfm: !!cfg.lastfm,
    async uploadBoard(boardId, blob, meta) {
      const r = await fetch(`/api/board/${encodeURIComponent(boardId)}`, {
        method: 'POST', body: blob,
        headers: { 'Content-Type': blob.type, 'X-Name': encodeURIComponent(meta.n || ''), 'X-W': String(meta.w || 0), 'X-H': String(meta.h || 0), 'X-Room-Password': net.password || '' },
      });
      if (!r.ok) { let e = {}; try { e = await r.json(); } catch {} const err = new Error(e.error || 'upload'); err.code = e.error; throw err; }
      const j = await r.json();
      cols.board.set(j.id, { ...j.doc, id: j.id }); emitCol('board');
      return j;
    },
    // แนบไฟล์ในแชต (มีแถบความคืบหน้า)
    uploadFile(file, onProgress) {
      return new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open('POST', '/api/file');
        x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        x.setRequestHeader('X-Name', encodeURIComponent(file.name || 'file'));
        x.setRequestHeader('X-Room-Password', net.password || '');
        x.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
        x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} if (x.status === 200 && j.id) resolve(j); else { const err = new Error(j.error || 'upload'); err.code = j.error; err.max = j.max; reject(err); } };
        x.onerror = () => reject(new Error('network'));
        x.send(file);
      });
    },
    clearBoard(b) { for (const [id, d] of cols.board) if (d.b === b) cols.board.delete(id); emitCol('board'); send({ t: 'board-clear', b }); },
    boardUrl(id, doc) { return `/board/${id}.${(doc && doc.ext) || 'jpg'}`; },
    onSignal(cb) { L.signal.push(cb); },
    resolveNames: null,
  };
  return net;
}

// --------------------------------------------------------------- Solo ----
function makeSoloNet(reason) {
  const store = lsGet('pixel.solo', {});
  for (const c of COLS) if (!Array.isArray(store[c])) store[c] = [];
  const watchers = Object.fromEntries(COLS.map((c) => [c, []]));
  let peerCb = null, me = {};
  const emit = (col) => {
    const arr = [...store[col]];
    if (col === 'chat') arr.sort((a, b) => b.ts - a.ts);
    watchers[col].forEach((f) => f(arr, { fromCache: false }));
  };
  const save = () => lsSet('pixel.solo', store);
  const net = {
    mode: 'solo', reason, uid: 'solo', myKey: 'me', canWrite: true, voice: false, profileName: '', hasRoom: false, hasDb: false,
    setPresence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete me[k]; else me[k] = v; }
      if (peerCb) peerCb([{ key: 'me', isMe: true, by: 'solo', p: { ...me } }]);
    },
    onPeers(cb) { peerCb = cb; },
    onStatus(cb) { cb('solo'); },
    onWriteDenied() {},
    watch(col, cb) { watchers[col].push(cb); setTimeout(() => emit(col)); },
    async set(col, id, data) {
      store[col] = store[col].filter((d) => d.id !== id).concat({ ...data, id });
      if (col === 'chat') store.chat = store.chat.slice(-80);
      save(); emit(col);
    },
    async del(col, id) { store[col] = store[col].filter((d) => d.id !== id); save(); emit(col); },
    async loadPrivate() { return lsGet('pixel.private', null); },
    async savePrivate(o) { lsSet('pixel.private', o); },
    resolveNames: null,
  };
  return net;
}

// ---------------------------------------------------- เลือกตัวเชื่อมต่อ ----
async function pickNet() {
  // 1) ถ้าเปิดเป็นลิงก์ Claude จะมี window.claude ให้ใช้
  for (let i = 0; i < 15 && !(window.claude && typeof window.claude.use === 'function'); i++) {
    if (i === 3 && location.protocol.startsWith('http')) {
      // 2) ลองถามเซิร์ฟเวอร์ Node ของเรา
      try {
        const r = await fetch('/config', { cache: 'no-store' });
        const cfg = r.ok ? await r.json() : null;
        if (cfg && cfg.app === 'pixel-hangout') return makeWsNet(cfg);
      } catch {}
    }
    await new Promise((r) => setTimeout(r, 100));
  }
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const n = await makeClaudeNet();
      if (n) return n;
    } catch (e) { console.warn(e); }
    return makeSoloNet('ยังเชื่อมต่อห้องไม่ได้ (ต้องล็อกอิน claude.ai และได้รับเชิญเข้าหน้านี้)');
  }
  return makeSoloNet('โหมดเล่นคนเดียว');
}


// ============================================================================
// voice.js — คุยเสียง/เปิดกล้องด้วย WebRTC (ใช้เฉพาะเวอร์ชันเซิร์ฟเวอร์ Node)
// ทุกคนต่อหากันตรงๆ (mesh) — คนที่ key น้อยกว่าเป็นฝ่ายโทร จึงไม่ชนกัน
// ============================================================================
// คุณภาพแชร์จอ (แบบ Discord)
const SHARE_Q = {
  saver: { w: 854, h: 480, fps: 30, br: 1200000, name: '480p 30fps · ประหยัดเน็ต' },
  smooth: { w: 1280, h: 720, fps: 60, br: 4500000, name: '720p 60fps · ลื่น (แนะนำ)' },
  sharp: { w: 1920, h: 1080, fps: 30, br: 5000000, name: '1080p 30fps · คมชัด (ตัวหนังสือ/งาน)' },
  max: { w: 1920, h: 1080, fps: 60, br: 8000000, name: '1080p 60fps · สูงสุด (เน็ตแรงเท่านั้น)' },
};
function makeVoice(net, onChange) {
  const sink = document.createElement('div');
  sink.hidden = true;
  document.body.append(sink);
  const V = {
    audioTrack: null, videoTrack: null, mic: false, cam: false, deaf: false, hq: true,
    peers: new Map(), meters: new Map(), actx: null,
    selfVideo: Object.assign(document.createElement('video'), { muted: true, playsInline: true, autoplay: true }),
  };
  V.selfVideo.setAttribute('playsinline', '');
  sink.append(V.selfVideo);
  const chains = new Map(), pendingIce = new Map();

  function ensureCtx() {
    if (!V.actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { V.actx = new AC({ latencyHint: 'interactive' }); if (V.settings && V.settings.spkId && V.actx.setSinkId) V.actx.setSinkId(V.settings.spkId).catch(() => {}); } }
    if (V.actx && V.actx.state === 'suspended') V.actx.resume().catch(() => {});
    return V.actx;
  }
  function meter(key, track) {
    const old = V.meters.get(key);
    if (old) { try { old.src.disconnect(); } catch {} V.meters.delete(key); }
    if (!track || !ensureCtx()) return;
    try {
      const src = V.actx.createMediaStreamSource(new MediaStream([track]));
      const an = V.actx.createAnalyser(); an.fftSize = 512; src.connect(an);
      V.meters.set(key, { src, an, buf: new Float32Array(512), lvl: 0, hold: 0 });
    } catch {}
  }
  V.tick = (dt) => {
    for (const m of V.meters.values()) {
      m.an.getFloatTimeDomainData(m.buf);
      let s = 0; for (let i = 0; i < m.buf.length; i++) s += m.buf[i] * m.buf[i];
      m.lvl = m.lvl * 0.6 + Math.sqrt(s / m.buf.length) * 0.4;
      m.hold = m.lvl > 0.02 ? 0.3 : m.hold - dt;
    }
  };
  V.speaking = (key) => {
    if (key === net.myKey) return V.mic && !V.deaf && (V.meters.get('me')?.hold || 0) > 0;
    const p = V.peers.get(key);
    return !!(p && p.playOk) && (V.meters.get(key)?.hold || 0) > 0;
  };
  V.videoFor = (key) => {

  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = Array.from(lines[maxLines - 1]).slice(0, -1).join('') + '…'; }
  return lines;
}
// วางข้อความกึ่งกลางเอง (บางเบราว์เซอร์/ส่วนขยายทำให้ textAlign = center ไม่ทำงาน)

function lookColor(look) { return colOf(cleanLook(look).tc, CLOTH_COLORS) || '#ff8fab'; } // รองรับสีเลือกเอง (hex)

// ========================================================= โลก + เฟอร์นิเจอร์ ====
function effectiveFurniture() {
  const base = G.furnDocs && G.furnDocs.length
    ? G.furnDocs.filter((d) => FURN[d.t])
    : DEFAULT_LAYOUT.map((d, i) => ({ ...d, id: 'def' + i, virtual: true })).filter((d) => !d.gone);
  // ของที่คนอื่นกำลังลากอยู่ (เห็นสดๆ)
  const live = new Map();
  for (const rt of G.others.values()) if (rt.p.dr && rt.p.dr.id) live.set(rt.p.dr.id, rt.p.dr);
  return base.map((it) => {
    const dr = live.get(it.id);
    return dr && Number.isFinite(dr.x) ? { ...it, x: dr.x, y: dr.y } : it;
  });
}
function rebuildWorld() {
  G.furniture = effectiveFurniture();
  G.rects = solidRects(G.furniture);
  G.grid = buildGrid(G.rects);
  G.seats = allSeats(G.furniture);
  G.seatById = new Map(G.seats.map((x) => [x.id, x]));
}

function deskInfo(slot) {
  if (slot === G.myDesk) return { mine: true, style: G.myDeskStyle, name: G.me.nick, look: G.me.look };
  for (const rt of G.others.values()) if (rt.p.dk && rt.p.dk.slot === slot) return { style: cleanDesk(rt.p.dk.style), name: rt.p.n || 'เพื่อน', look: rt.p.l, key: rt.key };
  const doc = G.desks.get(slot);
  if (doc && doc.uid !== undefined) return { style: cleanDesk(doc.style), name: doc.n || 'เพื่อน', look: doc.l, uid: doc.uid };
  return null;
}

// ================================================================ ตัวละคร ====
function standUp() {
  if (!G.me.sit) return;
  G.me.sit = null;
  pres({ s: '' });
}
function sitOn(seat) {
  const me = G.me;
  me.path = null; me.pendingSeat = null;
  if (me.ride) { me.ride = false; pres({ rd: null }); }
  me.x = seat.x; me.y = seat.y; me.dir = seat.dir; me.sit = seat.id;
  pres({ x: me.x, y: me.y, d: me.dir, s: seat.id, m: 0 });
  SFX.sit();
  // นั่งเบาะกราบหน้าพระ = พนมมือไหว้ 🙏
  if (seat.pray) setTimeout(() => { if (G.me.sit === seat.id) { pres({ em: { e: '🙏', ts: Date.now() } }); G.emotes.push({ key: 'me', e: '🙏', start: performance.now(), dx: 0 }); toast('🙏 สาธุ', 2000); } }, 400);
}
function walkTo(x, y, seat) {
  standUp();
  G.me.pendingBoard = null; G.me.pendingScreen = null;
  const path = findPath(G.grid, G.me.x, G.me.y, x, y);
  if (!path) { toast('ไปตรงนั้นไม่ได้'); return; }
  G.me.path = path;
  G.me.pendingSeat = seat || null;
  G.camManual = false;
}
function seatTaken(seatId) {
  for (const rt of G.others.values()) if (rt.p.s === seatId) return true;
  return false;
}

// ---- ขี่สัตว์เลี้ยง ----
const RIDE_SPEED = 1.4, RIDE_LIFT = 9;
function isRiding(ch) {
  const rd = ch === G.me ? G.me.ride : ch.p && ch.p.rd === 1;
  return !!rd && ch.look && ch.look.pet !== 'none' && !ch.sit;
}
function toggleRide(on) {
  const me = G.me;
  if (me.look.pet === 'none') { toast('ต้องมีสัตว์เลี้ยงก่อน — กด 👕 แต่งตัว แล้วเลือกสัตว์เลี้ยง'); return; }
  const v = on == null ? !me.ride : !!on;
  if (v && me.sit) standUp();
  me.ride = v;
  pres({ rd: v ? 1 : null });
  G.actionSig = '';
  if (v) { SFX.pop(); toast(me.look.pet === 'f1' ? '🏎️ ขึ้นรถ F1 แล้ว! (วิ่งเร็วสุดๆ)' : `🐾 ขี่${(PETS.find((p) => p[0] === me.look.pet) || [, 'สัตว์เลี้ยง'])[1]}แล้ว! (เดินเร็วขึ้น)`, 2000); }
  else toast(me.look.pet === 'f1' ? 'ลงจากรถแล้ว' : 'ลงจากหลังสัตว์เลี้ยงแล้ว', 1500);
}
G.steps = lsGet('pixel.steps', true) !== false;
function setSteps(on) { G.steps = !!on; lsSet('pixel.steps', G.steps); toast(G.steps ? '👣 เปิดเสียงเดินแล้ว' : '👣 ปิดเสียงเดินแล้ว', 1800); }
function footstep(ch, mine) {
  const f = ch.frame;
  if (f === ch.lastStepF) return;
  ch.lastStepF = f;
  if (!G.steps || !ch.walking || (f !== 1 && f !== 3) || document.hidden) return;
  const ride = isRiding(ch);
  if (ride && ch.look.pet === 'cloud') return; // เมฆลอยเงียบ ไม่มีเสียงเท้า
  if (mine) { stepSound(ride ? 0.07 : 0.09, ride); return; }
  const d = Math.hypot(ch.x - G.me.x, ch.y - G.me.y);
  if (d > 170 || zoneAt(ch.x, ch.y) !== zoneAt(G.me.x, G.me.y)) return;
  stepSound((ride ? 0.05 : 0.06) * (1 - d / 170), ride);
}
function updateMe(dt) {
  const me = G.me;
  let vx = 0, vy = 0;
  const k = G.keys;
  if (k.has('ArrowLeft') || k.has('KeyA')) vx -= 1;
  if (k.has('ArrowRight') || k.has('KeyD')) vx += 1;
  if (k.has('ArrowUp') || k.has('KeyW')) vy -= 1;
  if (k.has('ArrowDown') || k.has('KeyS')) vy += 1;
  let moved = false;
  if (vx || vy) {
    me.path = null; me.pendingSeat = null; standUp();
    const len = Math.hypot(vx, vy); vx /= len; vy /= len;
    const step = SPEED * (isRiding(me) ? (me.look.pet === 'f1' ? 2.1 : RIDE_SPEED) : 1) * Math.min(dt, 0.05);
    const inside = hitsRects(G.rects, me.x, me.y);
    if (inside || !hitsRects(G.rects, me.x + vx * step, me.y)) { me.x += vx * step; moved = true; }
    if (inside || !hitsRects(G.rects, me.x, me.y + vy * step)) { me.y += vy * step; moved = true; }
    me.x = clamp(me.x, LEFT + 6, RIGHT - 6); me.y = clamp(me.y, SHRINE_FLOOR + 2, H - 4);
  } else if (me.path && me.path.length) {
    const t = me.path[0];
    const dx = t.x - me.x, dy = t.y - me.y, d = Math.hypot(dx, dy);
    const step = SPEED * (isRiding(me) ? (me.look.pet === 'f1' ? 2.1 : RIDE_SPEED) : 1) * Math.min(dt, 0.05);
    if (d <= step) {
      me.x = t.x; me.y = t.y; me.path.shift();
      if (!me.path.length) {
        me.path = null;
        if (me.pendingScreen) { const sc = G.furniture.find((f) => f.id === me.pendingScreen); me.pendingScreen = null; if (sc) openScreenModal(sc); }
        if (me.pendingBoard) { const bd = G.furniture.find((f) => f.id === me.pendingBoard); me.pendingBoard = null; if (bd) openBoard(bd); }
        if (me.pendingSeat) {
          const seat = me.pendingSeat;
          if (Math.hypot(seat.x - me.x, seat.y - me.y) < 26 && !seatTaken(seat.id)) sitOn(seat);
          me.pendingSeat = null;
        }
      }
    } else { vx = dx / d; vy = dy / d; me.x += vx * step; me.y += vy * step; }
    moved = true;
  }
  if (moved && (vx || vy)) me.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right') : (vy < 0 ? 'up' : 'down');
  if (moved) { me.ft += dt; me.frame = Math.floor(me.ft * 8) % 4; }
  else { me.frame = 0; me.ft = 0; }
  if (moved) { pres({ x: Math.round(me.x * 2) / 2, y: Math.round(me.y * 2) / 2, d: me.dir, m: 1, t: netNow() }); me.wasMoving = true; }
  else if (me.wasMoving) { me.wasMoving = false; pres({ x: Math.round(me.x * 2) / 2, y: Math.round(me.y * 2) / 2, d: me.dir, m: 0, t: netNow() }); lsSet('pixel.pos', { x: me.x, y: me.y }); }
  me.walking = moved;
  footstep(me, true);
}

function updatePet(owner, pet, dt) {
  const side = owner.dir === 'left' ? 1 : owner.dir === 'right' ? -1 : (pet.x >= owner.x ? 1 : -1);
  // สัตว์ตัวใหญ่ (วัว ม้า ฯลฯ) ยืนห่างออกไปตามขนาดตัว ไม่ทับเจ้าของ
  const pw = owner.look && FARM[owner.look.pet] ? FARM[owner.look.pet][0] : 14;
  let tx = owner.x + side * Math.max(13, 7 + pw / 2), ty = owner.y + (owner.dir === 'up' ? 6 : 2);
  // นั่งหันหลัง (เก้าอี้เรียงกัน) + สัตว์/รถตัวใหญ่ = จอดไว้ข้างหลังเก้าอี้ ไม่ไปทับเก้าอี้/คนข้างๆ
  const big = owner.sit && pw >= 24;
  if (big && owner.dir === 'up') { tx = owner.x; ty = owner.y + 19 + (FARM[owner.look.pet] ? FARM[owner.look.pet][1] : 14); }   // ต่ำกว่าป้ายชื่อโต๊ะ ไม่ทับป้าย
  const dx = tx - pet.x, dy = ty - pet.y, d = Math.hypot(dx, dy);
  if (d > 60) { pet.x = tx; pet.y = ty; }
  else if (d > 2) {
    const sp = Math.min(d, (owner.walking ? 80 : 40) * dt);
    pet.x += (dx / d) * sp; pet.y += (dy / d) * sp; pet.ft += dt;
    if (Math.abs(dx) > 1) pet.face = dx > 0;
    if (Math.abs(dy) > Math.abs(dx) * 1.2 && Math.abs(dy) > 1) pet.vert = dy > 0 ? 'down' : 'up'; else if (Math.abs(dx) > Math.abs(dy) * 1.2) pet.vert = null;
  } else pet.ft = 0;
  if (big) pet.vert = null;   // จอดแล้วเป็นภาพด้านข้างเสมอ (ภาพมองจากบนยาวไปทับเก้าอี้)
  if (!owner.walking && d <= 2 && !big) pet.face = owner.x > pet.x;
}

// ---- เดินลื่นแบบเกมออนไลน์: เก็บตำแหน่งพร้อมเวลาที่เพื่อนส่ง แล้ววาดย้อนหลังเล็กน้อยระหว่างสองจุด ----
const netNow = () => (G.net && G.net.now ? G.net.now() : Date.now());
function addSnap(rt, x, y, d, ts) {
  const now = netNow();
  const t = Number.isFinite(ts) ? ts : now - (rt.off || 0);
  // ประมาณความหน่วง + ความแกว่งของเน็ตของคนนี้ (ปรับตัวเองตลอด)
  const lag = now - t;
  if (rt.off == null || lag < rt.off) rt.off = lag; else rt.off += (lag - rt.off) * 0.01;
  const jit = lag - rt.off;
  rt.jit = rt.jit == null ? jit : rt.jit + (jit - rt.jit) * (jit > rt.jit ? 0.35 : 0.02);
  const s = rt.snaps || (rt.snaps = []);
  const last = s[s.length - 1];
  if (last && t <= last.t) { if (last.x === x && last.y === y) return; s.length = 0; } // เวลาถอยหลัง (เพื่อนรีโหลด) = เริ่มใหม่
  if (last && last.x === x && last.y === y && last.d === d) { last.t2 = t; return; }
  if (last && t - last.t < 600) rt.iv = rt.iv == null ? t - last.t : rt.iv + (t - last.t - rt.iv) * 0.1; // ระยะห่างระหว่างตำแหน่งที่ส่งมา
  s.push({ t, x, y, d });
  if (s.length > 40) s.splice(0, s.length - 40);
}
function snapPos(rt) {
  const s = rt.snaps;
  if (!s || !s.length) return null;
  const delay = clamp((rt.iv || 100) + (rt.jit || 0) * 2 + 30, 100, 450);
  const rT = netNow() - (rt.off || 0) - delay;
  while (s.length > 2 && s[1].t <= rT) s.shift();
  const a = s[0];
  if (rT <= a.t || s.length === 1) {
    // ยังไม่มีจุดถัดไป: ถ้ากำลังเดินอยู่ ไหลต่อไปตามทิศเดิมได้นิดหน่อย (ไม่เกิน 0.15 วิ) แทนการหยุดกึก
    if (s.length === 1 && rt.vel && rT > a.t && rt.p.m) { const k = Math.min(rT - a.t, 150) / 1000; return { x: a.x + rt.vel.x * k, y: a.y + rt.vel.y * k, d: a.d }; }
    return { x: a.x, y: a.y, d: a.d };
  }
  const b = s[1];
  if (Math.hypot(b.x - a.x, b.y - a.y) > 120) return { x: b.x, y: b.y, d: b.d }; // วาร์ป (นั่ง/ย้ายห้อง)
  if (rT > b.t) {
    // ตำแหน่งถัดไปมาช้า: ไหลต่อตามทิศเดิมได้นิดหน่อย (ไม่เกิน 0.15 วิ) แทนการหยุดกึก
    if (rt.p.m && rt.vel) { const k = Math.min(rT - b.t, 200) / 1000; return { x: b.x + rt.vel.x * k, y: b.y + rt.vel.y * k, d: b.d }; }
    return { x: b.x, y: b.y, d: b.d };
  }
  const k = clamp((rT - a.t) / Math.max(1, b.t - a.t), 0, 1);
  const span = Math.max(1, b.t - a.t) / 1000;
  rt.vel = { x: clamp((b.x - a.x) / span, -SPEED * 2, SPEED * 2), y: clamp((b.y - a.y) / span, -SPEED * 2, SPEED * 2) };
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, d: b.d };
}
function updateOthers(dt) {
  for (const rt of G.others.values()) {
    const p = rt.p;
    if (!Number.isFinite(p.x)) continue;
    const ox = rt.x, oy = rt.y;
    const sp = snapPos(rt);
    if (sp) {
      if (Math.hypot(sp.x - rt.x, sp.y - rt.y) > 120) { rt.x = sp.x; rt.y = sp.y; }
      else { const a = 1 - Math.exp(-dt * 30); rt.x += (sp.x - rt.x) * a; rt.y += (sp.y - rt.y) * a; }
    } else { rt.x = p.x; rt.y = p.y; }
    const moved = Math.hypot(rt.x - ox, rt.y - oy) / Math.max(dt, 0.001);
    rt.walking = moved > 8;
    const d = (sp && sp.d) || p.d;
    if (rt.walking && Math.abs(rt.x - ox) + Math.abs(rt.y - oy) > 0.05) rt.dir = Math.abs(rt.x - ox) > Math.abs(rt.y - oy) ? (rt.x > ox ? 'right' : 'left') : (rt.y > oy ? 'down' : 'up');
    else rt.dir = ['up', 'down', 'left', 'right'].includes(d) ? d : 'down';
    if (rt.walking && !p.s) { rt.ft += dt; rt.frame = Math.floor(rt.ft * 8) % 4; } else { rt.frame = 0; rt.ft = 0; }
    footstep(rt, false);
    rt.look = cleanLook(p.l);
    updatePet(rt, rt.pet, dt);
  }
}

// ================================================================ คนในห้อง ====
function onPeers(list) {
  const now = performance.now();
  if (!G.firstPeersAt) G.firstPeersAt = now;
  const settled = now - G.firstPeersAt > 2500;
  const seen = new Set();
  let furnitureMoved = false;
  for (const peer of list) {
    if (peer.kind === 'agent') continue;
    if (peer.isMe) continue;
    const p = peer.p || {};
    seen.add(peer.key);
    let rt = G.others.get(peer.key);
    const isNew = !rt;
    if (!rt) {
      rt = { key: peer.key, by: peer.by, p, x: p.x || 250, y: p.y || 320, dir: 'down', ft: 0, frame: 0, walking: false, seed: Math.random() * 5, lastEm: p.em && p.em.ts, saySeen: new Set(), bubble: null, announced: false };
      rt.pet = { x: rt.x + 10, y: rt.y, face: false, ft: 0 };
      G.others.set(peer.key, rt);
    }
    const prevDr = rt.p.dr && rt.p.dr.id;
    rt.p = p; rt.by = peer.by; rt.guest = peer.guest;
    rt.look = cleanLook(p.l);
    if ((p.dr && p.dr.id) || prevDr) furnitureMoved = true;
    if (Number.isFinite(p.x) && Number.isFinite(p.y)) addSnap(rt, p.x, p.y, p.d, p.t);
    if (Number.isFinite(p.x) && !rt.announced) {
      rt.announced = true;
      if (settled) { addSys(`${p.n || 'เพื่อน'} เข้ามาในห้อง`); SFX.join(); }
      if (isNew || !Number.isFinite(rt.x)) { rt.x = p.x; rt.y = p.y; rt.pet.x = p.x + 10; rt.pet.y = p.y; rt.snaps = []; }
    }
    // อีโมตใหม่
    if (p.em && p.em.ts && p.em.ts !== rt.lastEm) {
      rt.lastEm = p.em.ts;
      if (!isNew && EMOTES.includes(p.em.e)) G.emotes.push({ key: peer.key, e: p.em.e, start: now, dx: Math.random() * 10 - 5 });
    }
    // ข้อความใหม่
    if (Array.isArray(p.say)) {
      for (const m of p.say.slice(-3)) {
        if (!m || typeof m.i !== 'string' || typeof m.t !== 'string' || rt.saySeen.has(m.i)) continue;
        const mf = cleanFile(m.f);
        rt.saySeen.add(m.i);
        // ข้อความใหม่ขึ้นบนหัวเสมอ (แม้แชตจากฐานข้อมูลจะมาถึงก่อน presence) — saySeen กันขึ้นซ้ำ, isNew = เพิ่งเห็นคนนี้ ไม่โชว์ข้อความเก่า
        const fresh = !isNew;
        const mz = chatZone(m.z);
        addMessage({ id: m.i, by: peer.by || p.uid || peer.key, n: p.n, l: p.l, text: m.t.slice(0, 200), ts: Number(m.ts) || Date.now(), f: mf, z: mz });
        if (fresh && (!mz || mz === G.zone)) { rt.bubble = { id: m.i, text: (m.t || (mf ? fileLabel(mf) : '')).slice(0, 200), until: now + 6000, lines: null }; SFX.msg(); }
      }
    }
  }
  for (const key of [...G.others.keys()]) {
    if (!seen.has(key)) {
      const rt = G.others.get(key);
      if (rt.announced) { addSys(`${rt.p.n || 'เพื่อน'} ออกจากห้อง`); SFX.leave(); }
      G.others.delete(key);
      if (rt.p.dr) furnitureMoved = true;
    }
  }
  G.peerCount = 1 + [...G.others.values()].filter((r) => Number.isFinite(r.p.x)).length;
  $('#onlineCount').textContent = G.peerCount;
  if (furnitureMoved && !G.drag) rebuildWorld();
  if (!$('#people').classList.contains('hidden') && !G.peopleQueued) { G.peopleQueued = true; setTimeout(() => { G.peopleQueued = false; renderPeople(); }, 400); }
  if (G.voice) G.voice.syncPeers([...G.others.keys()]);
}

// ================================================================== แชต ====
G.chatDeleted = new Set();
G.isAdmin = !!lsGet('pixel.admin', '');

  for (const it of G.furniture) {

    if (d.floor && d.anim) { const spr = furnSprite(it.t, it.v || 0, 0); d.anim(b, Math.round(it.x - spr.width / 2) + 1, Math.round(it.y - spr.height + 1) + 1, t, it); }
  }

  // กรอบของในโหมดจัดห้อง
  if (G.edit) {
    for (const it of G.furniture) {
      const d = FURN[it.t];
      const sel = it.id === G.selected;
      b.fillStyle = sel ? '#ff8fab' : 'rgba(255,255,255,.55)';
      const x0 = Math.round(it.x - d.w / 2 - 2), y0 = Math.round(it.y - d.h - 2), ww = d.w + 4, hh = d.h + 4;
      const dash = (t * 8) | 0;
      for (let i = 0; i < ww; i += 2) if (((i >> 1) + dash) % 2) { b.fillRect(x0 + i, y0, 1, 1); b.fillRect(x0 + i, y0 + hh, 1, 1); }
      for (let i = 0; i < hh; i += 2) if (((i >> 1) + dash) % 2) { b.fillRect(x0, y0 + i, 1, 1); b.fillRect(x0 + ww, y0 + i, 1, 1); }
    }
  }

  drawHearingRange(b, t);
  // เป้าหมายที่แตะ
  if (me.path && me.path.length && !G.edit) {
    const goal = me.path[me.path.length - 1];
    const k = Math.floor(t * 4) % 2;
    b.fillStyle = '#ff8fab';
    b.fillRect(Math.round(goal.x) - 3 - k, Math.round(goal.y), 2, 1); b.fillRect(Math.round(goal.x) + 2 + k, Math.round(goal.y), 2, 1);
    b.fillRect(Math.round(goal.x), Math.round(goal.y) - 2 - k, 1, 2); b.fillRect(Math.round(goal.x), Math.round(goal.y) + 1 + k, 1, 2);
  }

  // กลางคืน: หรี่ห้องแล้วเปิดไฟ
  if (sky.night > 0) {
    b.fillStyle = `rgba(30,22,74,${sky.night})`;
    b.fillRect(camX, camY, bw, bh);
    b.globalCompositeOperation = 'lighter';
    const light = (x, y, r, col) => {
      const gr = b.createRadialGradient(x, y, 2, x, y, r);
      gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
      b.fillStyle = gr; b.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (const it of G.furniture) {
      if (it.t === 'floorLamp') light(it.x, it.y - 26, 56, 'rgba(255,190,110,.32)');
      if (it.t === 'tv') light(it.x, it.y - 18, 34, 'rgba(120,150,255,.22)');
      if (it.t === 'arcade') light(it.x, it.y - 22, 26, 'rgba(255,140,200,.2)');
      if (it.t === 'fishTank') light(it.x, it.y - 18, 26, 'rgba(120,220,255,.2)');
    }
    for (const s of DESK_SLOTS) {
      const info = deskInfos.get(s.id);
      if (!info) continue;
      if (info.style.items.includes('lamp')) light(s.x - 12, s.y - 24, 34, 'rgba(255,210,120,.3)');
      if (info.style.s !== 'none') light(s.x, s.y - 30, 24, 'rgba(140,200,255,.18)');
    }
    b.globalCompositeOperation = 'source-over';
  }

  // ขึ้นจอ
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2e2235'; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(buf, 0, 0, pw, ph, 0, 0, pw, ph);
  drawOverlay(t, chars, deskInfos, camX, camY, scale);
}

function drawOverlay(t, chars, deskInfos, camX, camY, scale) {
  const c = ctx;
  const now = performance.now();
  const S = (x, y) => [(x - camX) * scale, (y - camY) * scale];
  G.bubbleHits = [];
  G.musicHits = [];
  drawDoorLabels(c, camX, camY, scale);
  placeCinemaPanel(camX, camY, scale);
  // ป้ายชื่อโต๊ะ
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const s of DESK_SLOTS) {
    const info = deskInfos.get(s.id);
    const near = Math.hypot(G.me.x - s.x, G.me.y - s.y) < 70;
    if (!info && !near) continue;
    const [sx, sy] = S(s.x, s.y + CHAIR_DY + 3);
    const label = info ? info.name : 'โต๊ะว่าง';
    c.font = '500 10px Mitr, sans-serif';
    const w = c.measureText(label).width + 12;
    c.fillStyle = info ? (info.mine ? '#ffe07a' : '#fff7ec') : 'rgba(255,247,236,.7)';
    c.strokeStyle = '#2e2235'; c.lineWidth = 2;
    rrect(c, sx - w / 2, sy - 1, w, 15, 5); c.fill(); c.stroke();
    c.fillStyle = '#2e2235'; fillCenter(c, label, sx, sy + 7);
  }
  // ตัวละคร: ชื่อ สถานะ บับเบิล วิดีโอ
  const sorted = [...chars].sort((a, b) => a.y - b.y);
  for (const ch of sorted) {
    const p = ch === G.me ? null : ch.p;
    const [sx, sy0] = S(ch.x, ch.y);
    if (sx < -150 || sx > G.view.cw + 150 || sy0 < -80 || sy0 > G.view.ch + 200) continue;
    const rLift = isRiding(ch) ? (ch.look.pet === 'f1' ? (ch.dir === 'up' || ch.dir === 'down' ? 12 : 0) : RIDE_LIFT + 2 + (ch.look.pet === 'cloud' ? 9 : ch.look.pet === 'fish' || ch.look.pet === 'dragon' ? 4 : 0)) : 0;
    let top = sy0 - ((ch.sit ? 33 : 35) + rLift) * scale;
    // ชื่อสัตว์เลี้ยง: ป้ายเล็กใต้ตัวสัตว์ (ตอนขี่ไม่แสดง)
    const pn = ch.look && ch.look.pn;
    if (pn && ch.look.pet !== 'none' && ch.pet && !rLift && !isRiding(ch)) {
      const [px, py] = S(ch.pet.x, ch.pet.y + 3);
      c.font = '500 10px Mitr, sans-serif';
      const pw2 = c.measureText(pn).width + 12;
      c.globalAlpha = 0.92;
      c.fillStyle = 'rgba(255,247,236,.92)'; c.strokeStyle = 'rgba(46,34,53,.55)'; c.lineWidth = 1.5;
      rrect(c, px - pw2 / 2, py, pw2, 14, 7); c.fill(); c.stroke();
      c.fillStyle = '#5a3d5c'; fillCenter(c, pn, px, py + 7.5);
      c.globalAlpha = 1;
    }
    const away = ch !== G.me && (G.voice ? !G.audible.has(ch.key) : zoneAt(ch.x, ch.y) !== G.zone);
    c.globalAlpha = away && G.voice ? 0.5 : 1;
    const key = ch === G.me ? G.net.myKey : ch.key;
    const speaking = G.voice && G.voice.speaking(key);
    // วิดีโอ (เวอร์ชันมีเสียง)
    const vid = G.voice && G.voice.videoFor(key);
    if (vid && vid.readyState >= 2 && vid.videoWidth) {
      const r = isMobile() ? 24 : 30;
      const cx = sx, cy = top - r - 4;
      c.save();
      rrect(c, cx - r, cy - r, r * 2, r * 2, 8); c.clip();
      const vw = vid.videoWidth, vh = vid.videoHeight, k = Math.max((2 * r) / vw, (2 * r) / vh);
      if (ch === G.me) { c.translate(cx, cy); c.scale(-1, 1); c.drawImage(vid, -vw * k / 2, -vh * k / 2, vw * k, vh * k); }
      else c.drawImage(vid, cx - vw * k / 2, cy - vh * k / 2, vw * k, vh * k);
      c.restore();
      if (ch !== G.me && (isBlackVideo(key, vid) || p.hid)) {
        c.fillStyle = 'rgba(46,34,53,.85)'; rrect(c, cx - r, cy - r, r * 2, r * 2, 8); c.fill();
        c.fillStyle = '#fff7ec'; c.font = `500 ${isMobile() ? 9 : 10}px Mitr, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
        if (p.hid) { c.fillText('📱 พับจอ', cx, cy - 6); c.fillText('อยู่', cx, cy + 7); }
        else { c.fillText('⚫ ภาพดำ', cx, cy - 6); c.fillText('แตะดูสาเหตุ', cx, cy + 7); }
      }
      c.strokeStyle = speaking ? '#3fd07a' : '#2e2235'; c.lineWidth = 3;
      rrect(c, cx - r, cy - r, r * 2, r * 2, 8); c.stroke();
      G.bubbleHits.push({ x: cx, y: cy, r, key });
      top = cy - r - 4;
    }
    // ป้ายชื่อ
    const name = (ch === G.me ? G.me.nick : p.n) || 'เพื่อน';
    const st = (ch === G.me ? G.me.st : p.st) || '';
    const micOff = G.voice && (ch === G.me ? !G.voice.mic : p.mic === 0);
    const deaf = G.voice && (ch === G.me ? G.voice.deaf : p.hp === 1);
    const sharing = ch === G.me ? !!(G.voice && G.voice.screenTrack) : p.scr === 1;
    const label = (sharing ? '🔴 LIVE · ' : '') + (st ? st + ' ' : '') + name;
    c.font = '500 12px Mitr, sans-serif';
    const w = c.measureText(label).width + 14;
    const ly = top - 20;
    // ไอคอนปิดไมค์ / ปิดหูฟัง แยกกัน วางต่อท้ายป้ายชื่อ (วงกลมแดง เห็นชัด)
    const badges = [micOff || deaf ? 'mic' : null, deaf ? 'hp' : null].filter(Boolean), BS = 20;
    const tw = w + badges.length * (BS + 2), lx = sx - tw / 2;
    c.fillStyle = speaking ? '#3fd07a' : ch === G.me ? '#ff8fab' : 'rgba(46,34,53,.88)';
    rrect(c, lx, ly, w, 18, 6); c.fill();
    c.fillStyle = '#ffffff'; fillCenter(c, label, lx + w / 2, ly + 9.5);
    badges.forEach((b, i) => c.drawImage(statusIcon(b), Math.round(lx + w + 2 + i * (BS + 2)), ly - 1, BS, BS));
    top = ly;
    // เพลงที่กำลังฟัง
    const mu = ch === G.me ? currentMusic() : (p.mu && typeof p.mu.t === 'string' ? p.mu : null);
    if (mu) {
      const lab = '🎵 ' + musicLabel(mu);
      c.font = '500 11px Mitr, sans-serif';
      const mw = c.measureText(lab).width + 12, my = top - 17;
      c.fillStyle = mu.s === 'sp' ? '#1db954' : '#5a4f78';
      rrect(c, sx - mw / 2, my, mw, 15, 5); c.fill();
      c.fillStyle = '#ffffff'; fillCenter(c, lab, sx, my + 8);
      const u = safeSpotifyUrl(mu.u);
      if (u) G.musicHits.push({ x0: sx - mw / 2, y0: my, x1: sx + mw / 2, y1: my + 15, u });
      top = my;
    }
    // บับเบิลแชต
    const bub = ch === G.me ? G.me.bubble : ch.bubble;
    if (bub && bub.until > now) {
      c.font = '400 13px Mitr, sans-serif';
      if (!bub.lines) bub.lines = wrapText(c, bub.text, 170, 3);
      const bw = Math.max(...bub.lines.map((l) => c.measureText(l).width)) + 18;
      const bh = bub.lines.length * 17 + 10;
      const by = top - bh - 9;
      const bx = clamp(sx, bw / 2 + 6, G.view.cw - bw / 2 - 6);
      const life = bub.until - now;
      c.globalAlpha = clamp(Math.min(life / 300, (6000 - life) / 120), 0, 1);
      c.fillStyle = '#ffffff'; c.strokeStyle = '#2e2235'; c.lineWidth = 2.5;
      rrect(c, bx - bw / 2, by, bw, bh, 8); c.fill(); c.stroke();
      const tx = clamp(sx, bx - bw / 2 + 12, bx + bw / 2 - 12);
      c.beginPath(); c.moveTo(tx - 5, by + bh - 1); c.lineTo(tx, by + bh + 6); c.lineTo(tx + 5, by + bh - 1); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(tx - 5, by + bh); c.lineTo(tx, by + bh + 6); c.lineTo(tx + 5, by + bh); c.stroke();
      c.fillStyle = '#2e2235';
      bub.lines.forEach((l, i) => fillCenter(c, l, bx, by + 5 + 8.5 + i * 17));
      c.globalAlpha = 1;
      top = by;
    } else if (bub) { if (ch === G.me) G.me.bubble = null; else ch.bubble = null; }
    // กำลังพิมพ์ (ข้อความสด สีจาง + จุดกระพริบ)
    const ty = ch === G.me ? G.me.typing : p && p.ty && (!p.tz || p.tz === G.zone) ? p.ty : '';
    if (ty && !(bub && bub.until > now)) {
      c.font = 'italic 400 12px Mitr, sans-serif';
      const dots = '.'.repeat(1 + (Math.floor(now / 350) % 3));
      const lines = wrapText(c, ty + ' ' + dots, 160, 2);
      const bw = Math.max(...lines.map((l) => c.measureText(l).width)) + 16;
      const bh = lines.length * 15 + 9;
      const by = top - bh - 8;
      const bx = clamp(sx, bw / 2 + 6, G.view.cw - bw / 2 - 6);
      c.globalAlpha = 0.92;
      c.fillStyle = '#f4efe6'; c.strokeStyle = '#8a7a90'; c.lineWidth = 2;
      c.setLineDash([4, 3]); rrect(c, bx - bw / 2, by, bw, bh, 8); c.fill(); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#6b5a72';
      lines.forEach((l, i) => fillCenter(c, l, bx, by + 4 + 8 + i * 15));
      c.globalAlpha = 1;
      top = by;
    }
    ch._top = top;
    c.globalAlpha = 1;
  }
  // ป้ายชื่อ NPC
  for (const n of G.npcs || []) {
    const [sx, sy0] = S(n.x, n.y);
    if (sx < -150 || sx > G.view.cw + 150 || sy0 < -80 || sy0 > G.view.ch + 200) continue;
    const label = (n.a === 'sing' ? '🎤 ' : '🕺 ') + n.n;
    c.font = '500 12px Mitr, sans-serif';
    const w = c.measureText(label).width + 14, ly = sy0 - (n.a === 'sing' ? 58 : 44) * scale;
    c.fillStyle = n.a === 'sing' ? '#8a3fd0' : '#d0408a';
    rrect(c, sx - w / 2, ly, w, 18, 6); c.fill();
    c.fillStyle = '#ffffff'; fillCenter(c, label, sx, ly + 9.5);
  }
  // อีโมต
  G.emotes = G.emotes.filter((e) => now - e.start < 2200);
  for (const e of G.emotes) {
    const ch = e.key === 'me' ? G.me : G.others.get(e.key);
    if (!ch) continue;
    const [sx] = S(ch.x, ch.y);
    const k = (now - e.start) / 2200;
    const pop = k < 0.12 ? k / 0.12 : 1;
    c.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    c.font = `${Math.round(28 * (0.5 + pop * 0.5))}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    fillCenter(c, e.e, sx + e.dx + Math.sin(k * 10) * 3, (ch._top ?? 0) - 16 - k * 50);
    c.globalAlpha = 1;
  }
}

function updateActions() {
  const box = $('#actions');
  const me = G.me;
  const acts = [];
  let hint = '';
  if (!G.edit && !me.sit && !me.path) {
    const bd = G.furniture.find((it) => FURN[it.t].board && Math.abs(me.x - it.x) < 24 && me.y > it.y - 4 && me.y < it.y + 24);
    if (bd) acts.push(['🖼️ เปิดกระดาน', 'board:' + bd.id]);
    const sc = G.furniture.find((it) => SCREEN_TYPES.has(it.t) && nearScreen(it));
    if (sc) acts.push([sc.t === 'speaker' ? '🔊 เปิดเพลงที่ลำโพง' : '📺 YouTube บนจอ', 'screen:' + sc.id]);
  }
  if (!G.edit && G.isAdmin && !me.sit && !me.path && zoneAt(me.x, me.y) === 'concert') {
    acts.push(['🎤 เรียกนักร้อง', 'npc:sing'], ['🕺 เรียกนักเต้น', 'npc:dance']);
    if ((G.npcs || []).some((n) => Math.hypot(n.x - me.x, n.y - me.y) < 60)) acts.push(['🧹 ลบ NPC ใกล้ตัว', 'npc:del']);
  }
  if (!G.edit) {
    if (me.sit) {
      acts.push(['ลุกขึ้น', 'stand']);
      acts.push(['🔄 หัน', 'turn']);
      if (G.myDesk && me.sit === `desk:${G.myDesk}`) acts.push(['🎨 แต่งโต๊ะ', 'deskEdit']);
    } else if (!me.path) {
      if (me.look.pet !== 'none') acts.push([me.look.pet === 'f1' ? (me.ride ? '🚪 ลงจากรถ' : '🏎️ ขับรถ F1') : me.ride ? '🐾 ลงจากหลัง' : '🐾 ขี่' + ((PETS.find((p) => p[0] === me.look.pet) || [])[1] || ''), 'ride']);
      let best = null, bd = 22;
      for (const s of G.seats) {
        const d = Math.hypot(s.x - me.x, (s.y - me.y) * 1.2);
        if (d < bd && !seatTaken(s.id)) { bd = d; best = s; }
      }
      if (best) {
        if (best.kind === 'desk') {
          const info = deskInfo(best.slot);
          if (!info) acts.push(['✨ จองโต๊ะนี้', 'claim:' + best.slot]);
          else if (info.mine) { acts.push(['🪑 นั่ง', 'sit:' + best.id]); acts.push(['🎨 แต่งโต๊ะ', 'deskEdit']); }
          else hint = `โต๊ะของ ${info.name}`;
        } else acts.push(['🪑 นั่ง', 'sit:' + best.id]);
      }
    }
  }
  const sig = acts.map((a) => a[1]).join('|') + '#' + hint;
  if (sig === G.actionSig) return;
  G.actionSig = sig;
  box.innerHTML = '';
  if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; box.append(h); }
  acts.forEach(([label, act], i) => {
    const btn = document.createElement('button');
    btn.className = 'pbtn' + (i === 0 ? ' pink' : '');
    btn.textContent = label;
    btn.onclick = () => {
      if (act === 'stand') standUp();
      if (act === 'turn') turnMe();
      if (act === 'ride') toggleRide();
      else if (act.startsWith('npc:')) { const k = act.slice(4); if (k === 'del') npcCmd('del'); else npcCmd('add', k); }
      else if (act === 'deskEdit') openDeskEditor();
      else if (act.startsWith('claim:')) claimDesk(act.slice(6));
      else if (act.startsWith('screen:')) { const it = G.furniture.find((f) => f.id === act.slice(7)); if (it) openScreenModal(it); }
      else if (act.startsWith('board:')) { const it = G.furniture.find((f) => f.id === act.slice(6)); if (it) openBoard(it); }
      else if (act.startsWith('sit:')) { const s = G.seats.find((x) => x.id === act.slice(4)); if (s) sitOn(s); }
      G.actionSig = '';
    };
    box.append(btn);
  });
}

function closeTrays(except) {
  for (const id of ['emoteTray', 'statusTray']) if (id !== except) $('#' + id).classList.add('hidden');
  $('[data-tool="emote"]').classList.toggle('active', except === 'emoteTray' && !$('#emoteTray').classList.contains('hidden'));
  $('[data-tool="status"]').classList.toggle('active', except === 'statusTray' && !$('#statusTray').classList.contains('hidden'));
}
function toggleTray(id) {
  const el = $('#' + id);
  const show = el.classList.contains('hidden');
  if (G.edit) setEdit(false);
  el.classList.toggle('hidden', !show);
  closeTrays(id);
}
function buildTrays() {
  const et = $('#emoteTray'); et.innerHTML = '';
  for (const e of EMOTES) {
    const b = document.createElement('button'); b.className = 'emo'; b.textContent = e;
    b.onclick = () => { pres({ em: { e, ts: Date.now() } }); G.emotes.push({ key: 'me', e, start: performance.now(), dx: 0 }); SFX.pop(); };
    et.append(b);
  }
  const st = $('#statusTray'); st.innerHTML = '';
  const mb = document.createElement('button'); mb.className = 'st';
  const mi = document.createElement('i'); mi.textContent = '🎵';
  const ms = document.createElement('span'); ms.textContent = 'เพลงที่ฟัง';
  mb.append(mi, ms); mb.onclick = () => { $('#statusTray').classList.add('hidden'); closeTrays(); openMusic(); };
  st.append(mb);
  for (const [e, label] of STATUSES) {
    const b = document.createElement('button'); b.className = 'st' + (G.me.st === e ? ' sel' : '');
    const i = document.createElement('i'); i.textContent = e || '➖';
    const s = document.createElement('span'); s.textContent = label;
    b.append(i, s);
    b.onclick = () => { G.me.st = e; lsSet('pixel.status', e); pres({ st: e }); $('#statusIcon').textContent = e || '📝'; buildTrays(); $('#statusTray').classList.add('hidden'); closeTrays(); };
    st.append(b);
  }
}
$('#toolbar').addEventListener('click', (e) => {
  const tool = e.target.closest('[data-tool]')?.dataset.tool;
  if (!tool) return;
  if (tool === 'look') openCreator(false);
  if (tool === 'desk') { if (G.edit) setEdit(false); goToMyDesk(); }

  if (tool === 'emote') toggleTray('emoteTray');
  if (tool === 'status') toggleTray('statusTray');
  if (tool === 'chat') setChatOpen(!G.chatOpen);
});
$('#roomChip').onclick = () => { const p = $('#people'); p.classList.toggle('hidden'); G.peopleSig = ''; if (!p.classList.contains('hidden')) renderPeople(); };

$('#leaveTop').onclick = () => askLeave();

function askLeave() {
  $('#people').classList.add('hidden');
  openModal((card) => {

function colorRow(label, pal, get, set, natural) {
  // สร้างปุ่มครั้งเดียว แล้วแค่เปลี่ยนไฮไลต์ — ห้ามสร้าง <input type=color> ใหม่ระหว่างเลือก
  // (iPhone จะปิดหน้าต่างเลือกสีทันทีถ้า input ถูกลบ/สร้างใหม่ ต้องกดเปิดใหม่เรื่อยๆ)
  const o = el('div', 'opt');

    const b = el('button', 'sw'); b.type = 'button';
    b.style.background = c || natural || '#ccc';

  const ico = el('span', 'ico', '🎨');
  const inp = el('input'); inp.type = 'color';
  const cur0 = get();
  inp.value = isHex(cur0) ? cur0 : (pal[typeof cur0 === 'number' ? cur0 : 0] || '#ff8fab');
  const pick = () => { set(inp.value.toLowerCase()); refresh(); };
  inp.addEventListener('input', pick);
  inp.addEventListener('change', pick);
  lab.append(ico, inp);
  row.append(lab);
  function refresh() {
    const cur = get();
    btns.forEach((b, i) => b.classList.toggle('sel', cur === i));
    const hex = isHex(cur);

    location.reload();
  };

  box.innerHTML = '<div class="upd-ico">🔄</div><div class="upd-txt"><b>มีอัปเดตใหม่!</b><span>จะรีโหลดอัตโนมัติใน <em class="upd-n"></em> วินาที — เข้าห้องให้เองหลังโหลดเสร็จ</span></div><button class="pbtn pink">รีโหลดเลย</button>';

  box.querySelector('button').onclick = reload;

G.micSet.r = clampMic(G.micSet.r);

function updateZones() {

// วงรัศมีไมค์ (เฉพาะห้องรวม): ของเราตอนเปิดไมค์/ตอนตั้งค่า, ของเพื่อนตอนเขากำลังพูด
function ring(b, x, y, r, color, alpha, t) {
  b.globalAlpha = alpha;

  }

}

  const editing = G.voicePanelOpen || !$('#micPop').classList.contains('hidden');

G.screens = new Map();
const YT = { player: null, ready: false, apiPromise: null, cur: null, suppressUntil: 0, hiddenKey: '', lastPlayTry: 0 };
function parseYouTube(text) {
  try {
    const u = new URL(String(text).trim());
    let id = null;
    if (/(^|\.)youtu\.be$/.test(u.hostname)) id = u.pathname.slice(1).split('/')[0];
    else if (/(^|\.)youtube\.com$/.test(u.hostname)) {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(shorts|embed|live)\/([\w-]{11})/); if (m) id = m[2]; }
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    let t = 0;
    const ts = u.searchParams.get('t') || u.searchParams.get('start');
    if (ts) { const m = ts.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if (m) t = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); }

}

const ytThumbs = new Map();

function drawScreenThumb(c, it, sx, sy) {

  if (e.ready) {
    const prev = c.imageSmoothingEnabled; c.imageSmoothingEnabled = true;
    const k = Math.min(r[2] / 320, r[3] / 180), w = 320 * k, h = 180 * k; // ภาพปก 16:9 ไม่ยืด
    c.drawImage(e.img, r[0] + (r[2] - w) / 2, r[1] + (r[3] - h) / 2, w, h);
    c.imageSmoothingEnabled = prev;
  }
  const cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
  c.fillStyle = '#ff0033'; c.fillRect(cx - 4, cy - 3, 9, 7);
  c.fillStyle = '#ffffff'; c.fillRect(cx - 1, cy - 2, 1, 5); c.fillRect(cx, cy - 1, 1, 3); c.fillRect(cx + 1, cy, 1, 1);

// แตะแถบชื่อสองครั้ง = กลับที่เดิม · ตำแหน่งจำไว้ในเครื่องนี้
function makeDraggable(panel, keyName) {
  const head = panel.querySelector('header');
  const place = (fx, fy) => {
    const w = panel.offsetWidth || parseFloat(panel.style.width) || 300, h = panel.offsetHeight || 60;
    const x = clamp(fx * innerWidth, 4, Math.max(4, innerWidth - w - 4));
    const y = clamp(fy * innerHeight, 4, Math.max(4, innerHeight - h - 4));
    panel.style.left = x + 'px'; panel.style.top = y + 'px';
  };
  const setFree = (pos) => {
    if (!pos) { panel.classList.remove('free'); panel.style.left = panel.style.top = panel.style.width = ''; lsSet(keyName, null); return; }
    if (!panel.classList.contains('free')) { panel.style.width = panel.getBoundingClientRect().width + 'px'; panel.classList.add('free'); }
    place(pos.fx, pos.fy);
  };
  const saved = lsGet(keyName, null);
  if (saved && Number.isFinite(saved.fx)) {
    panel.classList.add('free');
    if (saved.w) panel.style.width = Math.min(saved.w, innerWidth - 8) + 'px';
    requestAnimationFrame(() => place(saved.fx, saved.fy));
  }
  let drag = null;
  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || panel.classList.contains('big')) return;
    const r = panel.getBoundingClientRect();
    drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, moved: false, sx: e.clientX, sy: e.clientY };
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
    if (!drag.moved) { drag.moved = true; panel.style.width = drag.w + 'px'; panel.classList.add('free', 'dragging'); }
    const fx = (e.clientX - drag.dx) / innerWidth, fy = (e.clientY - drag.dy) / innerHeight;
    place(fx, fy); drag.last = { fx, fy };
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    panel.classList.remove('dragging');
    if (drag.moved && drag.last) {
      const r = panel.getBoundingClientRect();
      lsSet(keyName, { fx: r.left / innerWidth, fy: r.top / innerHeight, w: Math.round(r.width) });
    }
    drag = null;
  };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  head.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) setFree(null); });
  window.addEventListener('resize', () => { const s2 = lsGet(keyName, null); if (s2 && panel.classList.contains('free')) place(s2.fx, s2.fy); });
  // ตอนหน้าต่างเพิ่งโผล่ (เริ่มเล่นคลิป) จัดตำแหน่งใหม่ให้พอดีจอ
  new MutationObserver(() => { const s2 = lsGet(keyName, null); if (s2 && !drag && panel.classList.contains('free') && !panel.classList.contains('hidden')) place(s2.fx, s2.fy); }).observe(panel, { attributes: true, attributeFilter: ['class'] });
}

let mmBase = null;
function setMM(v) { mmOn = v; lsSet('pixel.mm', v); $('#mm').classList.toggle('collapsed', !v); if (v) drawMinimap(); }
setMM(mmOn);
function drawMinimap() {
  if (!mmOn || !G.joined) return;
  const cv = $('#mmCanvas'), dpr = 2;
  if (!mmBase) { mmBase = mkCanvas(MM_W * dpr, MM_H * dpr); const g0 = mmBase.getContext('2d'); g0.imageSmoothingEnabled = true; g0.drawImage(BG, 0, 0, MM_W * dpr, MM_H * dpr); }
  if (cv.width !== MM_W * dpr) { cv.width = MM_W * dpr; cv.height = MM_H * dpr; cv.style.width = MM_W + 'px'; cv.style.height = MM_H + 'px'; }
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(mmBase, 0, 0); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const P = (x, y) => [(x - LEFT) * MM_K, (y - TOP) * MM_K];
  if (G.scale && G.view) { const [vx, vy] = P(G.cam.x, G.cam.y); g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 1.5; g.strokeRect(vx, vy, (G.view.cw / G.scale) * MM_K, (G.view.ch / G.scale) * MM_K); }
  const dot = (x, y, r, fill) => { const [px, py] = P(x, y); g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); g.lineWidth = 1.2; g.strokeStyle = '#2b2433'; g.stroke(); };
  for (const n of G.npcs || []) dot(n.x, n.y, 2, '#c46bff');
  for (const rt of G.others.values()) if (Number.isFinite(rt.x)) dot(rt.x, rt.y, 2.6, '#ffffff');
  dot(G.me.x, G.me.y, 3.6, '#3cc36f');
}

// ข้อมูลอยู่ที่เซิร์ฟเวอร์ (ไม่ส่งให้ผู้ใช้ทั่วไป) — ขอใหม่ทุกครั้งที่เปิด/กดรีเฟรช
G.adm = { tab: lsGet('pixel.admTab', 'over'), q: '', open: null, data: null, busy: false };
const admKey = () => lsGet('pixel.admin', '') || '';
function fmtDur(ms) {
  ms = Math.max(0, ms || 0);
  const m = Math.round(ms / 60000);
  if (m < 1) return '< 1 นาที';
  if (m < 60) return `${m} นาที`;
  const h = Math.floor(m / 60), r = m % 60;
  return h < 48 ? `${h} ชม.${r ? ` ${r} นาที` : ''}` : `${Math.round(h / 24)} วัน`;
}
function fmtAgo(ts, now) {
  if (!ts) return '—';
  const d = Math.max(0, (now || Date.now()) - ts) / 60000;
  if (d < 1) return 'เมื่อกี้';
  if (d < 60) return `${Math.round(d)} นาทีก่อน`;
  if (d < 1440) return `${Math.round(d / 60)} ชม.ก่อน`;
  if (d < 1440 * 30) return `${Math.round(d / 1440)} วันก่อน`;
  return new Date(ts).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
}
const fmtTime = (ts) => new Date(ts).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const thDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', timeZone: 'UTC' }); };

function admOverview(body, D) {
  const today = D.days.find((d) => d.d === D.today) || { u: 0, s: 0, ms: 0, peak: 0, chats: 0 };
  const grid = el('div', 'adm-stats');
  grid.append(
    admStat('ออนไลน์ตอนนี้', `${D.online} / ${D.max}`, 'คน'),
    admStat('วันนี้เข้ามา', `${today.u} คน`, `${today.s} ครั้ง · สูงสุดพร้อมกัน ${today.peak}`),
    admStat('เวลาใช้งานวันนี้', fmtDur(today.ms), `แชต ${today.chats} ข้อความ`),
    admStat('7 วันล่าสุด', `${D.u7} คน`, 'ไม่นับซ้ำ'),
    admStat('30 วันล่าสุด', `${D.u30} คน`, 'ไม่นับซ้ำ'),
    admStat('ผู้ใช้ทั้งหมด', `${D.uAll} คน`, `เริ่มเก็บ ${fmtAgo(D.since, D.now)}`),
    admStat('พร้อมกันมากสุด', `${D.peak.n || 0} คน`, D.peak.ts ? fmtTime(D.peak.ts) : '—'),
  );
  body.append(grid);
  // กราฟรายวัน 30 วัน (ช่องที่ไม่มีคนเข้า = 0)
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const k = new Date(D.now + 7 * 3600000 - i * 86400000).toISOString().slice(0, 10);
    days.push(D.days.find((d) => d.d === k) || { d: k, u: 0, s: 0, ms: 0, peak: 0, chats: 0 });
  }
  const metric = G.adm.metric || 'u';
  const box = el('div', 'adm-box');
  const bh = el('div', 'adm-boxh'); bh.append(el('b', null, 'รายวัน (30 วัน)'));
  const seg = el('div', 'seg');
  [['u', 'คน'], ['s', 'ครั้งที่เข้า'], ['ms', 'เวลาใช้'], ['chats', 'แชต']].forEach(([k, t]) => { const b = el('button', metric === k ? 'on' : '', t); b.onclick = () => { G.adm.metric = k; paintAdmin(); }; seg.append(b); });
  bh.append(seg); box.append(bh);
  const max = Math.max(1, ...days.map((d) => d[metric] || 0));
  const bars = el('div', 'adm-bars');
  days.forEach((d, i) => {
    const v = d[metric] || 0;
    const col = el('div', 'bar' + (d.d === D.today ? ' today' : ''));
    col.title = `${thDay(d.d)} — ${metric === 'ms' ? fmtDur(v) : v + (metric === 'u' ? ' คน' : metric === 's' ? ' ครั้ง' : ' ข้อความ')}`;
    const f = el('i'); f.style.height = (v ? Math.max(4, (v / max) * 100) : 0) + '%'; col.append(f);
    if (v && (metric !== 'ms') && days.length <= 31) { const n = el('span', 'n', String(v)); col.append(n); }
    if (i % 5 === 0 || i === days.length - 1) col.append(el('span', 'd', thDay(d.d)));
    bars.append(col);
  });
  box.append(bars);
  body.append(box);
  // ห้องยอดนิยม (เวลาที่คนอยู่ในห้องนั้นรวมกัน)
  const zs = Object.entries(D.zones || {}).filter(([z]) => ZONES[z]).sort((a, b) => b[1] - a[1]);
  const zb = el('div', 'adm-box');
  zb.append(el('div', 'adm-boxh', null)); zb.firstChild.append(el('b', null, 'ห้องยอดนิยม (เวลาที่คนอยู่รวมกัน)'));
  if (!zs.length) zb.append(el('div', 'adm-empty', 'ยังไม่มีข้อมูล — จะเริ่มนับเมื่อมีคนเข้าห้อง'));
  const zmax = Math.max(1, ...zs.map(([, v]) => v));

    const r = el('div', 'adm-hbar');
    r.append(el('span', 'nm', `${ZONES[z].icon} ${zoneName(z)}`));
    const t = el('span', 'tr'); const f = el('i'); f.style.width = (v / zmax) * 100 + '%'; t.append(f);
    r.append(t, el('span', 'vv', fmtDur(v)));

  });

}

      if (u.on) {
        const rt = [...G.others.values()].find((r) => r.by === u.uid || (r.p && r.p.uid === u.uid));
        if (rt) { const go = el('button', 'pbtn sm', '🚶 ไปหา'); go.onclick = () => { G.adminOpen = false; closeModal(); walkTo(rt.x + 14, rt.y + 4); }; acts.append(go); }
      }
      det.append(acts);
      // สิทธิ์ผู้ดูแล + ปิดไมค์ / ปิดหู / เตะ
      det.append(el('div', 'uh', '🛡️ ผู้ดูแล — ปิดไมค์ / ปิดหู / เตะ คนอื่นได้ (จัดการแอดมินกับผู้ดูแลด้วยกันไม่ได้)'));
      const ma = el('div', 'modacts');
      const mt = el('button', 'uit' + (u.mod ? ' has' : '')); mt.append(el('span', 'ck', u.mod ? '✓' : '+'), el('span', null, u.mod ? 'เป็นผู้ดูแลอยู่ — แตะเพื่อยกเลิก' : 'ให้เป็นผู้ดูแล'));
      mt.onclick = () => { G.adm.busy = true; paintAdmin(); G.net.admin(u.mod ? 'delmod' : 'addmod', admKey(), { uid: u.uid }); };
      ma.append(mt);
      det.append(ma);
      if (u.on) {
        const rt = [...G.others.values()].find((r) => r.by === u.uid || (r.p && r.p.uid === u.uid));
        if (rt) {
          const mc = el('div', 'modacts');
          const b1 = el('button', 'pbtn sm', u.fm ? '🎙️ เปิดไมค์คืน' : '🔇 ปิดไมค์'); b1.onclick = () => { G.adm.busy = true; paintAdmin(); G.net.mod(u.fm ? 'unmute' : 'mute', rt.key); };
          const b2 = el('button', 'pbtn sm', u.fd ? '🔊 เปิดหูคืน' : '🔕 ปิดหู'); b2.onclick = () => { G.adm.busy = true; paintAdmin(); G.net.mod(u.fd ? 'undeaf' : 'deaf', rt.key); };
          const b3 = el('button', 'pbtn sm', '👢 เตะ'); b3.onclick = () => { if (confirm(`เตะ ${u.n} ออกจากห้อง?`)) { G.net.mod('kick', rt.key); setTimeout(admRefresh, 600); } };
          const b4 = el('button', 'pbtn sm', '⏳ เตะ + ห้าม 10 นาที'); b4.onclick = () => { if (confirm(`เตะ ${u.n} และห้ามเข้า 10 นาที?`)) { G.net.mod('kick', rt.key, 10 * 60000); setTimeout(admRefresh, 600); } };
          mc.append(b1, b2, b3, b4);
          det.append(mc);
        }
      }
      row.append(det);
    }
    body.append(row);
  }
}

function admLog(body, D) {
  if (!D.log.length) { body.append(el('div', 'adm-empty', 'ยังไม่มีประวัติ')); return; }
  let lastDay = '';
  for (const e of D.log) {
    const k = new Date(e.ts + 7 * 3600000).toISOString().slice(0, 10);
    if (k !== lastDay) { lastDay = k; body.append(el('div', 'adm-day', k === D.today ? 'วันนี้' : thDay(k))); }
    const r = el('div', 'adm-ev ' + e.ev);
    r.append(el('span', 't', new Date(e.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })), el('span', 'ic2', e.ev === 'in' ? '➡️' : '⬅️'),
      el('span', 'nm', e.n || 'ไม่มีชื่อ'), el('span', 'what', e.ev === 'in' ? 'เข้ามา' : `ออกไป · อยู่ ${fmtDur(e.ms)}`));
    body.append(r);
  }
}
// ปุ่มในเมนู ⋯ (เห็นเฉพาะแอดมิน) + พิมพ์ "สถิติ" / "stats"
$('#moreAdmin').onclick = openAdminPanel;
setInterval(() => { $('#moreAdmin').classList.toggle('hidden', !G.isAdmin); }, 1000);
setInterval(() => { if (G.adminOpen && G.adm.tab !== 'users' && !G.adm.busy && !document.hidden) admRefresh(); }, 30000);

})();
</script>
