<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2e2235" />
<title>Pixel Hangout</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #2e2235;
  --ink2: #5a4f78;
  --paper: #fff7ec;
  --paper2: #ffeedd;
  --pink: #ff8fab;
  --pink2: #ffc2d2;
  --blue: #7d9cf0;
  --mint: #8fd694;
  --yellow: #ffe07a;
  --red: #e8505b;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  font-family: 'Mitr', 'Pixelify Sans', system-ui, -apple-system, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2e2235; overflow: hidden; }
body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
input, textarea { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; display: block; }

/* ---------- ปุ่มพิกเซล ---------- */
.pbtn {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
  padding: 6px 12px; font-weight: 500; font-size: 14px; line-height: 1.2; transition: transform .06s, box-shadow .06s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.pbtn:hover { background: #fff; }
.pbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.pbtn.sq { width: 40px; height: 40px; padding: 0; font-size: 18px; }
.pbtn.sm { padding: 4px 9px; font-size: 13px; }
.pbtn.pink { background: var(--pink); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.pbtn.blue { background: var(--blue); color: #fff; }
.pbtn.mint { background: var(--mint); }
.pbtn.danger { background: #ffd0d4; }
.pbtn.on { background: var(--yellow); }
.pbtn.off { background: #ffd0d4; }
.pbtn:disabled { opacity: .55; cursor: not-allowed; }

/* ---------- แถบบน ---------- */
.topbar {
  position: fixed; top: calc(10px + var(--safe-t)); left: 10px; right: 10px; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5;
}
.topbar > * { pointer-events: auto; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); max-width: 56vw;
}
.chip b { font-family: 'Pixelify Sans', 'Mitr', sans-serif; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .count { display: flex; gap: 3px; align-items: center; background: var(--paper2); border-radius: 8px; padding: 1px 7px; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--mint); border: 2px solid var(--ink); flex: none; }
.dot.off { background: var(--yellow); }
.dot.solo { background: #c8c4d0; }
.top-right { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.zoom { display: flex; gap: 6px; }
.banner {
  position: fixed; top: calc(62px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 4;
  background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px;
  box-shadow: 0 3px 0 var(--ink); max-width: min(560px, 92vw); text-align: center;
}

/* ---------- แผง ---------- */
.panel {
  position: fixed; z-index: 6; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 3px dashed #e6d4c2; }
.x { width: 34px; height: 34px; border: 0; background: var(--paper2); border-radius: 8px; font-size: 15px; flex: none; position: relative; touch-action: manipulation; }
.x::after { content: ''; position: absolute; inset: -8px; }
.people { top: calc(64px + var(--safe-t)); left: 10px; width: min(330px, calc(100vw - 20px)); max-height: 72dvh; display: flex; flex-direction: column; }
.people ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.people li { display: flex; align-items: flex-start; gap: 10px; padding: 6px; border-radius: 10px; }
.people li:hover { background: var(--paper2); }
.people canvas { width: 33px; height: 54px; image-rendering: pixelated; flex: none; }
.people .who { flex: 1; min-width: 0; }
.people .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.people .who small { display: block; color: var(--ink2); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.people .who .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.people .who .acts .pbtn { padding: 3px 9px; font-size: 13px; }
.note { margin: 0; padding: 8px 12px 12px; font-size: 12px; color: var(--ink2); }

/* ---------- ปุ่มแอ็กชันตามบริบท ---------- */
.actions {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--safe-b)); z-index: 5;
  display: flex; gap: 8px; pointer-events: none;
}
.actions .pbtn { pointer-events: auto; font-size: 15px; padding: 8px 16px; animation: pop .18s ease-out; }
.actions .hint { pointer-events: none; background: rgba(46,34,53,.85); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 13px; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- แถบเครื่องมือล่าง ---------- */
.toolbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); z-index: 5;
  display: flex; gap: 6px; padding: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
}
.toolbar button {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 62px; padding: 5px 0 4px;
  border: 0; background: transparent; border-radius: 10px; font-size: 11.5px; color: var(--ink2);
}
.toolbar button i { font-style: normal; font-size: 22px; line-height: 1.15; }
.toolbar button:hover { background: var(--paper2); }
.toolbar button.active { background: var(--pink2); color: var(--ink); }
.badge { position: absolute; top: -4px; right: 4px; min-width: 18px; height: 18px; border-radius: 6px; background: var(--red); color: #fff; font-size: 11px; display: grid; place-items: center; border: 2px solid var(--ink); padding: 0 3px; }

.tray {
  /* left+right+fit-content = กว้างได้เต็มจอแล้วค่อยขึ้นบรรทัดใหม่ (เดิม left:50% ทำให้กว้างได้แค่ครึ่งจอ ปุ่มท้ายๆ ล้นตกขอบ) */
  position: fixed; left: 8px; right: 8px; margin: 0 auto; width: fit-content; bottom: calc(92px + var(--safe-b)); z-index: 6;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 6px; max-width: calc(100vw - 16px);
  max-height: 60dvh; overflow-y: auto;
}
.tray .tray-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tray .emo { font-size: 26px; width: 46px; height: 46px; border: 0; background: var(--paper2); border-radius: 10px; flex: none; }
.tray .emo:hover { background: var(--pink2); transform: translateY(-2px); }
.tray .st { display: flex; flex-direction: column; align-items: center; font-size: 11px; width: 58px; padding: 4px 0; border: 0; background: var(--paper2); border-radius: 10px; flex: none; }
.tray .st i { font-style: normal; font-size: 20px; }
.tray .st.sel { background: var(--yellow); }
.tray .fb { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; padding: 4px 0; border: 0; background: var(--paper2); border-radius: 10px; flex: none; font-size: 11px; }
.tray .fb canvas { width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain; }
.tray .fb:hover { background: var(--pink2); }
.tray .cats { flex: 0 0 100%; display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 2px; }
/* ถาดจัดห้อง: ขนาดคงที่ ของชิ้นใหญ่ เรียงเป็นตาราง ล้นแล้วเลื่อนขึ้น-ลง */
#editTray { width: min(900px, calc(100vw - 16px)); height: min(440px, 56dvh); max-height: none; display: grid; align-items: stretch; justify-content: stretch; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; overflow: hidden; padding: 10px; }
#editTray .tray-scroll { min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 8px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 4px 2px; scrollbar-width: auto; }
#editTray .fb { width: auto; min-height: 112px; padding: 8px 4px 6px; gap: 4px; font-size: 12.5px; line-height: 1.25; text-align: center; border: 2px solid transparent; }
#editTray .fb:hover { border-color: var(--ink); }
#editTray .fb canvas { width: 68px; height: 68px; }
#editTray #editDone { justify-self: end; align-self: end; padding-left: 28px; padding-right: 28px; }
#editTray .cats button { font-size: 13px; padding: 4px 12px; }
@media (max-width: 600px) {
  #editTray { height: min(420px, 50dvh); padding: 8px; }
  #editTray .tray-scroll { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  #editTray .fb { min-height: 96px; font-size: 11px; }
  #editTray .fb canvas { width: 52px; height: 52px; }
  #editTray .cats { gap: 4px; }
  #editTray .cats button { font-size: 11.5px; padding: 3px 9px; }
}
.tray .cats::-webkit-scrollbar { display: none; }
.tray .cats button { flex: none; border: 2px solid var(--ink); background: var(--paper2); border-radius: 999px; padding: 3px 10px; font: 500 12px Mitr, sans-serif; color: var(--ink); white-space: nowrap; }
.tray .cats button.on { background: var(--pink); color: #fff; }
.tray .cats button small { opacity: .7; margin-left: 3px; }
.selbar { position: fixed; z-index: 6; display: flex; gap: 6px; transform: translate(-50%, -100%); }

/* ---------- แชต ---------- */
.chat {
  position: fixed; right: 12px; top: calc(64px + var(--safe-t)); bottom: calc(96px + var(--safe-b)); width: 310px; z-index: 5;
  display: flex; flex-direction: column; background: rgba(255,247,236,.96); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.chat.closed { display: none; }
.chat header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; border-bottom: 3px dashed #e6d4c2; }
.msgs { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; user-select: text; }
.msg { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; }
.msg canvas { width: 26px; height: 26px; image-rendering: pixelated; grid-row: span 2; background: var(--paper2); border-radius: 8px; }
.msg .meta { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.msg .meta b { font-weight: 600; }
.msg .meta time { color: #9a8fa8; font-size: 11px; }
.msg .text { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.cont { margin-top: -4px; }
.msg.cont canvas, .msg.cont .meta { display: none; }
.msg.cont .text, .msg .att { grid-column: 2; }
.msg.adm { position: relative; padding-right: 30px; border-radius: 8px; }
.msg.adm:hover { background: rgba(255,143,171,.08); }
.mdel { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-width: 24px; height: 22px; padding: 0 5px; border: 0; border-radius: 6px;
  background: var(--paper2); color: #b0546a; font-size: 11px; line-height: 1; touch-action: manipulation; }
.mdel.arm { background: var(--red); color: #fff; font-weight: 600; }
.sys { text-align: center; font-size: 12px; color: #9a8fa8; white-space: pre-line; }
.sys.help { text-align: left; background: #fff; border: 2px dashed #e6d4c2; border-radius: 10px; padding: 8px 10px; color: var(--ink2); line-height: 1.6; }
#helpBtn { margin-left: auto; margin-right: 6px; padding: 3px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }
.chat form { display: flex; gap: 6px; padding: 8px; border-top: 3px dashed #e6d4c2; }
.chat input { flex: 1; min-width: 0; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 15px; background: #fff; outline: none; }
.chat input:focus { border-color: var(--pink); }

/* ---------- โมดัล ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(46,34,53,.55); display: grid; place-items: center; padding: 12px; }
.card {
  width: min(760px, 100%); max-height: calc(100dvh - 24px); overflow: auto; background: var(--paper); border: 3px solid var(--ink);
  border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 18px;
}
.card h2 { margin: 0 0 4px; font-family: 'Pixelify Sans', 'Mitr', sans-serif; font-size: 24px; }
.card .sub { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
.creator { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
/* หน้าแต่งตัว/แต่งโต๊ะ: ภาพตัวอย่างอยู่กับที่ เลื่อนเฉพาะรายการตัวเลือก (ใช้ได้ทุกเบราว์เซอร์รวม Safari) */
.card.split { display: flex; flex-direction: column; overflow: hidden; height: min(720px, calc(100dvh - 24px)); }
.card.split > h2, .card.split > .sub, .card.split > .foot, .card.split > .tip { flex: none; }
.card.split .creator { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
.card.split .stage-wrap { align-self: start; }
.card.split .creator > .opts { overflow-y: auto; min-height: 0; padding: 2px 6px 8px 2px; overscroll-behavior: contain; }
.card.split .foot { margin-top: 10px; padding-top: 10px; border-top: 3px dashed #e6d4c2; }
.stage {
  position: relative; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; aspect-ratio: 1;
  background: repeating-linear-gradient(0deg, #e9c9a8 0 12px, #e2bf9b 12px 24px);
}
.stage canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.stage .turn { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.rot { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
.rot .pbtn { padding: 2px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; letter-spacing: .02em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.sw.sel { outline: 3px solid var(--pink); outline-offset: 2px; }
.ch { padding: 5px 10px; border-radius: 9px; border: 2px solid var(--ink); background: #fff; font-size: 13px; }
.ch.sel { background: var(--yellow); box-shadow: 0 2px 0 var(--ink); }
.field input { width: 100%; border: 3px solid var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 16px; background: #fff; outline: none; }
.field input:focus { border-color: var(--pink); }
.card .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.card .foot .pbtn { padding: 9px 18px; font-size: 15px; }
.tip { font-size: 12px; color: var(--ink2); margin: 10px 0 0; }

.loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: #fff7ec; z-index: 30; background: #2e2235; }
.spinner { width: 28px; height: 28px; background: var(--pink); border: 3px solid #fff7ec; animation: spin 1s steps(4) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.focus { position: fixed; inset: 0; z-index: 25; background: rgba(46,34,53,.92); display: grid; place-items: center; }
.focus video { max-width: 94vw; max-height: 80dvh; border: 4px solid #fff7ec; border-radius: 12px; display: block; background: #000; }
.focus-in { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.focus-cap { max-width: min(520px, 92vw); margin: 0; background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; text-align: center; }
.toast {
  position: fixed; z-index: 40; left: 50%; top: calc(70px + var(--safe-t)); transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
  background: var(--ink); color: #fff7ec; border-radius: 10px; padding: 8px 14px; font-size: 14px; transition: .2s; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- โซน / กระดาน ---------- */
.top-left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chip.zone { font-size: 13px; padding: 3px 10px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; background: var(--paper2); }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.btile { position: relative; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.btile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; background: #eee; }
.btile .bmeta { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; font-size: 12px; }
.btile .bmeta b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btile .bmeta small { color: var(--ink2); white-space: nowrap; }
.btile .x { position: absolute; top: 6px; right: 6px; background: rgba(255,247,236,.9); }
.focus img { max-width: 94vw; max-height: 88dvh; border: 4px solid #fff7ec; border-radius: 12px; background: #fff; }

/* ---------- YouTube ดูด้วยกัน ---------- */
.dock { position: fixed; left: 12px; bottom: calc(96px + var(--safe-b)); width: 400px; z-index: 6; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.yt { position: relative; width: 100%; background: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.35); overflow: hidden; }
.yt header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; color: #fff7ec; font-size: 13px; }
.yt header b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.ytbtns { display: flex; gap: 4px; }
.ytbtns button { width: 30px; height: 28px; border: 0; border-radius: 7px; background: rgba(255,247,236,.15); color: #fff; font-size: 14px; }
.ytbtns button:hover { background: rgba(255,247,236,.3); }
.ytbox { position: relative; aspect-ratio: 16 / 9; background: #000; }
.ytbox iframe, .ytbox #ytPlayer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#ytTap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; }
.yt.big { position: fixed; left: 50%; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(1100px, 94vw) !important; z-index: 12; }
.ytbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.scrtabs { display: flex; gap: 4px; padding: 0 8px 6px; flex-wrap: wrap; }
.scrtabs button { border: 0; border-radius: 7px; padding: 3px 8px; font-size: 12px; background: rgba(255,247,236,.15); color: #fff7ec; }
.scrtabs button.sel { background: var(--pink); color: #fff; }

.chip.zone { cursor: pointer; }
.micpop { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(100px + var(--safe-b)); width: min(320px, calc(100vw - 20px)); }
.micpop-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.micpop-body .row { gap: 5px; }
.micpop-body .sw { width: 26px; height: 26px; }
.micpop-body input[type=range] { width: 100%; }
.micpop-body .tip { margin: 0; }
/* ---------- รายชื่อห้องด้านข้าง (แบบช่องเสียง Discord) ---------- */
.rooms { position: fixed; left: 12px; top: calc(64px + var(--safe-t)); width: 210px; max-height: calc(100dvh - 190px - var(--safe-t) - var(--safe-b)); z-index: 5;
  display: flex; flex-direction: column; background: rgba(255,247,236,.96); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); }
.rooms header { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px 5px 12px; border-bottom: 3px dashed #e6d4c2; font-size: 14px; }
.rooms header .x { width: 30px; height: 30px; font-size: 18px; }
#roomsList { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; overscroll-behavior: contain; }
.rm { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 6px 7px; border-radius: 8px; font: inherit; font-size: 14px; color: var(--ink2); text-align: left; cursor: pointer; touch-action: manipulation; }
.rm:hover { background: var(--paper2); }
.rm.here { background: var(--pink2); color: var(--ink); font-weight: 600; }
.rm .spk { flex: none; font-size: 13px; opacity: .75; }
.rm .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm .c { flex: none; font-size: 11px; background: var(--paper2); border-radius: 6px; padding: 0 6px; }
.rm.here .c { background: #fff; }
.mem { display: flex; align-items: center; gap: 7px; padding: 3px 6px 3px 28px; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--ink2); }
.mem:hover { background: var(--paper2); }
.mem canvas { width: 15px; height: 24px; image-rendering: pixelated; flex: none; border-radius: 5px; transition: box-shadow .1s; }
.mem.talk canvas { box-shadow: 0 0 0 2px #3ba55d; }
.mem.talk .nm { color: var(--ink); font-weight: 600; }
.mem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem .mi { flex: none; display: flex; gap: 2px; }
.mem .mi img { width: 18px; height: 18px; image-rendering: pixelated; }
.roomsTab { position: fixed; left: 12px; top: calc(64px + var(--safe-t)); z-index: 5; }
/* ---------- ออกจากห้อง / ออกจากเว็บ ---------- */
.leave-top { height: 40px; padding: 0 12px; font-size: 16px; font-weight: 600; }
.leave-card { text-align: center; max-width: 360px; }
.leave-col { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.pbtn.big { padding: 13px 16px; font-size: 16px; width: 100%; }
.pbtn.ghost { background: transparent; box-shadow: none; border-color: #d9c8b6; color: var(--ink2); }
.bye { position: fixed; inset: 0; display: grid; place-items: center; background: #2e2235; padding: 20px; font-family: Mitr, sans-serif; }
.bye-card { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 #000; padding: 26px 22px; max-width: 360px; text-align: center; color: var(--ink); }
.bye-emo { font-size: 46px; }
.bye-card h2 { margin: 6px 0; }
.bye-card p { color: var(--ink2); line-height: 1.6; margin: 0 0 16px; }

/* ---------- แชร์จอแบบ Discord ---------- */
.ytbox { position: relative; }
.live-badge { position: absolute; top: 6px; left: 6px; background: #ed4245; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: .5px; pointer-events: none; }
.scr-info { margin: 0; padding: 4px 10px 6px; font-size: 12px; color: var(--ink2); }
#scrPanel:fullscreen { background: #000; display: flex; flex-direction: column; }
#scrPanel:fullscreen .ytbox { flex: 1; }
#scrPanel:fullscreen video { width: 100%; height: 100%; object-fit: contain; }
.mem .live { flex: none; background: #ed4245; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; cursor: pointer; letter-spacing: .4px; }
.golive { max-width: 400px; }
.gl-lab { font-size: 13px; font-weight: 600; margin: 10px 0 6px; color: var(--ink2); }
.gl-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gl-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 10px; border: 2.5px solid #d9c8b6; border-radius: 10px; background: #fff; font: inherit; cursor: pointer; text-align: left; color: var(--ink); }
.gl-opt span { font-size: 11px; color: var(--ink2); }
.gl-opt.sel { border-color: var(--ink); background: var(--pink2); box-shadow: 0 3px 0 var(--ink); }
.gl-audio { margin-top: 12px; }

/* ---------- แจ้งเตือนอัปเดต (กลางด้านบน) ---------- */
.upd-alert { position: fixed; top: calc(14px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 14px;
  background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); padding: 14px 18px 18px; width: min(560px, calc(100vw - 24px)); overflow: hidden; animation: updIn .35s ease-out; }
.upd-ico { font-size: 34px; animation: updSpin 2s linear infinite; }
.upd-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.upd-txt b { font-size: 20px; }
.upd-txt span { font-size: 14px; color: var(--ink2); }
.upd-n { font-style: normal; font-weight: 700; font-size: 18px; color: #c2334a; }
.upd-alert .pbtn { flex: none; }
.upd-bar { position: absolute; left: 0; bottom: 0; height: 6px; background: #ff8fab; width: 100%; transition: width 1s linear; }
@keyframes updIn { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@keyframes updSpin { to { transform: rotate(360deg); } }
/* ---------- หน้าเข้าห้อง ---------- */
.card.enter { max-width: 380px; text-align: center; }
.enter-stage { width: 210px; height: 210px; margin: 6px auto 12px; position: relative; }
.enter-name { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #ff8fab; color: #fff; font-weight: 600; font-size: 14px; padding: 2px 12px; border-radius: 8px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.card.enter .field { text-align: left; }
.card.enter .foot { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.card.enter .foot .pbtn.big { width: auto; flex: 1; }

/* ---------- ลิงก์ + ไฟล์แนบในแชต ---------- */
#msgs .text a { color: #2f6fd0; text-decoration: underline; word-break: break-all; }
.att { margin: 4px 0 2px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; max-width: 100%; }
.att img { max-width: min(240px, 100%); max-height: 260px; border-radius: 10px; border: 2px solid var(--ink); cursor: zoom-in; object-fit: cover; background: #eee; }
.att video { max-width: min(260px, 100%); max-height: 240px; border-radius: 10px; border: 2px solid var(--ink); background: #000; }
.att audio { max-width: 100%; height: 36px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); text-decoration: none; font-size: 13px; }
.fchip b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fchip span { flex: none; font-size: 11px; color: var(--ink2); }
.att img + .fchip { padding: 2px 8px; font-size: 11px; border-width: 1.5px; }
.att .gone { font-size: 12px; color: var(--ink2); }
#chatForm .attach { flex: none; width: 40px; padding: 0; font-size: 18px; }
.attach-prog { position: relative; height: 18px; margin: 0 10px; border-radius: 6px; background: var(--paper2); overflow: hidden; }
.attach-prog i { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8fab; transition: width .2s; }
.attach-prog::after { content: attr(data-name); position: absolute; inset: 0; font-size: 11px; line-height: 18px; padding: 0 8px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chat.drop { outline: 4px dashed #ff8fab; outline-offset: -8px; }

@media (max-width: 760px) { .upd-alert { gap: 10px; padding: 10px 12px 14px; } .upd-txt b { font-size: 17px; } .upd-txt span { font-size: 12px; } .upd-ico { font-size: 26px; } }

@media (max-width: 760px) { .rooms { width: min(240px, calc(100vw - 24px)); z-index: 7; } }

@media (max-width: 760px) { .micpop-open .dock { visibility: hidden; } .micpop-body .tip + .tip { display: none; } }

/* ---------- ตั้งค่าเสียง/กล้อง ---------- */
.vset { display: grid; grid-template-columns: 250px 1fr; gap: 18px; }
.cam-prev { position: relative; aspect-ratio: 4 / 3; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #3a3150; display: grid; place-items: center; color: #fff7ec; font-size: 13px; }
.cam-prev video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.cam-prev video.back { transform: none; }
.vbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.vset select, .vset input[type=range] { width: 100%; }
.vset select { border: 3px solid var(--ink); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 14px; background: #fff; }
.vmeter { height: 14px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; margin-top: 6px; }
.vmeter i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--mint) 0 6px, #62b56c 6px 8px); transition: width .05s; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 6px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--pink); }
.mon { border: 3px dashed var(--pink); border-radius: 12px; padding: 10px 12px; background: #fff; }
.mon .warn { font-size: 12px; color: #c94a5a; margin: 6px 0 0; }
.mon input[type=range] { accent-color: var(--pink); margin-top: 6px; }

/* ---------- มือถือ ---------- */
@media (max-width: 760px) {
  .chat { left: 0; right: 0; top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); width: auto; border-radius: 0; border: 0; padding-top: var(--safe-t); padding-bottom: var(--safe-b); z-index: 15; background: var(--paper); }
  .toolbar { gap: 2px; padding: 4px; width: calc(100vw - 16px); justify-content: space-between; }
  .toolbar button { width: auto; flex: 1; font-size: 10.5px; }
  .toolbar button i { font-size: 20px; }
  .creator, .vset { grid-template-columns: 1fr; }
  .card.split { height: calc(100dvh - 24px); }
  .card.split .creator { grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  .stage-wrap { padding-bottom: 8px; border-bottom: 3px dashed #e6d4c2; }
  .stage { max-width: 140px; margin: 0 auto; width: 100%; }
  .card { padding: 14px; }
  .pbtn .lbl { display: none; }
  .chip b { display: none; }
  .top-right { gap: 4px; max-width: 60vw; }
  .bgrid { grid-template-columns: repeat(2, 1fr); }
  .dock { left: auto; right: 8px; width: min(64vw, 320px); top: calc(104px + var(--safe-t)); bottom: auto; }
  .yt header { font-size: 12px; padding: 4px 6px 4px 8px; }
  .ytbtns button { width: 26px; height: 24px; font-size: 12px; }
  .yt.big { width: 100vw !important; border-radius: 0; left: 50%; }
  .top-right:has(#micBtn:not(.hidden)) .zoom { display: none; }
  .pbtn.sq { width: 36px; height: 36px; font-size: 16px; }
  .leave-top { height: 36px; padding: 0 9px; }
  .chip b { font-size: 14px; }
  .actions { bottom: calc(86px + var(--safe-b)); }
  .tray { bottom: calc(80px + var(--safe-b)); }
}

.zoomtip { position: absolute; z-index: 50; transform-origin: top center; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; pointer-events: none; }

/* ---------- มือถือแนวนอน ---------- */
@media (max-height: 500px) and (orientation: landscape) {
  .topbar { left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); top: calc(6px + var(--safe-t)); }
  .pbtn.sq { width: 34px; height: 34px; font-size: 15px; }
  .chip b { display: none; }
  .toolbar { bottom: calc(6px + var(--safe-b)); gap: 2px; padding: 3px; border-radius: 14px; }
  .toolbar button { width: 46px; padding: 3px 0; font-size: 0; }
  .toolbar button i { font-size: 20px; }
  .toolbar .badge { font-size: 11px; }
  .actions { bottom: calc(56px + var(--safe-b)); }
  .tray, .micpop { bottom: calc(56px + var(--safe-b)); }
  .chat { left: auto; right: 0; top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); width: min(380px, 55vw); border-radius: 0; border: 0; border-left: 3px solid var(--ink);
    padding: var(--safe-t) env(safe-area-inset-right) var(--safe-b) 0; z-index: 15; background: var(--paper); }
  .dock { left: auto; right: calc(8px + env(safe-area-inset-right)); top: calc(52px + var(--safe-t)); bottom: auto; width: min(34vw, 300px); }
  .yt header { font-size: 12px; padding: 3px 6px 3px 8px; }
  .ytbtns button { width: 26px; height: 22px; font-size: 12px; }
  .yt.big { width: min(100vw, calc(100dvh * 1.6)) !important; }
  .people { top: calc(52px + var(--safe-t)); max-height: calc(100dvh - 120px); }
  .card { max-height: calc(100dvh - 16px); padding: 12px 14px; }
  .card.split { height: calc(100dvh - 16px); }
  .modal { padding: 8px; }
  .top-right:has(#micBtn:not(.hidden)) .zoom { display: none; }
}

/* ย่อหน้าต่างคลิป: ซ่อนภาพแต่ยังเล่นเสียงต่อ (ตัวเล่นยังอยู่ แค่มองไม่เห็น) */
.yt.mini .ytbox { position: absolute; left: 0; top: 0; width: 240px; height: 135px; aspect-ratio: auto; opacity: 0.01; pointer-events: none; z-index: -1; }
.yt.mini #ytTap { display: none; }
.yt.mini header b::after { content: ' · 🎧 ฟังอย่างเดียว'; opacity: .7; }
.yt.mini { width: auto; max-width: 100%; }
.leave-row { padding: 0 12px 12px; display: flex; justify-content: flex-end; }

/* หน้าต่างคลิปที่ลากออกมาวางเอง */
.yt header { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.yt.free { position: fixed; z-index: 7; margin: 0; }
.yt.free.big { left: 50% !important; top: 50% !important; }
.yt.dragging { opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.yt.dragging header { cursor: grabbing; }
.yt.dragging iframe { pointer-events: none; }

/* เสียงคลิป/ลำโพง เฉพาะเครื่องฉัน */
.ytvol { display: flex; align-items: center; gap: 6px; padding: 4px 8px 6px; font-size: 12px; color: var(--ink2); }
.ytvol.hidden { display: none; }
.ytvol input[type=range] { flex: 1; min-width: 60px; accent-color: var(--pink); }
.ytvol b { width: 26px; text-align: right; font-size: 12px; }
.ytvol button { border: 0; background: var(--paper2); border-radius: 6px; width: 28px; height: 24px; }
.ytvol button.on { background: var(--red); }
.ytvol .tip { flex-basis: 100%; margin: 0; font-size: 11px; }
.ytvol { flex-wrap: wrap; }

/* โรงหนัง: วิดีโอวางทับจอโปรเจกเตอร์ในห้อง (แถบปุ่มอยู่ใต้จอ) */
.yt.onscreen { position: fixed; z-index: 3; display: flex; flex-direction: column-reverse; border-width: 0; border-radius: 0; box-shadow: none; background: transparent; overflow: visible; }
.yt.onscreen .ytbox { aspect-ratio: auto; height: var(--sh, 120px); }
.yt.onscreen header { background: rgba(29,31,46,.86); border-radius: 0 0 10px 10px; padding: 3px 8px; font-size: 12px; }
.yt.onscreen header button { width: 26px; height: 22px; font-size: 12px; }
.yt.onscreen .ytvol { background: rgba(29,31,46,.86); }

/* ปรับเสียงเพื่อนทีละคน */
.people li.pvol-li { padding: 0 6px 8px 49px; display: block; }
.pvol { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; background: var(--paper2); border-radius: 10px; padding: 6px 8px; }
.pvol input[type=range] { flex: 1; min-width: 80px; accent-color: var(--pink); }
.pvol span { font-size: 12px; width: 34px; text-align: right; }
.pvol small { flex-basis: 100%; font-size: 11px; color: var(--ink2); }

.people .who small.vstat { margin-top: 2px; font-size: 11.5px; color: #6a5a7e; }

pre.diag { white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; background: #fff; border: 2px dashed #e6d4c2; border-radius: 10px; padding: 10px; margin: 8px 0; font-family: inherit; }
.leave-row { gap: 8px; justify-content: space-between; }
.rm .ed { flex: none; font-size: 12px; padding: 2px 4px; border-radius: 6px; opacity: .55; }
.rm .ed:hover { opacity: 1; background: #fff; }
.sw.custom { position: relative; display: inline-grid; place-items: center; font-size: 15px; cursor: pointer; background: conic-gradient(#ff5a6e, #ffd84d, #7ed37a, #5ab4ff, #8f7dff, #ff5a6e); overflow: hidden; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

.num-in { width: 84px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px; font: 600 18px Mitr, sans-serif; text-align: center; background: #fff; color: var(--ink); }

/* =====================================================================
   เลย์เอาต์ใหม่: แถบข้างซ้าย · ป้ายตำแหน่ง · แถบควบคุมล่าง · แผนที่ย่อ (โทนขาวสะอาด สีเขียวเป็นหลัก)
   ===================================================================== */
:root { --side-w: 0px; --chat-w: 0px; --ui-line: #e6e2ea; --ui-text: #2b2433; --ui-sub: #8a8296; --ui-green: #2f8f5b; --ui-green2: #e6f4ec; --ui-hover: #f4f2f6; --ui-red: #e24c5a; --ui-red2: #fdebed; --ui-shadow: 0 6px 22px rgba(30, 20, 40, .14); }
body.side-on { --side-w: 264px; }
body.side-off { --side-w: 52px; }
body.chat-open { --chat-w: 334px; }

/* ---- แถบข้างซ้าย ---- */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 7; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--ui-line);
  padding-top: var(--safe-t); padding-bottom: var(--safe-b); color: var(--ui-text); box-shadow: 2px 0 18px rgba(30, 20, 40, .06); }
.side-head { display: flex; align-items: center; gap: 6px; padding: 14px 10px 8px 14px; }
.side-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; padding: 4px 6px; border-radius: 10px; text-align: left; }
.side-title:hover { background: var(--ui-hover); }
.side-title b { font-size: 16px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-title small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ui-sub); }
.side .dot { width: 8px; height: 8px; border-radius: 50%; border: 0; background: #3cc36f; }
.side .dot.off { background: #f0b429; } .side .dot.solo { background: #c8c4d0; }
.ib { flex: none; width: 32px; height: 32px; border: 0; border-radius: 9px; background: none; font-size: 20px; color: var(--ui-sub); display: grid; place-items: center; }
.ib:hover { background: var(--ui-hover); color: var(--ui-text); }
.side-invite { margin: 4px 14px 8px; border: 0; border-radius: 11px; background: var(--ui-green); color: #fff; font: 600 14px Mitr, sans-serif; padding: 10px; box-shadow: 0 2px 0 #1f6b42; }
.side-invite:hover { filter: brightness(1.06); } .side-invite:active { transform: translateY(1px); box-shadow: none; }
.side-search { margin: 2px 14px 6px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--ui-line); border-radius: 10px; padding: 7px 10px; background: #fbfafc; color: var(--ui-sub); }
.side-search:focus-within { border-color: var(--ui-green); background: #fff; }
.side-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 13.5px Mitr, sans-serif; color: var(--ui-text); }
.side-sub { padding: 8px 18px 4px; font-size: 12px; color: var(--ui-sub); }
.side #roomsList { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; overscroll-behavior: contain; }
.side .rm { color: var(--ui-text); font-size: 14px; padding: 7px 10px; border-radius: 10px; gap: 8px; }
.side .rm:hover { background: var(--ui-hover); }
.side .rm.here { background: var(--ui-green2); color: #1f6b42; font-weight: 600; }
.side .rm .spk { font-size: 12px; opacity: .55; filter: grayscale(1); }
.side .rm .c { background: #fff; color: var(--ui-green); font-weight: 600; border-radius: 999px; padding: 0 7px; font-size: 11.5px; }
.side .rm:not(.here) .c { background: var(--ui-hover); color: var(--ui-sub); }
.side .rm .ed { font-size: 12px; opacity: .5; } .side .rm .ed:hover { opacity: 1; }
.side .mem { padding: 4px 8px 4px 26px; gap: 9px; color: var(--ui-text); border-radius: 10px; }
.side .mem:hover { background: var(--ui-hover); }
.side .mem .av { position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; background: #eef3ea; overflow: hidden; display: grid; place-items: center; }
.side .mem .av canvas { width: 30px; height: 30px; border-radius: 0; }
.side .mem .on-dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #3cc36f; border: 2px solid #fff; }
.side .mem.talk .av { box-shadow: 0 0 0 2px #3cc36f; }
.side .mem .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.side .mem .nm { font-size: 13.5px; }
.side .mem .sub { font-size: 11.5px; color: var(--ui-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .mem.talk .sub { color: var(--ui-green); }
.side .empty { padding: 14px 12px; text-align: center; font-size: 13px; color: var(--ui-sub); }
.side-foot { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ui-line); padding: 6px 8px; }
.side-foot button { border: 0; background: none; border-radius: 10px; padding: 8px 4px; font: 400 12.5px Mitr, sans-serif; color: var(--ui-sub); display: flex; align-items: center; justify-content: center; gap: 5px; }
.side-foot button:hover { background: var(--ui-hover); color: var(--ui-text); }
.side-foot i { font-style: normal; font-size: 14px; }
.side-open { position: fixed; left: 10px; top: calc(10px + var(--safe-t)); z-index: 7; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--ui-line); background: #fff; font-size: 18px; color: var(--ui-text); box-shadow: var(--ui-shadow); }

/* ---- ป้ายตำแหน่ง ---- */
.loc-pill { position: fixed; z-index: 5; top: calc(12px + var(--safe-t)); left: calc(var(--side-w) + 12px); display: flex; align-items: center; gap: 6px; max-width: calc(100vw - var(--side-w) - 24px);
  border: 1px solid var(--ui-line); border-radius: 999px; background: rgba(255, 255, 255, .96); padding: 6px 14px 6px 10px; font: 400 13px Mitr, sans-serif; color: var(--ui-text); box-shadow: 0 2px 10px rgba(30, 20, 40, .1); white-space: nowrap; overflow: hidden; }
.loc-pill:hover { background: #fff; }
.loc-pill .pin { font-size: 13px; filter: hue-rotate(90deg) saturate(.8); }
.loc-pill b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.loc-pill .near { color: var(--ui-sub); overflow: hidden; text-overflow: ellipsis; }
.loc-pill .near::before { content: '·'; margin: 0 6px 0 2px; }
.loc-pill .near:empty { display: none; }

/* ---- แถบควบคุมล่าง ---- */
#toolbar { left: calc((100vw + var(--side-w) - var(--chat-w)) / 2); transform: translateX(-50%); bottom: calc(14px + var(--safe-b)); display: flex; align-items: center; gap: 3px;
  padding: 6px 8px; background: #fff; border: 1px solid var(--ui-line); border-radius: 16px; box-shadow: var(--ui-shadow); width: auto; max-width: calc(100vw - var(--side-w) - var(--chat-w) - 24px); }
#toolbar > button { position: relative; width: 40px; height: 40px; padding: 0; flex: none; display: grid; place-items: center; border: 0; border-radius: 11px; background: none; font-size: 19px; color: var(--ui-text); }
#toolbar > button:hover { background: var(--ui-hover); }
#toolbar > button.active { background: var(--ui-green2); }
#toolbar > button i { font-style: normal; font-size: 19px; }
#toolbar .tb.off, #toolbar #camBtn:not(.on) { background: var(--ui-red2); }
#toolbar .tb.on { background: var(--ui-green2); }
#toolbar .tb.call { width: auto; display: flex; gap: 6px; padding: 0 14px; background: var(--ui-green); color: #fff; font: 600 14px Mitr, sans-serif; }
#toolbar .tb.call:hover { filter: brightness(1.06); background: var(--ui-green); }
#toolbar .tb.call.on { box-shadow: 0 0 0 3px #b9e4c9; }
#toolbar .tb.leave:hover { background: var(--ui-red2); }
#toolbar > .tb-me { width: auto; height: 44px; display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 0 10px 0 4px; max-width: 180px; }
.tb-av { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; background: #eef3ea; overflow: visible; display: grid; place-items: center; }
.tb-av canvas { width: 34px !important; height: 34px !important; border-radius: 50%; image-rendering: pixelated; }
.tb-av::after { content: ''; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #3cc36f; border: 2px solid #fff; }
.tb-who { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.2; }
.tb-who b { font-size: 13.5px; font-weight: 600; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-who small { font-size: 11.5px; color: var(--ui-sub); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.tb-sep { flex: none; width: 1px; height: 26px; background: var(--ui-line); margin: 0 5px; }
#toolbar .badge { top: -3px; right: -3px; border: 2px solid #fff; border-radius: 999px; background: var(--ui-red); }
.mob-only { display: none !important; }
.actions { left: calc((100vw + var(--side-w) - var(--chat-w)) / 2); bottom: calc(80px + var(--safe-b)); }

/* ---- เมนูเพิ่มเติม (⋯) ---- */
.more-menu { position: fixed; z-index: 9; bottom: calc(72px + var(--safe-b)); left: calc((100vw + var(--side-w) - var(--chat-w)) / 2 + 60px); min-width: 210px; display: flex; flex-direction: column; gap: 2px;
  background: #fff; border: 1px solid var(--ui-line); border-radius: 14px; box-shadow: var(--ui-shadow); padding: 6px; animation: pop .14s ease-out; }
.more-menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 9px 12px; font: 400 14px Mitr, sans-serif; color: var(--ui-text); text-align: left; }
.more-menu button:hover { background: var(--ui-hover); }
.more-menu button i { font-style: normal; width: 20px; text-align: center; }
.more-menu .danger { color: var(--ui-red); } .more-menu .danger:hover { background: var(--ui-red2); }

/* ---- แผนที่ย่อ ---- */
.mm { position: fixed; z-index: 5; right: calc(var(--chat-w) + 14px); bottom: calc(14px + var(--safe-b)); display: flex; align-items: flex-end; gap: 8px; pointer-events: none; }
.mm > * { pointer-events: auto; }
.mm-map { display: block; border: 3px solid #fff; border-radius: 14px; box-shadow: var(--ui-shadow); background: #cfe5c4; image-rendering: pixelated; cursor: pointer; }
.mm.collapsed .mm-map { display: none; }
.mm.lift { bottom: calc(76px + var(--safe-b)); }
.mm-ctl { display: flex; flex-direction: column; gap: 2px; background: #fff; border: 1px solid var(--ui-line); border-radius: 13px; box-shadow: var(--ui-shadow); padding: 4px; }
.mm-ctl button { width: 34px; height: 34px; border: 0; border-radius: 9px; background: none; font-size: 16px; color: var(--ui-text); display: grid; place-items: center; }
.mm-ctl button:hover { background: var(--ui-hover); }
.mm:not(.collapsed) #mmToggle { background: var(--ui-green2); }

/* ---- ตำแหน่งของเดิมให้หลบแถบข้าง ---- */
.chat { top: calc(12px + var(--safe-t)); bottom: calc(14px + var(--safe-b)); right: 12px; }
.people { left: calc(var(--side-w) + 12px); top: calc(56px + var(--safe-t)); }
.dock { left: calc(var(--side-w) + 12px); bottom: calc(80px + var(--safe-b)); }
.banner { top: calc(56px + var(--safe-t)); left: calc((100vw + var(--side-w) - var(--chat-w)) / 2); }

/* ---- มือถือ: แถบข้างเป็นลิ้นชักทับจอ · แถบล่างเต็มกว้าง · แผนที่ย่อซ่อนไว้ก่อน ---- */
@media (max-width: 760px), (max-height: 500px) and (orientation: landscape) {
  body.side-on, body.side-off { --side-w: 52px; }
  body.chat-open { --chat-w: 0px; }
  .side { width: min(300px, 86vw); z-index: 14; box-shadow: 8px 0 30px rgba(30, 20, 40, .25); }
  #toolbar { left: 50%; width: calc(100vw - 16px); max-width: none; bottom: calc(8px + var(--safe-b)); justify-content: space-between; padding: 5px 6px; gap: 0; }
  #toolbar > button { width: 38px; height: 38px; font-size: 18px; }
  #toolbar > .tb-me { width: 44px; padding: 0 4px; }
  .tb-who, .tb-sep, #toolbar .tb.call .lbl { display: none; }
  #toolbar .tb.call { padding: 0 12px; }
  .desk-only { display: none !important; }
  .mob-only { display: flex !important; }
  .more-menu { left: auto; right: 8px; bottom: calc(64px + var(--safe-b)); }
  .mm { right: 8px; bottom: calc(66px + var(--safe-b)); }
  .mm-map { width: 150px !important; height: auto !important; }
  .mm-ctl button { width: 32px; height: 30px; font-size: 14px; }
  .actions { left: 50%; bottom: calc(66px + var(--safe-b)); }
  .loc-pill { left: 56px; top: calc(10px + var(--safe-t)); padding: 6px 12px 6px 9px; font-size: 12.5px; max-width: calc(100vw - 68px); }
  .dock { left: auto; }
  .banner { left: 50%; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #toolbar { width: auto; left: 50%; bottom: calc(6px + var(--safe-b)); }
  #toolbar > button { width: 36px; height: 34px; }
  .mm-map { display: none !important; }
}

/* ---- ไอคอนรูป (assets/icons) ---- */
.ic { display: inline-block; width: 24px; height: 24px; background: center / contain no-repeat; font-style: normal; vertical-align: middle; }
#toolbar .ic { width: 25px; height: 25px; }
.side-open { display: grid; place-items: center; }
.side-open .ic { width: 24px; height: 24px; }
.more-menu button i.ic { width: 20px; height: 20px; }

/* ---- ปุ่มอุปกรณ์ + ลูกศรเปิดเมนูเลือก ---- */
.tb-grp { position: relative; flex: none; display: flex; align-items: center; border-radius: 11px; }
.tb-grp.hidden { display: none; }
#toolbar .tb-grp > .tb { position: relative; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 11px 0 0 11px; background: none; color: var(--ui-text); }
#toolbar .tb-grp > .tb:hover, #toolbar .tb-caret:hover { background: var(--ui-hover); }
#toolbar .tb-caret { flex: none; min-width: 0; width: 18px; height: 40px; padding: 0; border: 0; box-shadow: none; border-radius: 0 11px 11px 0; background: none; color: var(--ui-sub); font: 600 12px Mitr, sans-serif; display: grid; place-items: center; }
#toolbar .tb-grp:has(.tb.off) > *, #toolbar .tb-grp:has(#camBtn:not(.on)) > * { background: var(--ui-red2); }
#toolbar .tb-grp:has(.tb.on) > * { background: var(--ui-green2); }
#toolbar .tb-caret.open { color: var(--ui-text); box-shadow: inset 0 0 0 2px var(--ui-line); }
#toolbar .tb-grp .tb.off, #toolbar .tb-grp #camBtn:not(.on) { background: var(--ui-red2); }

.dev-pop { position: fixed; z-index: 12; width: 300px; max-width: calc(100vw - 16px); max-height: min(70vh, 520px); overflow-y: auto; background: #fff; border: 1px solid var(--ui-line);
  border-radius: 14px; box-shadow: var(--ui-shadow); padding: 8px; color: var(--ui-text); font: 400 13.5px Mitr, sans-serif; animation: pop .14s ease-out; }
.dev-pop h4 { margin: 4px 8px 6px; font: 600 12px Mitr, sans-serif; color: var(--ui-sub); letter-spacing: .02em; }
.dev-pop .dv { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 9px; padding: 8px 10px; font: inherit; color: inherit; text-align: left; }
.dev-pop .dv:hover { background: var(--ui-hover); }
.dev-pop .dv .ck { flex: none; width: 16px; color: var(--ui-green); font-weight: 700; }
.dev-pop .dv span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-pop .dv.sel { color: #1f6b42; font-weight: 600; }
.dev-pop hr { border: 0; border-top: 1px solid var(--ui-line); margin: 6px 4px; }
.dev-pop .row2 { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.dev-pop .row2 input[type=range] { flex: 1; accent-color: var(--ui-green); }
.dev-pop .row2 small { color: var(--ui-sub); min-width: 38px; text-align: right; }
.dev-pop label.row2 { cursor: pointer; }
.dev-pop .meter { flex: 1; height: 8px; border-radius: 99px; background: var(--ui-hover); overflow: hidden; }
.dev-pop .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3cc36f, #f2c94c 70%, #e24c5a); transition: width .06s linear; }
.dev-pop .note { padding: 4px 10px 6px; font-size: 12px; color: var(--ui-sub); }
.dev-pop .prev { margin: 4px 6px 6px; aspect-ratio: 4 / 3; border-radius: 10px; background: #2b2433; color: #cfc8d8; display: grid; place-items: center; overflow: hidden; font-size: 13px; }
.dev-pop .prev video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.dev-pop .prev video.back { transform: none; }
.dev-pop .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 6px 2px; }
.dev-pop .acts button { flex: 1 1 auto; border: 1px solid var(--ui-line); background: #fff; border-radius: 9px; padding: 7px 10px; font: 400 12.5px Mitr, sans-serif; color: var(--ui-text); }
.dev-pop .acts button:hover { background: var(--ui-hover); }
.dev-pop .acts button.pri { background: var(--ui-green); border-color: var(--ui-green); color: #fff; }

@media (max-width: 760px), (max-height: 500px) and (orientation: landscape) {
  #toolbar .tb-grp > .tb { width: 34px; height: 38px; }
  #toolbar .tb-caret { width: 14px; height: 38px; font-size: 10px; }
  #toolbar .ic { width: 23px; height: 23px; }
}
@media (max-height: 500px) and (orientation: landscape) { #toolbar .tb-grp > .tb, #toolbar .tb-caret { height: 34px; } }
.seg { display: flex; gap: 2px; margin: 2px 8px; padding: 3px; border-radius: 10px; background: var(--ui-hover); }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 6px 4px; font: 400 12.5px Mitr, sans-serif; color: var(--ui-sub); }
.seg button.on { background: #fff; color: #1f6b42; font-weight: 600; box-shadow: 0 1px 3px rgba(30, 20, 40, .15); }

/* ================= 🌙 ธีมมืด (body.dark) ================= */
body.dark {
  --ink: #ece6f5; --ink2: #b9b0cc; --paper: #221e2b; --paper2: #2e2939; --pink2: #5a3445;
  --ui-line: #3a3446; --ui-text: #ece6f5; --ui-sub: #9c93ad; --ui-hover: #2f2a3a; --ui-green: #2f9e63; --ui-green2: #1d3a2b; --ui-red2: #43232a;
  --ui-shadow: 0 8px 26px rgba(0, 0, 0, .5);
  --d-surf: #1c1924; --d-field: #15131b; --d-dash: #463f55;
  color-scheme: dark;
}
body.dark .side, body.dark #toolbar, body.dark .more-menu, body.dark .mm-ctl, body.dark .dev-pop, body.dark .side-open,
body.dark .dev-pop .acts button, body.dark .seg button.on { background: var(--d-surf); }
body.dark .loc-pill { background: rgba(28, 25, 36, .94); }
body.dark .loc-pill:hover { background: var(--d-surf); }
body.dark .side-search { background: var(--d-field); }
body.dark .side-search:focus-within { background: var(--d-field); }
body.dark .side .rm .c, body.dark .rm.here .c { background: var(--d-field); }
body.dark .side .rm.here { color: #8fe0b0; }
body.dark .dev-pop .dv.sel, body.dark .seg button.on { color: #8fe0b0; }
body.dark .side .mem .on-dot, body.dark .tb-av::after, body.dark #toolbar .badge { border-color: var(--d-surf); }
body.dark .mm-map { border-color: var(--d-surf); }
body.dark .tb-av, body.dark .side .mem .av { background: #2a3a2e; }
/* กล่องเก่า (แชต โมดัล ถาด) : ขอบ/เงาเข้ม พื้นมืด */
body.dark .card, body.dark .chat, body.dark .tray, body.dark .pbtn, body.dark .people, body.dark .dock, body.dark .bye-card, body.dark .toast, body.dark .banner,
body.dark .btile, body.dark .ch, body.dark .fchip { border-color: #4a4259; box-shadow: 0 3px 0 #0b0910; }
body.dark .pbtn { background: var(--paper2); color: var(--ink); }
body.dark .pbtn:hover { background: #3a3448; }
body.dark .pbtn.pink { background: #d9607f; color: #fff; }
body.dark .pbtn.on { background: #1d3a2b; }
body.dark .chat input, body.dark .field input, body.dark .num-in, body.dark .vset select, body.dark .vmeter, body.dark .mon, body.dark .sys.help, body.dark pre.diag,
body.dark .ch, body.dark .btile, body.dark .fchip, body.dark .gl-opt { background: var(--d-field); color: var(--ink); border-color: #4a4259; }
body.dark .chat header, body.dark .chat form, body.dark .card.split .foot, body.dark .sys.help, body.dark pre.diag { border-color: var(--d-dash); }
body.dark .msg .meta time, body.dark .sys { color: #8a819b; }
body.dark .modal { background: rgba(8, 6, 12, .66); }
body.dark select, body.dark input[type=text], body.dark textarea { background: var(--d-field); color: var(--ink); }
body.dark .ic { filter: brightness(1.35); }
body.dark .tb-grp .ic-mic_off, body.dark .tb-grp .ic-cam_off, body.dark .tb-grp .ic-hp_off, body.dark .ic-leave { filter: brightness(1.15) saturate(1.1); }
body.dark { color: var(--ink); }
body.dark .chat, body.dark .rooms { background: rgba(34, 30, 43, .97); }
body.dark .toast { background: #0e0c13; color: #ece6f5; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
body.dark .banner, body.dark .focus-cap { color: #2e2235; }
body.dark .btile .x { background: rgba(28, 25, 36, .9); }
/* แถบข้างล่าง: 4 ปุ่ม (บัญชี · วิธีใช้ · ตั้งค่า · ธีม) ไอคอนบน ชื่อล่าง */
.side-foot { grid-template-columns: repeat(4, 1fr); gap: 2px; }
.side-foot button { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11.5px; }
.side-foot button i { font-style: normal; font-size: 17px; line-height: 1.1; }
/* กล่องที่เดิมใช้สีหมึกเป็นพื้น (เครื่องเล่น YouTube / แชร์จอ) */
body.dark .yt { background: #120f18; border-color: #4a4259; box-shadow: 0 5px 0 #0b0910; }
body.dark .yt.onscreen { background: transparent; }
body.dark .ytvol { color: var(--ink2); }
body.dark .cam-prev { border-color: #4a4259; }
/* ---- แท็บแชต: 🌐 ทุกห้อง / เฉพาะห้อง ---- */
.chat header { gap: 6px; }
.ctabs { flex: 1; min-width: 0; display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: var(--paper2); }
.ctabs button { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; border-radius: 8px;
  padding: 5px 6px; font: 500 12.5px Mitr, sans-serif; color: var(--ink2); white-space: nowrap; }
.ctabs button span { overflow: hidden; text-overflow: ellipsis; }
.ctabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(30, 20, 40, .15); }
.ctabs button[data-ct="room"].on { background: #fff4d6; }
.ctabs .cnt { flex: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--red); color: #fff; font: 600 10px/16px Mitr, sans-serif; font-style: normal; }
#helpBtn { margin-left: 0; margin-right: 0; padding: 3px 7px; }
body.dark .ctabs button.on { background: var(--d-surf); }
body.dark .ctabs button[data-ct="room"].on { background: #3a3220; }
/* 💬 ข้างชื่อห้อง */
.side .rm .cht { position: relative; flex: none; width: 26px; height: 24px; display: grid; place-items: center; border-radius: 7px; opacity: .6; }
.side .rm .cht .ic { width: 18px; height: 18px; }
.side .rm:hover .cht, .side .rm.here .cht { opacity: 1; }
.side .rm .cht:hover { background: rgba(0, 0, 0, .06); }
.side .rm .cht b { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 99px; background: var(--ui-red); color: #fff; font: 600 9.5px/15px Mitr, sans-serif; text-align: center; }
body.dark .side .rm .cht:hover { background: rgba(255, 255, 255, .08); }

/* ================= 📊 แผงแอดมิน ================= */
.card.adm-card { width: min(820px, 100%); height: min(760px, calc(100dvh - 24px)); display: flex; flex-direction: column; overflow: hidden; padding: 16px 18px 12px; }
.adm-head { flex: none; display: flex; align-items: center; gap: 8px; }
.adm-head h2 { margin: 0; flex: 1; }
.adm-tabs { flex: none; margin: 10px 0 8px; }
.adm-tabs button { padding: 7px 6px; font-size: 13.5px; }
.adm-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 8px 2px; }
.adm-empty { padding: 26px 10px; text-align: center; color: var(--ink2); font-size: 14px; }
.adm-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
.adm-stat { background: #fff; border: 2px solid #ead9c8; border-radius: 12px; padding: 9px 11px; }
.adm-stat .l { font-size: 12px; color: var(--ink2); }
.adm-stat .v { font: 600 21px 'Mitr', sans-serif; line-height: 1.3; }
.adm-stat .s { font-size: 11.5px; color: var(--ink2); }
.adm-box { background: #fff; border: 2px solid #ead9c8; border-radius: 12px; padding: 10px 12px 12px; margin-bottom: 10px; }
.adm-boxh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.adm-boxh b { flex: 1; font-size: 14px; }
.adm-boxh .seg { margin: 0; }
.adm-bars { height: 150px; display: flex; align-items: stretch; gap: 3px; padding: 14px 0 18px; }
.adm-bars .bar { position: relative; flex: 1; display: flex; align-items: flex-end; }
.adm-bars .bar i { width: 100%; border-radius: 4px 4px 1px 1px; background: #9ad4b1; min-height: 0; }
.adm-bars .bar.today i { background: var(--ui-green, #2f9e63); }
.adm-bars .bar:hover i { background: #f2a3b9; }
.adm-bars .bar .n { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--h, 0%) + 2px); font-size: 9.5px; color: var(--ink2); display: none; }
.adm-bars .bar .d { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; font-size: 10px; color: var(--ink2); white-space: nowrap; }
.adm-hbar { display: grid; grid-template-columns: 130px 1fr 92px; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
.adm-hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-hbar .tr { height: 10px; border-radius: 99px; background: var(--paper2); overflow: hidden; }
.adm-hbar .tr i { display: block; height: 100%; background: linear-gradient(90deg, #f2a3b9, #b79cf0); border-radius: 99px; }
.adm-hbar .vv { text-align: right; color: var(--ink2); font-size: 12px; }
.adm-tools { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 0 0 8px; background: var(--paper); }
.adm-tools input { flex: 1; min-width: 0; border: 2px solid #ead9c8; border-radius: 10px; padding: 7px 10px; font: 400 14px Mitr, sans-serif; background: #fff; color: var(--ink); }
.adm-tools .cnt { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.adm-user { background: #fff; border: 2px solid #ead9c8; border-radius: 12px; margin-bottom: 6px; overflow: hidden; }
.adm-user.open { border-color: #d9b7e8; }
.adm-user .um { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 12px; font: inherit; color: inherit; text-align: left; }
.adm-user .um:hover { background: var(--ui-hover, #f3f1f6); }
.adm-user .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #cfc6d6; }
.adm-user.on .dot { background: #3cc36f; box-shadow: 0 0 0 3px rgba(60, 195, 111, .2); }
.adm-user .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.adm-user .who b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-user .who small { font-size: 11.5px; color: var(--ink2); }
.adm-user .gift { flex: none; font-size: 12px; color: #b0559a; }
.adm-user .nums { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-size: 11.5px; color: var(--ink2); }
.adm-user .chev { flex: none; color: var(--ink2); font-size: 12px; }
.adm-user .ud { padding: 4px 12px 12px; border-top: 2px dashed #ead9c8; }
.adm-user .uinfo { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); padding: 6px 0 8px; }
.adm-user .uh { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.adm-user .uitems { display: flex; flex-wrap: wrap; gap: 6px; }
.adm-user .uit { display: flex; align-items: center; gap: 5px; border: 2px solid #ead9c8; background: #fff; border-radius: 99px; padding: 4px 11px 4px 6px; font: 400 13px Mitr, sans-serif; color: var(--ink); }
.adm-user .uit .ck { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--paper2); font-size: 12px; font-weight: 700; }
.adm-user .uit.has { border-color: #8fd4a8; background: #eaf8ef; }
.adm-user .uit.has .ck { background: #3cc36f; color: #fff; }
.adm-user .uit:hover { border-color: #d9b7e8; }
.adm-user .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.adm-day { position: sticky; top: 0; background: var(--paper); font: 600 12.5px Mitr, sans-serif; color: var(--ink2); padding: 8px 2px 4px; }
.adm-ev { display: grid; grid-template-columns: 46px 22px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; font-size: 13px; }
.adm-ev:nth-child(odd) { background: rgba(0, 0, 0, .025); }
.adm-ev .t { color: var(--ink2); font-size: 12px; }
.adm-ev .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-ev .what { color: var(--ink2); font-size: 12px; text-align: right; }
.adm-ev.in .what { color: #2f9e63; }
@media (max-width: 760px) {
  .card.adm-card { height: calc(100dvh - 24px); padding: 12px; }
  .adm-stats { grid-template-columns: repeat(2, 1fr); }
  .adm-hbar { grid-template-columns: 100px 1fr 70px; }
  .adm-user .nums { display: none; }
}
body.dark .adm-stat, body.dark .adm-box, body.dark .adm-user, body.dark .adm-user .uit, body.dark .adm-tools input { background: var(--d-surf); border-color: #3a3446; }
body.dark .adm-user .ud { border-color: #3a3446; }
body.dark .adm-user .uit.has { background: #1d3a2b; border-color: #2f7a4f; }
body.dark .adm-ev:nth-child(odd) { background: rgba(255, 255, 255, .03); }
.seg button { white-space: nowrap; }
/* ⋯ จัดการคน (แอดมิน/ผู้ดูแล) */
.side .mem .mod { flex: none; width: 26px; height: 24px; border: 0; border-radius: 7px; background: none; color: var(--ui-sub); font: 700 15px/1 Mitr, sans-serif; opacity: 0; }
.side .mem:hover .mod, .side .mem .mod:focus { opacity: 1; }
.side .mem .mod:hover { background: rgba(0, 0, 0, .07); color: var(--ui-text); }
@media (hover: none) { .side .mem .mod { opacity: 1; } }
.mod-pop { width: 240px; z-index: 30; }
.dev-pop .dv.danger { color: #c63b4f; }
body.dark .dev-pop .dv.danger { color: #ff8a9a; }
.adm-user .modacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.adm-user .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #e9e1f7; color: #5b3f8c; margin-left: 4px; font-weight: 500; }
.adm-user .tag.lock { background: #fde2e6; color: #b03247; }
body.dark .adm-user .tag { background: #3a3150; color: #d6c6f5; }
body.dark .adm-user .tag.lock { background: #4a2530; color: #ffb3bf; }
.num-in.pn-in { width: min(240px, 100%); text-align: left; letter-spacing: 0; font-size: 15px; }
/* ธีมมืด: ตัวเลือกที่เลือกอยู่ต้องเห็นชัด (เดิมถูกพื้นมืดทับจนดูเหมือนกดไม่ติด) */
body.dark .ch.sel { background: #f2c94c; color: #2e2235; border-color: #f2c94c; box-shadow: 0 2px 0 #0b0910; font-weight: 600; }
body.dark .ch:hover:not(.sel) { background: #2f2a3a; }
body.dark .sw.sel { outline-color: #ff8fab; }

<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <!-- จุดบอกตำแหน่ง (ห้องที่อยู่ + ใครอยู่ใกล้) มุมบนซ้ายของพื้นที่เกม -->
  <button class="loc-pill" id="zoneChip" title="ตั้งรัศมีไมค์"><span class="pin">📍</span><b id="zoneName">ห้องรวม</b><span class="near" id="nearTxt"></span></button>
  <div class="banner hidden" id="banner"></div>

  <section class="panel people hidden" id="people">
    <header><b>ใครอยู่ในห้อง</b><button class="x" data-close="people">✕</button></header>
    <ul id="peopleList"></ul>
    <p class="note" id="shareNote"></p>
    <div class="leave-row"><button class="pbtn sm" id="diagBtn">🩺 ตรวจเสียง</button><button class="pbtn sm danger" id="leaveBtn">🚪 ออกจากห้อง</button></div>
  </section>

  <!-- แถบข้างซ้าย: ชื่อห้อง/ออนไลน์ · ชวนเพื่อน · ค้นหา · ห้องทั้งหมด (+คนในห้อง) · บัญชี/วิธีใช้/ตั้งค่า -->
  <button class="side-open hidden" id="roomsTab" title="เปิดแถบห้อง"><i class="ic ic-ppl"></i></button>
  <aside class="side hidden" id="rooms">
    <header class="side-head">
      <button class="side-title" id="roomChip" title="ดูว่าใครอยู่บ้าง">
        <b id="roomName">Pixel Hangout</b>
        <small><span class="dot" id="connDot"></span>ออนไลน์ <span id="onlineCount">1</span> คน</small>
      </button>
      <button class="ib" id="roomsClose" title="ซ่อนแถบข้าง">‹</button>
    </header>
    <button class="side-invite" id="inviteBtn">＋ ชวนเพื่อนเข้าห้อง</button>
    <label class="side-search"><span>⌕</span><input id="sideSearch" placeholder="ค้นหาคนหรือห้อง" autocomplete="off" /></label>
    <div class="side-sub">ห้องทั้งหมด</div>
    <div id="roomsList"></div>
    <footer class="side-foot">
      <button id="sfAccount"><i>👤</i>บัญชี</button>
      <button id="sfHelp"><i>❔</i>วิธีใช้</button>
      <button id="sfSettings"><i>⚙️</i>ตั้งค่า</button>
      <button id="sfTheme"><i id="themeIc">🌙</i><span id="themeTxt">ธีมมืด</span></button>
    </footer>
  </aside>

  <div class="actions" id="actions"></div>

  <div class="tray hidden" id="emoteTray"></div>
  <div class="tray hidden" id="statusTray"></div>
  <div class="tray edit hidden" id="editTray">
    <div class="cats" id="paletteCats"></div>
    <div class="tray-scroll" id="paletteList"></div>
    <button class="pbtn pink" id="editDone">เสร็จ</button>
  </div>
  <div class="selbar hidden" id="selBar">
    <button class="pbtn sm" data-sel="color">🎨 สี</button>
    <button class="pbtn sm" data-sel="flip">🔄 หมุน</button>
    <button class="pbtn sm danger" data-sel="delete">🗑️ ลบ</button>
  </div>

  <!-- แถบควบคุมล่างกลาง: ตัวเรา · ไมค์ หูฟัง กล้อง แชร์จอ · อีโมต สถานะ แชต · เพิ่มเติม · ออก -->
  <nav class="toolbar" id="toolbar">
    <button class="tb-me" data-tool="look" title="แต่งตัว / บัญชี"><span class="tb-av" id="meHead"></span><span class="tb-who"><b id="meName">คุณ</b><small id="meSt">ว่าง</small></span></button>
    <span class="tb-sep"></span>
    <button class="tb call" id="callBtn" title="เข้าห้องคุยเสียง">🎧<span class="lbl">เข้าห้องเสียง</span></button>
    <span class="tb-grp hidden" id="micGrp"><button class="tb" id="micBtn" title="ไมค์"><i class="ic ic-mic_on"></i></button><button class="tb-caret" data-dev="mic" title="เลือกไมค์ / ทดสอบเสียง">▾</button></span>
    <span class="tb-grp hidden" id="deafGrp"><button class="tb" id="deafBtn" title="ปิดเสียงเพื่อน (หูฟัง)"><i class="ic ic-hp_on"></i></button><button class="tb-caret" data-dev="spk" title="เลือกลำโพง / หูฟัง · ทดสอบเสียง">▾</button></span>
    <span class="tb-grp hidden" id="camGrp"><button class="tb" id="camBtn" title="กล้อง"><i class="ic ic-cam_off"></i></button><button class="tb-caret" data-dev="cam" title="เลือกกล้อง / ดูภาพตัวเอง">▾</button></span>
    <button class="tb hidden" id="shareBtn" title="แชร์จอ"><i class="ic ic-scr_off"></i></button>
    <span class="tb-sep"></span>
    <button class="tb desk-only" data-tool="emote" title="อีโมต"><i class="ic ic-emote"></i></button>
    <button class="tb desk-only" data-tool="status" title="สถานะ"><i id="statusIcon">📝</i></button>
    <button class="tb" data-tool="chat" title="แชต"><i class="ic ic-chat"></i><b class="badge hidden" id="chatBadge">0</b></button>
    <button class="tb" id="moreBtn" title="เพิ่มเติม">⋯</button>
    <button class="tb leave" id="leaveTop" title="ออกจากห้อง / ออกจากเว็บ"><i class="ic ic-leave"></i></button>
  </nav>
  <div class="more-menu hidden" id="moreMenu">
    <button data-tool="look"><i>👕</i>แต่งตัว</button>
    <button data-tool="desk"><i>🖥️</i>โต๊ะฉัน</button>
    <button data-tool="edit"><i>🛋️</i>จัดห้อง</button>
    <button class="mob-only" data-tool="emote"><i class="ic ic-emote"></i>อีโมต</button>
    <button class="mob-only" data-tool="status"><i>📝</i>สถานะ</button>
    <button class="hidden" id="voiceSetBtn"><i>⚙️</i>ตั้งค่าไมค์ / กล้อง</button>
    <button id="moreAdmin" class="hidden"><i>📊</i>แผงแอดมิน</button>
    <button id="moreDiag"><i>🩺</i>ตรวจเสียง</button>
    <button id="moreLeave" class="danger"><i class="ic ic-leave"></i>ออกจากห้อง</button>
  </div>

  <!-- เมนูเลือกอุปกรณ์ (ลูกศรข้างปุ่มไมค์/กล้อง/หูฟัง) -->
  <div class="dev-pop hidden" id="devPop"></div>

  <!-- แผนที่ย่อ + ปุ่มกล้อง มุมล่างขวา -->
  <div class="mm" id="mm">
    <canvas class="mm-map" id="mmCanvas" title="แตะเพื่อเดินไปตรงนั้น"></canvas>
    <div class="mm-ctl">
      <button id="mmMe" title="กลับมาที่ตัวฉัน">◎</button>
      <button id="zoomIn" title="ซูมเข้า">＋</button>
      <button id="zoomOut" title="ซูมออก">－</button>
      <button id="mmFull" title="เต็มจอ">⛶</button>
      <button id="mmToggle" title="เปิด/ปิดแผนที่ย่อ">🗺️</button>
    </div>
  </div>

  <aside class="chat" id="chat">
    <header><div class="ctabs" id="chatTabs"><button data-ct="all" title="แชตที่ทุกคนเห็น">🌐 ทุกห้อง<i class="cnt hidden"></i></button><button data-ct="room" title="แชตเฉพาะคนในห้องที่คุณอยู่"><span id="ctRoom">🏠 ห้องนี้</span><i class="cnt hidden"></i></button></div><button class="pbtn sm" id="helpBtn" title="ดูคำสั่งที่ใช้ได้">❓</button><button class="x" id="chatClose">✕</button></header>
    <div class="msgs" id="msgs"></div>
    <div class="attach-prog hidden" id="attachProg"><i></i></div>
    <form id="chatForm" autocomplete="off">
      <button class="pbtn attach" type="button" id="attachBtn" title="แนบรูป/ไฟล์ (หรือวาง/ลากไฟล์มาใส่)">📎</button>
      <input id="attachInput" type="file" multiple hidden />
      <input id="chatInput" maxlength="200" placeholder="พิมพ์ข้อความ… (help = ดูคำสั่ง)" enterkeyhint="send" />
      <button class="pbtn pink" type="submit">ส่ง</button>
    </form>
  </aside>
</div>

<div class="loading" id="loading"><div class="spinner"></div><p>กำลังเปิดห้อง…</p></div>
<div class="modal hidden" id="modal"><div class="card" id="card"></div></div>
  <section class="panel micpop hidden" id="micPop">
        <header><b>⭕ รัศมีไมค์</b><button class="x" id="micPopClose">✕</button></header>
        <div class="micpop-body" id="micPopBody"></div>
      </section>
  <div class="dock" id="dock">
<section class="yt hidden" id="scrPanel">
  <header>
    <b id="scrTitle">🖥️ แชร์จอ</b>
    <div class="ytbtns">
      <button id="scrStop" class="hidden" title="หยุดแชร์">⏹️</button>
      <button id="scrPip" title="ป๊อปเอาต์ (ลอยทับแอปอื่นได้)">🗗</button>
      <button id="scrFull" title="เต็มจอ">⛶</button>
      <button id="scrMin" title="ย่อ">➖</button>
      <button id="scrBig" title="ขยาย">⤢</button>
      <button id="scrHide" title="ซ่อน (เฉพาะเรา)">✕</button>
    </div>
  </header>
  <div class="scrtabs hidden" id="scrTabs"></div>
  <div class="ytbox"><video id="scrVideo" autoplay playsinline muted></video><span class="live-badge">🔴 LIVE</span></div>
  <p class="scr-info hidden" id="scrInfo"></p>
</section>
<section class="yt hidden" id="ytPanel">
  <header>
    <b id="ytTitle">📺 จอ</b>
    <div class="ytbtns">

  for (let k = 0; k < tiers; k++) {

    const ro = Math.round(rows * 0.55), ho = halfAt(k, ro);

  }

    for (let k = 0; k < tiers; k++) {
      const y0 = top + k * step;

  },

    lights.forEach(([x, y], i) => { if ((i + f) % 3 === 0) return; ctx.fillStyle = COL[(i + f) % COL.length]; ctx.fillRect(ox + x, oy + y, 2, 2); });

];
const RUG_COLORS = [['none', 'ไม่มี', null], ['pink', 'ชมพู', '#ffc6d6'], ['blue', 'ฟ้า', '#b9cbff'], ['green', 'เขียว', '#c4f0c8'], ['yellow', 'เหลือง', '#ffe9a8'], ['purple', 'ม่วง', '#dcc8ff']];
const DEFAULT_DESK = { c: 0, s: 'monitor', ch: 5, items: ['plant', 'coffee'], rug: 'none' };

function cleanDesk(s) {
  const o = { ...DEFAULT_DESK, items: [...DEFAULT_DESK.items] };
  if (!s || typeof s !== 'object') return o;
  if (Number.isInteger(s.c) && s.c >= 0 && s.c < DESK_COLORS.length) o.c = s.c;
  if (SETUPS.some((x) => x[0] === s.s)) o.s = s.s;
  if (Number.isInteger(s.ch) && s.ch >= 0 && s.ch < COLORWAYS.length) o.ch = s.ch;
  if (Array.isArray(s.items)) o.items = s.items.filter((k) => DESK_ITEMS.some((x) => x[0] === k)).slice(0, 3);
  if (RUG_COLORS.some((x) => x[0] === s.rug)) o.rug = s.rug;
  return o;
}

function drawDeskItem(P, kind, x, y) {
  // x = กึ่งกลาง, y = ฐาน
  switch (kind) {
    case 'plant': P(x - 2, y - 3, 4, 3, '#c96a4a'); P(x - 3, y - 7, 6, 4, '#62b56c'); P(x - 1, y - 9, 2, 2, '#8fd694'); P(x - 4, y - 6, 1, 2, '#3fa37a'); P(x + 3, y - 6, 1, 2, '#3fa37a'); break;
    case 'cactus': P(x - 2, y - 3, 4, 3, '#e08a62'); P(x - 1, y - 9, 3, 6, '#3fa37a'); P(x - 3, y - 7, 2, 3, '#3fa37a'); P(x + 2, y - 8, 1, 3, '#3fa37a'); P(x, y - 10, 1, 1, '#ff8fab'); break;
    case 'coffee': P(x - 2, y - 4, 4, 4, '#ffffff'); P(x + 2, y - 3, 1, 2, '#ffffff'); P(x - 1, y - 4, 2, 1, '#9a6438'); break;
    case 'boba': P(x - 2, y - 6, 4, 6, '#f2d6b0'); P(x - 2, y - 2, 4, 2, '#5a3a2a'); P(x - 2, y - 7, 4, 1, '#ffffff'); P(x + 1, y - 10, 1, 4, '#ff8fab'); break;
    case 'cat': P(x - 4, y - 5, 8, 5, '#f2a65a'); P(x - 4, y - 7, 2, 2, '#f2a65a'); P(x + 2, y - 7, 2, 2, '#f2a65a'); P(x - 2, y - 4, 1, 1, '#2e2235'); P(x + 1, y - 4, 1, 1, '#2e2235'); P(x + 4, y - 2, 2, 1, '#f2a65a'); break;
    case 'lamp': P(x - 2, y - 1, 5, 1, '#5a5f7a'); P(x, y - 7, 1, 6, '#5a5f7a'); P(x - 2, y - 10, 5, 3, '#ffe07a'); P(x - 1, y - 8, 3, 1, '#fff6c8'); break;
    case 'books': P(x - 4, y - 2, 8, 2, '#e8505b'); P(x - 3, y - 4, 7, 2, '#7d9cf0'); P(x - 4, y - 6, 6, 2, '#ffe07a'); break;
    case 'duck': P(x - 2, y - 3, 5, 3, '#ffe07a'); P(x - 2, y - 6, 3, 3, '#ffe07a'); P(x - 3, y - 5, 1, 1, '#ff9a3c'); P(x - 1, y - 5, 1, 1, '#2e2235'); break;
    case 'robot': P(x - 2, y - 4, 4, 4, '#9aa0b8'); P(x - 2, y - 7, 4, 3, '#c8ccd8'); P(x - 1, y - 6, 1, 1, '#6cc6d9'); P(x + 1, y - 6, 1, 1, '#6cc6d9'); P(x, y - 9, 1, 2, '#e8505b'); break;
    case 'notes': P(x - 3, y - 3, 3, 3, '#ffe07a'); P(x, y - 4, 3, 3, '#ff8fab'); P(x - 2, y - 6, 3, 3, '#8fd694'); break;
    case 'photo': P(x - 3, y - 6, 6, 6, '#f4f1e8'); P(x - 2, y - 5, 4, 4, '#ffc6d6'); P(x - 1, y - 4, 1, 1, '#e8505b'); P(x + 1, y - 4, 1, 1, '#e8505b'); P(x - 1, y - 3, 3, 1, '#e8505b'); P(x, y - 2, 1, 1, '#e8505b'); break;
    case 'donut': P(x - 3, y - 3, 6, 3, '#d9a066'); P(x - 3, y - 4, 6, 2, '#ff8fab'); P(x - 1, y - 3, 2, 1, '#9a6438'); P(x - 2, y - 4, 1, 1, '#ffe07a'); P(x + 2, y - 4, 1, 1, '#7d9cf0'); break;
