<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2e2235" />
<title>Pixel Hangout</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
/*CSS*/
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <!-- จุดบอกตำแหน่ง (ห้องที่อยู่ + ใครอยู่ใกล้) มุมบนซ้ายของพื้นที่เกม -->
  <button class="loc-pill" id="zoneChip" title="ตั้งรัศมีไมค์"><span class="pin">📍</span><b id="zoneName">ห้องรวม</b><span class="near" id="nearTxt"></span></button>
  <div class="banner hidden" id="banner"></div>

  <section class="panel people hidden" id="people">
    <header><b>ใครอยู่ในห้อง</b><button class="x" data-close="people">✕</button></header>
    <ul id="peopleList"></ul>
    <p class="note" id="shareNote"></p>
    <div class="leave-row"><button class="pbtn sm" id="diagBtn">🩺 ตรวจเสียง</button><button class="pbtn sm danger" id="leaveBtn">🚪 ออกจากห้อง</button></div>
  </section>

  <!-- แถบข้างซ้าย: ชื่อห้อง/ออนไลน์ · ชวนเพื่อน · ค้นหา · ห้องทั้งหมด (+คนในห้อง) · บัญชี/วิธีใช้/ตั้งค่า -->
  <button class="side-open hidden" id="roomsTab" title="เปิดแถบห้อง"><i class="ic ic-ppl"></i></button>
  <aside class="side hidden" id="rooms">
    <header class="side-head">
      <button class="side-title" id="roomChip" title="ดูว่าใครอยู่บ้าง">
        <b id="roomName">Pixel Hangout</b>
        <small><span class="dot" id="connDot"></span>ออนไลน์ <span id="onlineCount">1</span> คน</small>
      </button>
      <button class="ib" id="roomsClose" title="ซ่อนแถบข้าง">‹</button>
    </header>
    <button class="side-invite" id="inviteBtn">＋ ชวนเพื่อนเข้าห้อง</button>
    <label class="side-search"><span>⌕</span><input id="sideSearch" placeholder="ค้นหาคนหรือห้อง" autocomplete="off" /></label>
    <div class="side-sub">ห้องทั้งหมด</div>
    <div id="roomsList"></div>
    <footer class="side-foot">
      <button id="sfAccount"><i>👤</i>บัญชี</button>
      <button id="sfHelp"><i>❔</i>วิธีใช้</button>
      <button id="sfSettings"><i>⚙️</i>ตั้งค่า</button>
      <button id="sfTheme"><i id="themeIc">🌙</i><span id="themeTxt">ธีมมืด</span></button>
    </footer>
  </aside>

  <div class="actions" id="actions"></div>

  <div class="tray hidden" id="emoteTray"></div>
  <div class="tray hidden" id="statusTray"></div>
  <div class="tray edit hidden" id="editTray">
    <div class="cats" id="paletteCats"></div>
    <div class="tray-scroll" id="paletteList"></div>
    <button class="pbtn pink" id="editDone">เสร็จ</button>
  </div>
  <div class="selbar hidden" id="selBar">
    <button class="pbtn sm" data-sel="color">🎨 สี</button>
    <button class="pbtn sm" data-sel="flip">🔄 หมุน</button>
    <button class="pbtn sm danger" data-sel="delete">🗑️ ลบ</button>
  </div>

  <!-- แถบควบคุมล่างกลาง: ตัวเรา · ไมค์ หูฟัง กล้อง แชร์จอ · อีโมต สถานะ แชต · เพิ่มเติม · ออก -->
  <nav class="toolbar" id="toolbar">
    <button class="tb-me" data-tool="look" title="แต่งตัว / บัญชี"><span class="tb-av" id="meHead"></span><span class="tb-who"><b id="meName">คุณ</b><small id="meSt">ว่าง</small></span></button>
    <span class="tb-sep"></span>
    <button class="tb call" id="callBtn" title="เข้าห้องคุยเสียง">🎧<span class="lbl">เข้าห้องเสียง</span></button>
    <span class="tb-grp hidden" id="micGrp"><button class="tb" id="micBtn" title="ไมค์"><i class="ic ic-mic_on"></i></button><button class="tb-caret" data-dev="mic" title="เลือกไมค์ / ทดสอบเสียง">▾</button></span>
    <span class="tb-grp hidden" id="deafGrp"><button class="tb" id="deafBtn" title="ปิดเสียงเพื่อน (หูฟัง)"><i class="ic ic-hp_on"></i></button><button class="tb-caret" data-dev="spk" title="เลือกลำโพง / หูฟัง · ทดสอบเสียง">▾</button></span>
    <span class="tb-grp hidden" id="camGrp"><button class="tb" id="camBtn" title="กล้อง"><i class="ic ic-cam_off"></i></button><button class="tb-caret" data-dev="cam" title="เลือกกล้อง / ดูภาพตัวเอง">▾</button></span>
    <button class="tb hidden" id="shareBtn" title="แชร์จอ"><i class="ic ic-scr_off"></i></button>
    <span class="tb-sep"></span>
    <button class="tb desk-only" data-tool="emote" title="อีโมต"><i class="ic ic-emote"></i></button>
    <button class="tb desk-only" data-tool="status" title="สถานะ"><i id="statusIcon">📝</i></button>
    <button class="tb" data-tool="chat" title="แชต"><i class="ic ic-chat"></i><b class="badge hidden" id="chatBadge">0</b></button>
    <button class="tb" id="moreBtn" title="เพิ่มเติม">⋯</button>
    <button class="tb leave" id="leaveTop" title="ออกจากห้อง / ออกจากเว็บ"><i class="ic ic-leave"></i></button>
  </nav>
  <div class="more-menu hidden" id="moreMenu">
    <button data-tool="look"><i>👕</i>แต่งตัว</button>
    <button data-tool="desk"><i>🖥️</i>โต๊ะฉัน</button>
    <button data-tool="edit"><i>🛋️</i>จัดห้อง</button>
    <button class="mob-only" data-tool="emote"><i class="ic ic-emote"></i>อีโมต</button>
    <button class="mob-only" data-tool="status"><i>📝</i>สถานะ</button>
    <button class="hidden" id="voiceSetBtn"><i>⚙️</i>ตั้งค่าไมค์ / กล้อง</button>
    <button id="moreDiag"><i>🩺</i>ตรวจเสียง</button>
    <button id="moreLeave" class="danger"><i class="ic ic-leave"></i>ออกจากห้อง</button>
  </div>

  <!-- เมนูเลือกอุปกรณ์ (ลูกศรข้างปุ่มไมค์/กล้อง/หูฟัง) -->
  <div class="dev-pop hidden" id="devPop"></div>

  <!-- แผนที่ย่อ + ปุ่มกล้อง มุมล่างขวา -->
  <div class="mm" id="mm">
    <canvas class="mm-map" id="mmCanvas" title="แตะเพื่อเดินไปตรงนั้น"></canvas>
    <div class="mm-ctl">
      <button id="mmMe" title="กลับมาที่ตัวฉัน">◎</button>
      <button id="zoomIn" title="ซูมเข้า">＋</button>
      <button id="zoomOut" title="ซูมออก">－</button>
      <button id="mmFull" title="เต็มจอ">⛶</button>
      <button id="mmToggle" title="เปิด/ปิดแผนที่ย่อ">🗺️</button>
    </div>
  </div>

  <aside class="chat" id="chat">
    <header><b>💌 แชตในห้อง</b><button class="pbtn sm" id="helpBtn" title="ดูคำสั่งที่ใช้ได้">❓ คำสั่ง</button><button class="x" id="chatClose">✕</button></header>
    <div class="msgs" id="msgs"></div>
    <div class="attach-prog hidden" id="attachProg"><i></i></div>
    <form id="chatForm" autocomplete="off">
      <button class="pbtn attach" type="button" id="attachBtn" title="แนบรูป/ไฟล์ (หรือวาง/ลากไฟล์มาใส่)">📎</button>
      <input id="attachInput" type="file" multiple hidden />
      <input id="chatInput" maxlength="200" placeholder="พิมพ์ข้อความ… (help = ดูคำสั่ง)" enterkeyhint="send" />
      <button class="pbtn pink" type="submit">ส่ง</button>
    </form>
  </aside>
</div>

<div class="loading" id="loading"><div class="spinner"></div><p>กำลังเปิดห้อง…</p></div>
<div class="modal hidden" id="modal"><div class="card" id="card"></div></div>
  <section class="panel micpop hidden" id="micPop">
        <header><b>⭕ รัศมีไมค์</b><button class="x" id="micPopClose">✕</button></header>
        <div class="micpop-body" id="micPopBody"></div>
      </section>
  <div class="dock" id="dock">
<section class="yt hidden" id="scrPanel">
  <header>
    <b id="scrTitle">🖥️ แชร์จอ</b>
    <div class="ytbtns">
      <button id="scrStop" class="hidden" title="หยุดแชร์">⏹️</button>
      <button id="scrPip" title="ป๊อปเอาต์ (ลอยทับแอปอื่นได้)">🗗</button>
      <button id="scrFull" title="เต็มจอ">⛶</button>
      <button id="scrMin" title="ย่อ">➖</button>
      <button id="scrBig" title="ขยาย">⤢</button>
      <button id="scrHide" title="ซ่อน (เฉพาะเรา)">✕</button>
    </div>
  </header>
  <div class="scrtabs hidden" id="scrTabs"></div>
  <div class="ytbox"><video id="scrVideo" autoplay playsinline muted></video><span class="live-badge">🔴 LIVE</span></div>
  <p class="scr-info hidden" id="scrInfo"></p>
</section>
<section class="yt hidden" id="ytPanel">
  <header>
    <b id="ytTitle">📺 จอ</b>
    <div class="ytbtns">
      <button id="ytToggle" title="เล่น/หยุด ให้ทุกคน">⏯️</button>
      <button id="ytVolBtn" title="ปรับเสียงในเครื่องฉัน">🔊</button>
      <button id="ytMin" title="ย่อ (ฟังอย่างเดียว ไม่ต้องเห็นภาพ)">➖</button>
      <button id="ytBig" title="ขยาย">⤢</button>
      <button id="ytHide" title="ซ่อน (เฉพาะเรา)">✕</button>
    </div>
  </header>
  <div class="ytvol hidden" id="ytVolRow">
    <span>เสียงในเครื่องฉัน</span><input type="range" id="ytVol" min="0" max="100" step="1" /><b id="ytVolNum">100</b>
    <button id="ytMute" title="ปิดเสียงในเครื่องฉัน">🔇</button>
  </div>
  <div class="ytbox"><div id="ytPlayer"></div><button class="pbtn pink hidden" id="ytTap">▶ แตะเพื่อดูด้วยกัน</button></div>
</section>
</div>
<div class="focus hidden" id="focus"><div class="focus-in"><video id="focusVideo" autoplay playsinline muted></video><p class="focus-cap hidden" id="focusCap"></p></div></div>
<div class="toast" id="toast"></div>

<script>
/*JS*/
</script>
</body>
</html>
